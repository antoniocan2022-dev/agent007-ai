name: CEO Trust Boundary Deep Audit

on:
  pull_request:
    paths:
      - 'src/app/api/agent/route.ts'
      - 'src/app/api/conversations/[id]/route.ts'
      - 'src/lib/ceo-*.ts'
      - 'scripts/ceo-*-audit.ts'
      - 'tests/ceo-*.test.ts'
      - '.github/CODEOWNERS'
      - '.github/workflows/ceo-*.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'src/app/api/agent/route.ts'
      - 'src/app/api/conversations/[id]/route.ts'
      - 'src/lib/ceo-*.ts'
      - 'scripts/ceo-*-audit.ts'
      - 'tests/ceo-*.test.ts'
      - '.github/CODEOWNERS'
      - '.github/workflows/ceo-*.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ten-point trust boundary deep audit
        run: bun run audit:ceo-trust-boundary

      - name: Run public transport regressions
        run: bun test tests/ceo-public-transport.test.ts

      - name: Run public conversation reload regressions
        run: bun test tests/ceo-conversation-public-projection.test.ts

      - name: Run authoritative response regressions
        run: bun test tests/ceo-response-contract.test.ts tests/ceo-response-finalizer.test.ts

      - name: Typecheck authoritative CEO graph
        run: bunx tsc -p tsconfig.ceo-lifecycle.json --noEmit
