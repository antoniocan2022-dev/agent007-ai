name: DR Immutable Offsite Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

env:
  OCI_S3_ENDPOINT: https://axpyeqhqzuof.compat.objectstorage.ca-montreal-1.oci.customer-oci.com

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps

      - name: Verify required OCI secrets
        env:
          PROD_URL: ${{ secrets.AGENT007_PRODUCTION_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          OCI_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_SECRET: ${{ secrets.OCI_S3_SECRET_KEY }}
          NAMESPACE: ${{ secrets.DR_BACKUP_S3_NAMESPACE }}
          BUCKET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          REGION: ${{ secrets.DR_BACKUP_S3_REGION }}
        run: |
          set -euo pipefail
          test -n "$PROD_URL"
          test -n "$BACKUP_KEY"
          test -n "$OCI_KEY"
          test -n "$OCI_SECRET"
          test -n "$NAMESPACE"
          test -n "$BUCKET"
          test -n "$REGION"
          test "$NAMESPACE" = "axpyeqhqzuof"
          test "$REGION" = "ca-montreal-1"

      - name: Verify OCI Object Storage bucket access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DR_BACKUP_S3_REGION }}
          BUCKET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ env.OCI_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT"
          echo 'OCI Object Storage bucket access verified.'

      - name: Generate validated Backup V2.1
        env:
          AGENT007_PRODUCTION_DATABASE_URL: ${{ secrets.AGENT007_PRODUCTION_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          DR_BACKUP_OUTPUT: /tmp/agent007-backup-v2.json.gz
        run: npx --yes tsx@4.19.4 scripts/dr-offsite-backup.ts

      - name: Compute artifact checksum
        id: checksum
        run: echo "sha256=$(sha256sum /tmp/agent007-backup-v2.json.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload immutable backup to OCI Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DR_BACKUP_S3_REGION }}
          BUCKET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ env.OCI_S3_ENDPOINT }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          KEY="agent007/disaster-recovery/$(date -u '+%Y/%m/%d')/agent007-backup-v2-$(date -u '+%Y%m%dT%H%M%SZ').json.gz"
          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "$KEY" \
            --body /tmp/agent007-backup-v2.json.gz \
            --content-type application/gzip \
            --metadata "source=Agent007,backup-version=2.1,sha256=$SHA256,immutable-retention=oci-bucket-rule" \
            --endpoint-url "$ENDPOINT"
          echo "Immutable OCI backup uploaded: $KEY"
          echo "SHA256: $SHA256"
          echo "OBJECT_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Verify uploaded backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DR_BACKUP_S3_REGION }}
          BUCKET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ env.OCI_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3api head-object --bucket "$BUCKET" --key "$OBJECT_KEY" --endpoint-url "$ENDPOINT"
          echo 'OCI backup object verified.'
          echo 'Bucket-level OCI retention rule provides the immutability control; no AWS S3 Object Lock headers are used.'
