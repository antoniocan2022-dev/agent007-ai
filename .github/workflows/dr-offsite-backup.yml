name: DR Immutable Offsite Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

env:
  DR_STORAGE_ENDPOINT: ${{ secrets.DR_BACKUP_S3_ENDPOINT }}
  DR_STORAGE_NAMESPACE: ${{ secrets.DR_BACKUP_S3_NAMESPACE }}
  DR_STORAGE_REGION: ${{ secrets.DR_BACKUP_S3_REGION }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps

      - name: Verify required backup and storage configuration
        env:
          PROD_URL: ${{ secrets.AGENT007_PRODUCTION_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          STORAGE_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          STORAGE_SECRET: ${{ secrets.OCI_S3_SECRET_KEY }}
          BUCKET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ env.DR_STORAGE_ENDPOINT }}
          NAMESPACE: ${{ env.DR_STORAGE_NAMESPACE }}
          REGION: ${{ env.DR_STORAGE_REGION }}
        run: |
          set -euo pipefail
          test -n "$PROD_URL"
          test -n "$BACKUP_KEY"
          test -n "$STORAGE_KEY"
          test -n "$STORAGE_SECRET"
          test -n "$BUCKET"
          test -n "$ENDPOINT"
          test -n "$NAMESPACE"
          test -n "$REGION"
          echo 'Required Agent007 backup and external object-storage configuration is present.'
          echo "Configured storage endpoint host: $(node -e "console.log(new URL(process.env.ENDPOINT).hostname)")"
          echo "Configured storage region: $REGION"
          echo "Configured storage namespace: $NAMESPACE"

      - name: Verify external object-storage bucket access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ env.DR_STORAGE_REGION }}
          BUCKET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ env.DR_STORAGE_ENDPOINT }}
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION"; then
            echo 'ERROR: external DR backup bucket is not reachable or does not exist.'
            echo 'Check DR_BACKUP_S3_ENDPOINT, DR_BACKUP_S3_REGION, DR_BACKUP_S3_NAMESPACE, DR_BACKUP_S3_BUCKET and the storage access policy.'
            echo 'The workflow refuses to generate/upload a backup when this preflight fails.'
            exit 1
          fi
          echo 'External DR backup bucket access verified.'

      - name: Generate validated Backup V2.1
        env:
          AGENT007_PRODUCTION_DATABASE_URL: ${{ secrets.AGENT007_PRODUCTION_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          DR_BACKUP_OUTPUT: /tmp/agent007-backup-v2.json.gz
        run: npx --yes tsx@4.19.4 scripts/dr-offsite-backup.ts

      - name: Compute artifact checksum
        id: checksum
        run: echo "sha256=$(sha256sum /tmp/agent007-backup-v2.json.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload immutable backup to external object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ env.DR_STORAGE_REGION }}
          BUCKET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ env.DR_STORAGE_ENDPOINT }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          KEY="agent007/disaster-recovery/$(date -u '+%Y/%m/%d')/agent007-backup-v2-$(date -u '+%Y%m%dT%H%M%SZ').json.gz"
          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "$KEY" \
            --body /tmp/agent007-backup-v2.json.gz \
            --content-type application/gzip \
            --metadata "source=Agent007,backup-version=2.1,sha256=$SHA256,immutable-retention=storage-policy" \
            --endpoint-url "$ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"
          echo "Immutable DR backup uploaded: $KEY"
          echo "SHA256: $SHA256"
          echo "OBJECT_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Verify uploaded backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ env.DR_STORAGE_REGION }}
          BUCKET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ env.DR_STORAGE_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3api head-object --bucket "$BUCKET" --key "$OBJECT_KEY" --endpoint-url "$ENDPOINT" --region "$AWS_DEFAULT_REGION"
          echo 'External DR backup object verified.'
          echo 'Immutability is provided by the configured storage retention policy.'
