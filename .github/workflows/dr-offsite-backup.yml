name: DR Immutable Offsite Backup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dr-offsite-backup.yml'
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

env:
  DR_STORAGE_NAMESPACE: ${{ secrets.DR_BACKUP_S3_NAMESPACE }}
  DR_STORAGE_REGION: ${{ secrets.DR_BACKUP_S3_REGION }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install OCI S3 upload client
        run: python3 -m pip install --disable-pip-version-check --quiet boto3

      - name: Verify required backup and storage configuration
        env:
          PROD_URL: ${{ secrets.AGENT007_PRODUCTION_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          STORAGE_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          STORAGE_SECRET: ${{ secrets.OCI_S3_SECRET_KEY }}
          BUCKET_SECRET: ${{ secrets.DR_BACKUP_S3_BUCKET }}
          NAMESPACE: ${{ env.DR_STORAGE_NAMESPACE }}
          REGION: ${{ env.DR_STORAGE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$PROD_URL" ]] || missing+=(AGENT007_PRODUCTION_DATABASE_URL)
          [[ -n "$BACKUP_KEY" ]] || missing+=(BACKUP_ENCRYPTION_KEY)
          [[ -n "$STORAGE_KEY" ]] || missing+=(OCI_S3_ACCESS_KEY)
          [[ -n "$STORAGE_SECRET" ]] || missing+=(OCI_S3_SECRET_KEY)
          [[ -n "$BUCKET_SECRET" ]] || missing+=(DR_BACKUP_S3_BUCKET)
          [[ -n "$NAMESPACE" ]] || missing+=(DR_BACKUP_S3_NAMESPACE)
          [[ -n "$REGION" ]] || missing+=(DR_BACKUP_S3_REGION)
          if (( ${#missing[@]} > 0 )); then
            echo 'ERROR: required DR backup configuration is missing.'
            printf 'Missing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

          NAMESPACE="$(printf '%s' "$NAMESPACE" | tr -d '[:space:]')"
          REGION="$(printf '%s' "$REGION" | tr -d '[:space:]')"
          BUCKET_SECRET="$(printf '%s' "$BUCKET_SECRET" | tr -d '[:space:]')"
          case "${REGION,,}" in
            ca-montreal-1|canadasoutheast\(montreal\)) REGION='ca-montreal-1' ;;
            ca-toronto-1|canadasoutheast\(toronto\)) REGION='ca-toronto-1' ;;
            us-ashburn-1|useast\(ashburn\)) REGION='us-ashburn-1' ;;
            us-phoenix-1|uswest\(phoenix\)) REGION='us-phoenix-1' ;;
          esac
          [[ -n "$NAMESPACE" ]] || { echo 'ERROR: DR_BACKUP_S3_NAMESPACE is empty after normalization.'; exit 1; }
          [[ -n "$REGION" ]] || { echo 'ERROR: DR_BACKUP_S3_REGION is empty after normalization.'; exit 1; }
          [[ "$REGION" =~ ^[a-z0-9-]+$ ]] || { echo "ERROR: unsupported OCI region identifier: $REGION"; exit 1; }

          ENDPOINT="https://${NAMESPACE}.compat.objectstorage.${REGION}.oraclecloud.com"
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.signature_version s3v4
          node - "$ENDPOINT" <<'NODE'
          const endpoint = process.argv[2]
          const parsed = new URL(endpoint)
          if (parsed.protocol !== 'https:' || !parsed.hostname) throw new Error('Invalid OCI S3 endpoint')
          NODE

          echo 'Discovering accessible OCI S3 buckets...'
          BUCKET_LIST="$(aws s3api list-buckets --endpoint-url "$ENDPOINT" --region "$REGION" --query 'Buckets[].Name' --output text)"
          TARGET_BUCKET=''
          if printf '%s\n' "$BUCKET_LIST" | tr '\t' '\n' | grep -Fxq 'agent007_dr_backups'; then
            TARGET_BUCKET='agent007_dr_backups'
          elif printf '%s\n' "$BUCKET_LIST" | tr '\t' '\n' | grep -Fxq "$BUCKET_SECRET"; then
            TARGET_BUCKET="$BUCKET_SECRET"
          fi
          if [[ -z "$TARGET_BUCKET" ]]; then
            echo 'ERROR: no valid Agent007 DR bucket was found in the accessible OCI bucket inventory.'
            echo 'Accessible bucket names:'
            printf '%s\n' "$BUCKET_LIST"
            echo 'Expected primary bucket: agent007_dr_backups'
            exit 1
          fi
          echo "Selected DR backup bucket: $TARGET_BUCKET"
          echo "DR_BACKUP_BUCKET=$TARGET_BUCKET" >> "$GITHUB_ENV"
          echo "DR_BACKUP_REGION=$REGION" >> "$GITHUB_ENV"
          echo "DR_BACKUP_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo 'Required Agent007 backup and external object-storage configuration is verified.'

      - name: Verify external object-storage bucket access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "$DR_BACKUP_BUCKET" --endpoint-url "$DR_BACKUP_ENDPOINT" --region "$DR_BACKUP_REGION"
          echo 'External DR backup bucket access verified.'

      - name: Generate validated Backup V2.1
        env:
          AGENT007_PRODUCTION_DATABASE_URL: ${{ secrets.AGENT007_PRODUCTION_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          DR_BACKUP_OUTPUT: /tmp/agent007-backup-v2.json.gz
        run: npx --yes tsx@4.19.4 scripts/dr-offsite-backup.ts

      - name: Compute artifact checksum
        id: checksum
        run: echo "sha256=$(sha256sum /tmp/agent007-backup-v2.json.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload immutable backup to external object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          KEY="agent007/disaster-recovery/$(date -u '+%Y/%m/%d')/agent007-backup-v2-$(date -u '+%Y%m%dT%H%M%SZ').json.gz"
          export KEY
          python3 - <<'PY'
          import os
          import boto3
          from botocore.client import Config

          bucket = os.environ['DR_BACKUP_BUCKET']
          key = os.environ['KEY']
          endpoint = os.environ['DR_BACKUP_ENDPOINT']
          region = os.environ['DR_BACKUP_REGION']
          sha256 = os.environ['SHA256']

          client = boto3.client(
              's3',
              region_name=region,
              endpoint_url=endpoint,
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              config=Config(
                  signature_version='s3v4',
                  s3={'addressing_style': 'path', 'payload_signing_enabled': False},
              ),
          )

          with open('/tmp/agent007-backup-v2.json.gz', 'rb') as body:
              client.put_object(
                  Bucket=bucket,
                  Key=key,
                  Body=body,
                  ContentType='application/gzip',
                  Metadata={
                      'source': 'Agent007',
                      'backup-version': '2.1',
                      'sha256': sha256,
                      'immutable-retention': 'storage-policy',
                  },
              )
          print(f'Immutable DR backup uploaded: {key}')
          print(f'SHA256: {sha256}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'OBJECT_KEY={key}\n')
          PY

      - name: Verify uploaded backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          EXPECTED_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import boto3
          from botocore.client import Config

          client = boto3.client(
              's3',
              region_name=os.environ['DR_BACKUP_REGION'],
              endpoint_url=os.environ['DR_BACKUP_ENDPOINT'],
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              config=Config(
                  signature_version='s3v4',
                  s3={'addressing_style': 'path', 'payload_signing_enabled': False},
              ),
          )
          head = client.head_object(
              Bucket=os.environ['DR_BACKUP_BUCKET'],
              Key=os.environ['OBJECT_KEY'],
          )
          expected = os.environ['EXPECTED_SHA256']
          actual = head.get('Metadata', {}).get('sha256')
          if head.get('ContentLength', 0) <= 0:
              raise SystemExit('Uploaded DR backup object is empty')
          if actual != expected:
              raise SystemExit(f'Uploaded DR backup checksum metadata mismatch: {actual!r} != {expected!r}')
          print(f"Verified uploaded DR backup: {os.environ['OBJECT_KEY']}")
          print(f"Verified size: {head['ContentLength']} bytes")
          print(f"Verified SHA256 metadata: {actual}")
          print('Immutability is provided by the configured storage retention policy.')
          PY
