name: Venture OS 24x7 Heartbeat

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: venture-os-24x7
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # GitHub intentionally exposes an empty string when the optional secret is absent.
      # The value itself is never printed; only a boolean gate is emitted below.
      VENTURE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Determine database availability
        id: database-gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VENTURE_DATABASE_URL:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Venture OS heartbeat: DATABASE_URL is configured; production evidence cycle is enabled.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Venture OS heartbeat: DATABASE_URL is not configured; production evidence cycle will be skipped safely.'
            echo 'Contract verification will run in deterministic no-production-DB mode.'
          fi

      - uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile

      - name: Reassert exact Git tree after dependency setup
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$expected" = "$remote" || { echo "WORKTREE_SHA_DRIFT: expected=$expected remote=$remote"; exit 1; }
          git reset --hard "$expected"
          # Dependency/cache setup must not be able to resurrect deleted repository artifacts.
          # Remove only untracked files under scripts; all tracked release files remain intact.
          git clean -ffdx -- scripts
          test -z "$(git status --porcelain -- scripts)"
          echo "Exact Git tree reasserted at $expected; scripts workspace is clean."

      - run: bunx prisma generate

      - name: Verify operation-loop and autonomy contracts
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "src/lib/autonomy/autonomy-manager.ts"
            "src/lib/venture-operation-loop.ts"
            "scripts/run-venture-operation-cycle.ts"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required contract file: $file"; exit 1; }
          done
          bun -e '
            const fs = require("node:fs")
            const checks = [
              ["scripts/run-venture-operation-cycle.ts", "import { runVentureOperationCycle } from '\''../src/lib/venture-operation-loop'\''"],
              ["scripts/run-venture-operation-cycle.ts", "runVentureOperationCycle("],
              ["src/lib/venture-operation-loop.ts", "import { runAutonomyManagerTick } from '\''./autonomy/autonomy-manager'\''"],
              ["src/lib/venture-operation-loop.ts", "export async function runVentureOperationCycle("],
              ["src/lib/venture-operation-loop.ts", "runAutonomyManagerTick("],
              ["src/lib/venture-operation-loop.ts", "includeMissionSupervisor: true"],
              ["src/lib/venture-operation-loop.ts", "RECOVERABLE"],
            ]
            for (const [file, token] of checks) {
              const text = fs.readFileSync(file, "utf8")
              if (!text.includes(token)) {
                console.error(`Missing required operation-loop/autonomy contract token ${token} in ${file}`)
                process.exit(1)
              }
            }
            const loop = fs.readFileSync("src/lib/venture-operation-loop.ts", "utf8")
            const managerCalls = loop.split("runAutonomyManagerTick(").length - 1
            if (managerCalls !== 1) {
              console.error(`Expected exactly one Autonomy Manager entry point; found ${managerCalls}.`)
              process.exit(1)
            }
            console.log("Operation-loop and autonomy contracts verified.")
          '

      - name: Run release architecture invariants
        run: bun test tests/release-architecture.test.ts

      - name: Execute Venture OS operation cycle
        if: ${{ steps.database-gate.outputs.available == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VENTURE_ID: venture_001
          VENTURE_OWNER: agent007-24x7
        run: |
          set -euo pipefail
          bun scripts/run-venture-operation-cycle.ts

      - name: Record safe no-database state
        if: ${{ steps.database-gate.outputs.available != 'true' }}
        run: |
          set -euo pipefail
          echo 'Venture OS heartbeat: BLOCKED/SAFE — no DATABASE_URL is available to GitHub Actions.'
          echo 'No KPI, readiness, revenue, or autonomy evidence is claimed.'
          echo 'This is an expected supervised state, not a workflow failure.'

      - name: Run Venture OS contract tests
        env:
          # These tests are intentionally deterministic and must never depend on a
          # production database being reachable. This prevents a paused/unavailable
          # Postgres service from turning static contract verification into a false CI failure.
          DATABASE_URL: ''
        run: |
          set -euo pipefail
          bun test tests/venture-os-v2.test.ts tests/architecture-control-plane.test.ts tests/venture-os-integration.test.ts tests/db-runtime-policy.test.ts tests/owner-bootstrap-security.test.ts
