name: Restore media tool exports safely

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Restore intact media module and apply safe provider migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 3350473012329ae7c8c130d374babda5c5bdb2c2
          git show 3350473012329ae7c8c130d374babda5c5bdb2c2:src/lib/media-tools.ts > src/lib/media-tools.ts
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/media-tools.ts')
          s = p.read_text()
          s = s.replace("        const ZAI = (await import('z-ai-web-dev-sdk')).default\n        let _z: any = (globalThis as any).__zai_singleton\n        if (!_z) { _z = await ZAI.create(); (globalThis as any).__zai_singleton = _z }\n        const resp = await _z.chat.completions.createVision({\n          messages: [{ role: 'user', content: [{ type: 'text', text: 'Describe this image in detail.' }, { type: 'image_url', image_url: { url: dataUrl } }] }],\n        })\n        const analysis = resp?.choices?.[0]?.message?.content ?? 'Analysis failed'", "        const { runCanonicalLlm } = await import('./canonical-llm-router')\n        const resp = await runCanonicalLlm({\n          messages: [{ role: 'user', content: `Analyze this image data URL accurately and describe the visible content. ${dataUrl.slice(0, 1200)}` }],\n          taskType: 'analysis',\n          verification: 'standard',\n          executionClass: 'standard',\n        })\n        const analysis = resp?.content ?? 'Analysis failed'")
          s = re.sub(r"        const ZAI = .*?        const result = await _z\.audio\.asr\.create\(\{ audio: audioBase64, model: 'whisper-1' \}\)\n        const transcript = result\?\.text \|\| result\?\.transcript \|\| 'Transcription failed'", "        const apiKey = process.env.OPENAI_API_KEY\n        if (!apiKey) throw new Error('ASR requires OPENAI_API_KEY')\n        const form = new FormData()\n        form.append('file', new Blob([Buffer.from(audioBase64, 'base64')], { type: 'audio/webm' }), 'audio.webm')\n        form.append('model', 'whisper-1')\n        const asrResponse = await fetch('https://api.openai.com/v1/audio/transcriptions', { method: 'POST', headers: { Authorization: `Bearer ${apiKey}` }, body: form, signal: AbortSignal.timeout(30000) })\n        if (!asrResponse.ok) throw new Error(`ASR failed: HTTP ${asrResponse.status}`)\n        const result = await asrResponse.json()\n        const transcript = result?.text || result?.transcript || 'Transcription failed'", s, flags=re.S)
          if 'z-ai-web-dev-sdk' in s or 'ZAI.create' in s or 'GEMINI_API_KEY' in s:
              raise SystemExit('legacy provider reference remains in media-tools.ts')
          p.write_text(s)
          PY
      - name: Validate media exports and TypeScript
        run: |
          set -euo pipefail
          grep -nE "export async function tool(FileCreate|FileReadAny|FileDelete|FileModify|ImageProcess|AudioProcess|VideoProcess|DirectoryList)" src/lib/media-tools.ts
          bun install --frozen-lockfile
          bun run db:generate
          bunx tsc -p tsconfig.ci.json --noEmit
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/media-tools.ts
          git rm .github/workflows/repair-media-tools.yml
          git commit -m 'fix: restore media tool exports and migrate providers'
          git push origin HEAD:main
