name: Architecture Control Plane Verification

on:
  push:
    branches: [main, agent/venture-os-final]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Phase 0 — Architecture reality baseline
        run: bun scripts/architecture-reality-baseline.ts
      - name: Phase 1-4 — Architecture integrity tests
        run: bun test tests/architecture-control-plane.test.ts tests/architecture-integrity-contract.test.ts
      - name: Phase 5-8 — Outcome, learning and continuous-loop tests
        run: bun test tests/continuous-loop-integrity.test.ts
      - name: Evidence and degraded-mode regression tests
        run: bun test tests/ceo-lifecycle-context-propagation.test.ts
      - name: Full TypeScript audit
        run: bunx tsc -p tsconfig.ci.json --noEmit --pretty false
      - name: Repository diff hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Control-plane source assertions
        run: |
          test -f src/lib/architecture-control-plane.ts
          test -f src/lib/architecture-integrity-contract.ts
          test -f src/lib/ceo-decision-grade-evidence.ts
          test -f src/lib/ceo-behavioral-learning.ts
          test -f src/lib/ceo-continuous-loop.ts
          test -f scripts/architecture-reality-baseline.ts
          test -f tests/architecture-control-plane.test.ts
          test -f tests/architecture-integrity-contract.test.ts
          test -f tests/continuous-loop-integrity.test.ts
          test -f src/app/api/architecture/business-outcome/route.ts
          grep -q "assertDelegationAllowed" src/lib/architecture-control-plane.ts
          grep -q "ArtifactRecord" src/lib/architecture-control-plane.ts
          grep -q "assertMissionTransition" src/lib/architecture-control-plane.ts
          grep -q "BusinessOutcomeRecord" src/lib/architecture-control-plane.ts
          grep -q "VentureControlContract" src/lib/architecture-control-plane.ts
          grep -q "architecture-control-plane" src/lib/venture-001.ts
          grep -q "architecture-control-plane" src/app/api/mission-active/route.ts
          grep -q "architecture-control-plane" src/lib/orchestrator.ts
          grep -q "ABSTAINED_REQUIRED_EVIDENCE" src/lib/ceo-decision-grade-evidence.ts
          grep -q "ABSTAINED_REQUIRED_EVIDENCE" src/lib/ceo-degraded-mode.ts
          grep -q "predictedOutcome" src/lib/ceo-outcome-learning.ts
          grep -q "predictionError" src/lib/ceo-outcome-learning.ts
          grep -q "approveLearningCandidate" src/lib/ceo-behavioral-learning.ts
          grep -q "assertLoopTransition" src/lib/ceo-continuous-loop.ts
          grep -q "runGovernedEvolutionCycle" src/app/api/system/evolution/route.ts
          ! grep -q "runActiveEvolutionCycle" src/app/api/system/evolution/route.ts
          grep -q "recommendationCorrelationId" src/app/api/architecture/business-outcome/route.ts
