name: Architecture Control Plane Verification

on:
  push:
    branches:
      - agent/venture-os-final
      - 'arch/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: One-time PostgreSQL raw SQL safety-net repair
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arch/') && !contains(github.event.head_commit.message, 'fix: deterministic raw SQL safety-net') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/db.ts')
          text = path.read_text()
          pattern = re.compile(
              r"    // UPGRADE #142 — BATCH CREATE TABLE STATEMENTS \(Issue A fix\).*?"
              r"    console\.log\(`\[db\] Tables ensured via raw SQL \(batched\).*?"
              r"    return failed === 0\n",
              re.S,
          )
          replacement = '''    // Execute each DDL statement independently. PostgreSQL prepared statements
    // reject multiple SQL commands in one statement. Independent execution keeps
    // the runtime safety-net deterministic and observable.
    for (const sql of statements) {
      try {
        await (db as any).$executeRawUnsafe(sql)
        created++
      } catch (e: any) {
        const msg = e?.message ?? ''
        if (msg.toLowerCase().includes('already exists')) {
          alreadyExisted++
        } else {
          failed++
          console.error('[db] SQL failed:', msg.slice(0, 240), '— statement:', sql.slice(0, 120))
        }
      }
    }
    console.log(`[db] Tables ensured via raw SQL — ${created} created, ${alreadyExisted} already existed, ${failed} failed (out of ${statements.length} statements)`)
    return failed === 0
'''
          new_text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy DB batch block, found {count}')
          path.write_text(new_text)
          PY
          git diff --check
          test ! -e .github/workflows/one-shot-db-raw-sql-repair.yml || rm .github/workflows/one-shot-db-raw-sql-repair.yml
          git config user.name 'Agent007 CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db.ts .github/workflows/one-shot-db-raw-sql-repair.yml
          git diff --cached --check
          git commit -m 'fix: deterministic raw SQL safety-net'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Architecture unit tests
        run: bun test tests/architecture-control-plane.test.ts
      - name: Full TypeScript audit
        run: bunx tsc -p tsconfig.ci.json --noEmit --pretty false
      - name: Repository diff hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Control-plane source assertions
        run: |
          test -f src/lib/architecture-control-plane.ts
          test -f tests/architecture-control-plane.test.ts
          test -f src/app/api/architecture/business-outcome/route.ts
          grep -q "assertDelegationAllowed" src/lib/architecture-control-plane.ts
          grep -q "ArtifactRecord" src/lib/architecture-control-plane.ts
          grep -q "assertMissionTransition" src/lib/architecture-control-plane.ts
          grep -q "BusinessOutcomeRecord" src/lib/architecture-control-plane.ts
          grep -q "VentureControlContract" src/lib/architecture-control-plane.ts
          grep -q "architecture-control-plane" src/lib/venture-001.ts
          grep -q "architecture-control-plane" src/app/api/mission-active/route.ts
          grep -q "architecture-control-plane" src/lib/orchestrator.ts
