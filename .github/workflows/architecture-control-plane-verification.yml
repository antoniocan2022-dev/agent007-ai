name: Architecture Control Plane Verification

on:
  push:
    branches: [agent/architecture-control-plane-5-9]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Architecture unit tests
        run: bun test tests/architecture-control-plane.test.ts

      - name: Project TypeScript audit — no new errors in changed architecture files
        shell: bash
        run: |
          set +e
          bunx tsc -p tsconfig.ci.json --noEmit --pretty false > /tmp/tsc.log 2>&1
          code=$?
          set -e
          echo "tsc_exit=$code"
          if grep -E "src/lib/architecture-control-plane\.ts|src/lib/venture-001\.ts|src/app/api/mission-active/route\.ts" /tmp/tsc.log; then
            echo "New TypeScript errors detected in architecture-control-plane integration files."
            exit 1
          fi
          echo "No TypeScript errors reported in the newly changed architecture files."

      - name: Repository diff hygiene
        run: |
          git diff --check HEAD~1..HEAD
          test -z "$(git status --porcelain)"

      - name: Control-plane source assertions
        run: |
          test -f src/lib/architecture-control-plane.ts
          test -f tests/architecture-control-plane.test.ts
          grep -q "assertDelegationAllowed" src/lib/architecture-control-plane.ts
          grep -q "ArtifactRecord" src/lib/architecture-control-plane.ts
          grep -q "assertMissionTransition" src/lib/architecture-control-plane.ts
          grep -q "BusinessOutcomeRecord" src/lib/architecture-control-plane.ts
          grep -q "VentureControlContract" src/lib/architecture-control-plane.ts
          grep -q "architecture-control-plane" src/lib/venture-001.ts
          grep -q "architecture-control-plane" src/app/api/mission-active/route.ts
