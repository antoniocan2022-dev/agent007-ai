name: CEO Phase 1-3 Architecture CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase-1-3-contracts:
    name: CEO Phases 1-3 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Phase 1-3 architecture contracts
        run: bun test tests/ceo-phase-1-3-architecture.test.ts
