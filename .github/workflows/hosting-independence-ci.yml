name: Agent007 Hosting Independence CI

on:
  pull_request:
    paths:
      - 'src/lib/runtime/**'
      - 'src/lib/storage/**'
      - 'src/app/api/checkout/**'
      - 'src/app/api/file-download/**'
      - 'instrumentation.ts'
      - 'docs/HOSTING-INDEPENDENCE-V1.md'
      - '.github/workflows/hosting-independence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Hosting Independence contract tests
        run: bun test src/lib/runtime/hosting-independence.test.ts
      - name: Targeted portability lint
        run: bunx eslint src/lib/runtime/public-base-url.ts src/lib/runtime/background-tasks.ts src/lib/runtime/vercel-background.ts src/lib/storage/object-storage.ts src/lib/storage/vercel-blob.ts src/lib/runtime/hosting-independence.test.ts src/app/api/checkout/route.ts src/app/api/file-download/route.ts instrumentation.ts
