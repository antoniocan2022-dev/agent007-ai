name: DR Recovery Restore

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESTORE_AGENT007_DR to authorize the isolated recovery restore'
        required: true
        type: string
      backup_url:
        description: 'Backup V2.1 URL (must be an approved backup endpoint)'
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      AGENT007_DR_DATABASE_URL: ${{ secrets.AGENT007_DR_DATABASE_URL }}
      AGENT007_PRODUCTION_DATABASE_URL: ${{ secrets.AGENT007_PRODUCTION_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate authorization and target isolation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RESTORE_AGENT007_DR" || { echo "Invalid restore confirmation"; exit 1; }
          test -n "$AGENT007_DR_DATABASE_URL" || { echo "AGENT007_DR_DATABASE_URL is missing"; exit 1; }
          test -n "$AGENT007_PRODUCTION_DATABASE_URL" || { echo "AGENT007_PRODUCTION_DATABASE_URL is missing"; exit 1; }
          if [ "$AGENT007_DR_DATABASE_URL" = "$AGENT007_PRODUCTION_DATABASE_URL" ]; then
            echo "REFUSING: recovery URL equals production URL"; exit 1
          fi
          case "$AGENT007_DR_DATABASE_URL" in postgresql://*|postgres://*) ;; *) echo "Recovery target is not PostgreSQL"; exit 1;; esac
          echo "Recovery target isolation check: PASS"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate recovery schema
        env:
          DATABASE_URL: ${{ secrets.AGENT007_DR_DATABASE_URL }}
        run: npx prisma validate

      - name: Run isolated restore
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_URL: ${{ inputs.backup_url }}
        run: |
          set -euo pipefail
          echo "Authorized isolated DR restore target: Supabase recovery database"
          echo "Backup source: $BACKUP_URL"
          echo "The restore application must enforce recovery-only targeting."
          echo "This workflow intentionally does not expose database URLs."
          echo "Next step: invoke the protected DR restore endpoint with the approved backup URL."
