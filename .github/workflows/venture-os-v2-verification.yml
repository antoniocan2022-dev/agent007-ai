name: Venture OS v2 Verification
on:
  push:
    branches: [agent/architecture-control-plane-5-9]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.4 }
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: V2 architecture tests
        run: bun test tests/venture-os-v2.test.ts
      - name: Relevant TypeScript audit
        shell: bash
        run: |
          set +e
          bunx tsc -p tsconfig.ci.json --noEmit --pretty false > /tmp/tsc.log 2>&1
          echo "tsc_exit=$?"
          if grep -E "src/lib/venture-autonomy-control\.ts|src/app/api/venture-os/route\.ts|tests/venture-os-v2\.test\.ts" /tmp/tsc.log; then
            echo 'Relevant TypeScript diagnostics detected.'
            exit 1
          fi
      - name: Source and hygiene assertions
        run: |
          test -f src/lib/venture-autonomy-control.ts
          test -f src/app/api/venture-os/route.ts
          test -f tests/venture-os-v2.test.ts
          grep -q "evaluateVentureReadiness" src/lib/venture-autonomy-control.ts
          grep -q "startV001BookProduction" src/lib/venture-autonomy-control.ts
          grep -q "advanceCommercialOrder" src/lib/venture-autonomy-control.ts
          grep -q "runV001EvidenceTest" src/lib/venture-autonomy-control.ts
          grep -q "acquireAutonomyLease" src/lib/venture-autonomy-control.ts
          grep -q "heartbeatAutonomyLease" src/lib/venture-autonomy-control.ts
          grep -q "VENTURE_TEMPLATE_V1" src/lib/venture-autonomy-control.ts
          git diff --check
          test -z "$(git status --porcelain)"
