name: architecture-hardening-on-branch

on:
  push:
    branches: [agent/architecture-control-plane-5-9]

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: ${{ !startsWith(github.event.head_commit.message, '[architecture-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply integration patches
        shell: python
        run: |
          from pathlib import Path

          # active-missions.ts — formal state machine + artifact ledger hook
          p = Path('src/lib/active-missions.ts')
          s = p.read_text()
          if "./architecture-control-plane" not in s:
              s = "import { assertMissionTransition, buildArtifactId, registerArtifact, verifyArtifact } from './architecture-control-plane'\n" + s
          old = """  // Advance to next stage\n  const nextStage = STAGE_ORDER[currentIdx + 1]\n  m.currentStage = nextStage\n"""
          new = """  // Advance through the formal mission state machine.\n  const nextStage = STAGE_ORDER[currentIdx + 1]\n  assertMissionTransition(m.currentStage, nextStage)\n  m.currentStage = nextStage\n"""
          if old not in s:
              raise SystemExit('active-missions transition anchor missing')
          s = s.replace(old, new, 1)
          old = """  m.log.push({\n    timestamp: nowIso(),\n    actor: handoff.leader,\n    stage: m.currentStage,\n    message: `Artifact set: ${artifactValue.slice(0, 100)} (verified: ${verified})`,\n  })\n\n  return m\n}"""
          new = """  m.log.push({\n    timestamp: nowIso(),\n    actor: handoff.leader,\n    stage: m.currentStage,\n    message: `Artifact set: ${artifactValue.slice(0, 100)} (verified: ${verified})`,\n  })\n\n  // Canonical Artifact Ledger integration for direct mission-pipeline callers.\n  void registerArtifact({\n    artifactId: buildArtifactId({ ventureId: null, missionId: m.id, stage: m.currentStage, artifactType: handoff.artifactRequired, value: artifactValue }),\n    ventureId: null, missionId: m.id, stage: m.currentStage, producer: handoff.leader,\n    consumers: [], artifactType: handoff.artifactRequired, value: artifactValue, version: 1, supersedes: null,\n  }).then(async (record) => {\n    if (verified) await verifyArtifact(record.artifactId, handoff.leader, 'mission-stage-verified')\n  }).catch((error) => console.warn('[active-missions] artifact ledger persistence failed:', error?.message ?? error))\n\n  return m\n}"""
          if old not in s:
              raise SystemExit('active-missions artifact anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # venture-001.ts — Venture Control Contract becomes a real mutation gate
          p = Path('src/lib/venture-001.ts')
          s = p.read_text()
          if "architecture-control-plane" not in s:
              s = s.replace("import { VENTURE_SCORE_THRESHOLD } from './vid-data'", "import { VENTURE_SCORE_THRESHOLD } from './vid-data'\nimport { assertVentureActionAllowed, ensureVentureControlContract } from './architecture-control-plane'")
          old = """export async function ensureVenture001(): Promise<{ created: boolean; repaired: boolean; business: Business }> {\n  const issues = validateVenture001Definition()\n"""
          new = """export async function ensureVenture001(): Promise<{ created: boolean; repaired: boolean; business: Business }> {\n  const issues = validateVenture001Definition()\n  await ensureVentureControlContract(VENTURE_001_REFERENCE.ventureKey)\n  await assertVentureActionAllowed(VENTURE_001_REFERENCE.ventureKey, 'create_artifact')\n"""
          if old not in s:
              raise SystemExit('venture-001 anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # mission-active API — DB-backed path must use the same state machine and ledger
          p = Path('src/app/api/mission-active/route.ts')
          s = p.read_text()
          if "architecture-control-plane" not in s:
              s = s.replace("import { verifyStageArtifact } from '@/lib/active-missions'", "import { verifyStageArtifact } from '@/lib/active-missions'\nimport { assertMissionTransition, buildArtifactId, registerArtifact, verifyArtifact } from '@/lib/architecture-control-plane'")
          old = """      const currentIdx = STAGE_ORDER.indexOf(dbMission.currentStage)\n      if (currentIdx < STAGE_ORDER.length - 1) {\n"""
          new = """      const currentIdx = STAGE_ORDER.indexOf(dbMission.currentStage)\n      if (currentIdx < STAGE_ORDER.length - 1) {\n        assertMissionTransition(dbMission.currentStage, STAGE_ORDER[currentIdx + 1])\n"""
          if old not in s:
              raise SystemExit('mission-active transition anchor missing')
          s = s.replace(old, new, 1)
          old = """        dbMission.updatedAt = new Date().toISOString()\n        await saveActiveMissionDB(dbMission)\n        return NextResponse.json({ ok: true, mission: dbMission })\n      }\n    }\n    const mission = setStageArtifact(body.missionId, body.artifactValue, !!body.verified)\n"""
          new = """        dbMission.updatedAt = new Date().toISOString()\n        await saveActiveMissionDB(dbMission)\n        const artifact = await registerArtifact({\n          artifactId: buildArtifactId({ ventureId: body.ventureId ?? null, missionId: dbMission.id, stage: dbMission.currentStage, artifactType: handoff.artifactRequired, value: body.artifactValue }),\n          ventureId: body.ventureId ?? null, missionId: dbMission.id, stage: dbMission.currentStage, producer: handoff.leader,\n          consumers: [], artifactType: handoff.artifactRequired, value: body.artifactValue, version: 1, supersedes: null,\n        })\n        if (body.verified) await verifyArtifact(artifact.artifactId, handoff.leader, 'mission-active-api')\n        return NextResponse.json({ ok: true, mission: dbMission, artifact })\n      }\n    }\n    const mission = setStageArtifact(body.missionId, body.artifactValue, !!body.verified)\n"""
          if old not in s:
              raise SystemExit('mission-active DB artifact anchor missing')
          s = s.replace(old, new, 1)
          old = """    return NextResponse.json({ ok: true, mission })\n  }\n\n  // UPGRADE #120 — Verify artifact for current stage\n"""
          new = """    const handoff = mission.chain.find((c) => c.stage === mission.currentStage)\n    const artifact = handoff ? await registerArtifact({\n      artifactId: buildArtifactId({ ventureId: body.ventureId ?? null, missionId: mission.id, stage: mission.currentStage, artifactType: handoff.artifactRequired, value: body.artifactValue }),\n      ventureId: body.ventureId ?? null, missionId: mission.id, stage: mission.currentStage, producer: handoff.leader,\n      consumers: [], artifactType: handoff.artifactRequired, value: body.artifactValue, version: 1, supersedes: null,\n    }) : null\n    if (artifact && body.verified) await verifyArtifact(artifact.artifactId, handoff!.leader, 'mission-active-api')\n    return NextResponse.json({ ok: true, mission, artifact })\n  }\n\n  // UPGRADE #120 — Verify artifact for current stage\n"""
          if old not in s:
              raise SystemExit('mission-active memory artifact anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # orchestrator.ts — universal hierarchy gate at both dispatch execution paths
          p = Path('src/lib/orchestrator.ts')
          s = p.read_text()
          if "architecture-control-plane" not in s:
              s = s.replace("import { getOperatorUserId, getIncomeSettings, setIncomeSettings } from '@/lib/settings'", "import { getOperatorUserId, getIncomeSettings, setIncomeSettings } from '@/lib/settings'\nimport { assertDelegationAllowed, authorityLevelFor } from './architecture-control-plane'")
          old = """            const result = await runSubagent({\n              subagentId: sub.id, task: d.task, dispatchId,\n"""
          new = """            const targetLevel = authorityLevelFor(sub.id)\n            assertDelegationAllowed({ actorId: 'ceo', actorLevel: 'CEO', targetId: targetLevel === 'LEADER' ? 'vid' : sub.id, targetLevel: targetLevel === 'LEADER' ? 'VID' : targetLevel })\n            const result = await runSubagent({\n              subagentId: sub.id, task: d.task, dispatchId,\n"""
          if old not in s:
              raise SystemExit('orchestrator parallel dispatch anchor missing')
          s = s.replace(old, new, 1)
          old = """        const result = await runSubagent({\n          subagentId: sub.id,\n          task: enhancedTask,\n"""
          new = """        const targetLevel = authorityLevelFor(sub.id)\n        assertDelegationAllowed({ actorId: 'ceo', actorLevel: 'CEO', targetId: targetLevel === 'LEADER' ? 'vid' : sub.id, targetLevel: targetLevel === 'LEADER' ? 'VID' : targetLevel })\n        const result = await runSubagent({\n          subagentId: sub.id,\n          task: enhancedTask,\n"""
          if old not in s:
              raise SystemExit('orchestrator single dispatch anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          print('Integration patches applied.')

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript verification
        run: bunx tsc --noEmit --pretty false

      - name: Architecture unit tests
        run: bun test tests/architecture-control-plane.test.ts

      - name: Deep/coherence audits
        run: |
          bun run audit:coherence
          bun run audit:deep

      - name: Commit only verified integration changes
        run: |
          git config user.name "Agent007 Architecture"
          git config user.email "agent007@local"
          git add src/lib/active-missions.ts src/lib/venture-001.ts src/app/api/mission-active/route.ts src/lib/orchestrator.ts
          git diff --cached --check
          git commit -m "[architecture-hardening] integrate control plane changes 5-9" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
