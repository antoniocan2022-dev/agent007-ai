name: One-Time Canonical Prompt Migration

on:
  push:
    paths:
      - '.github/workflows/one-time-canonical-prompt-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Patch canonical CEO/orchestrator prompt
        shell: python
        run: |
          from pathlib import Path

          agent = Path('src/lib/agent.ts')
          text = agent.read_text()
          import_line = "import { getCanonicalOrganizationPrompt } from './canonical-organization-prompt'\n"
          owner_line = "import { OWNER_EMAIL, OWNER_PHONE, getOwnerContactString } from '@/lib/owner-config'\n"
          if import_line not in text:
              if owner_line not in text:
                  raise SystemExit('agent.ts owner import anchor not found')
              text = text.replace(owner_line, owner_line + import_line, 1)
          text = text.replace("Agent007 — Antonio's autonomous super-agent with 20 pod leaders and \\${TOOL_COUNT} tools.", "Agent007 — Antonio's autonomous super-agent governed by the canonical organization graph with \\${TOOL_COUNT} tools.")
          legacy_team = "TEAM: SCOUT|AURORA|ECHO|FORGE|PULSE|QUANTUM|HUNT|QUILL|PRISM|VERTEX|LEGAL|BANKER|TRADER|CYBERSECURITY_A|CYBERSECURITY_R|DEVELOPER|QA_MONITOR|EXTERNAL_UPTIME_MONITOR + 2 custom = 20 total."
          if legacy_team in text:
              text = text.replace(legacy_team, "${getCanonicalOrganizationPrompt()}", 1)
          agent.write_text(text)

          orchestrator = Path('src/lib/orchestrator.ts')
          otext = orchestrator.read_text()
          oimport = "import { getCanonicalOrganizationPrompt } from './canonical-organization-prompt'\n"
          if oimport not in otext:
              # Place the import after the first local import block without disturbing aliases.
              lines = otext.splitlines(keepends=True)
              insert_at = 0
              for idx, line in enumerate(lines):
                  if line.startswith('import '):
                      insert_at = idx + 1
                  elif insert_at:
                      break
              lines.insert(insert_at, oimport)
              otext = ''.join(lines)
          otext = otext.replace('You orchestrate 20 subagents.', 'You orchestrate the canonical organization defined by the Agent007 organization graph.')
          otext = otext.replace('20 subagents', 'the canonical organization')
          orchestrator.write_text(otext)

          for path in (agent, orchestrator):
              content = path.read_text()
              if '20 pod leaders' in content or '20 subagents' in content:
                  raise SystemExit(f'Legacy organizational count remains in {path}')

      - name: Verify TypeScript prompt sources
        run: |
          test -f src/lib/canonical-organization-prompt.ts
          ! grep -R "20 pod leaders" src/lib/agent.ts
          ! grep -R "20 subagents" src/lib/orchestrator.ts

      - name: Commit canonical prompt migration and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/agent.ts src/lib/orchestrator.ts
          git rm .github/workflows/one-time-canonical-prompt-migration.yml
          if git diff --cached --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git commit -m 'fix: derive CEO prompts from canonical organization'
          git push origin HEAD:main
