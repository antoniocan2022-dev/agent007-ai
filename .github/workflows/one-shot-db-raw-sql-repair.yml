name: One-shot DB raw SQL repair gate

on:
  push:
    branches:
      - arch/venture-control-plane-5-13

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: deterministic raw SQL safety-net') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arch/venture-control-plane-5-13
      - name: Patch db.ts safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/db.ts')
          text = path.read_text()
          pattern = re.compile(
              r"    // UPGRADE #142 — BATCH CREATE TABLE STATEMENTS \(Issue A fix\).*?"
              r"    console\.log\(`\[db\] Tables ensured via raw SQL \(batched\).*?"
              r"    return failed === 0\n",
              re.S,
          )
          replacement = '''    // Execute each DDL statement independently. PostgreSQL prepared statements
    // reject multiple SQL commands in one statement. Independent execution keeps
    // the runtime safety-net deterministic, observable, and free of false batch errors.
    for (const sql of statements) {
      try {
        await (db as any).$executeRawUnsafe(sql)
        created++
      } catch (e: any) {
        const msg = e?.message ?? ''
        if (msg.toLowerCase().includes('already exists')) {
          alreadyExisted++
        } else {
          failed++
          console.error('[db] SQL failed:', msg.slice(0, 240), '— statement:', sql.slice(0, 120))
        }
      }
    }
    console.log(`[db] Tables ensured via raw SQL — ${created} created, ${alreadyExisted} already existed, ${failed} failed (out of ${statements.length} statements)`)
    return failed === 0
'''
          new_text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy batch block, found {count}')
          path.write_text(new_text)

          # Remove this one-shot workflow in the same commit.
          Path('.github/workflows/one-shot-db-raw-sql-repair.yml').unlink()
          PY

          git diff --check
          ! grep -q 'cannot insert multiple commands' src/lib/db.ts
          ! grep -q 'const BATCH_SIZE = 8' src/lib/db.ts
          grep -q 'Tables ensured via raw SQL —' src/lib/db.ts
      - name: Commit source repair and remove one-shot gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Agent007 Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db.ts .github/workflows/one-shot-db-raw-sql-repair.yml
          git diff --cached --check
          git commit -m 'fix: deterministic raw SQL safety-net'
          git push origin HEAD:arch/venture-control-plane-5-13
