name: Agent007 Autonomy CI

on:
  push:
    branches:
      - main
      - 'development/**'
      - 'feat/**'
      - 'fix/**'
      - 'integration/**'
      - 'arch/**'
  pull_request:
    branches:
      - main
      - 'development/**'
      - 'feat/**'
      - 'fix/**'
      - 'integration/**'
      - 'arch/**'

permissions:
  contents: write

jobs:
  static-integrity:
    name: Static integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_test
      NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret
      OWNER_EMAIL: ci-owner@example.com
      SEED_EMAIL: ci-owner@example.com
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent007_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent007_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair PostgreSQL raw-SQL safety net
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/lib/db.ts')
          text = path.read_text()
          pattern = re.compile(r'''    // UPGRADE #142 — BATCH CREATE TABLE STATEMENTS \(Issue A fix\).*?    console\.log\(`\[db\] Tables ensured via raw SQL \(batched\).*?    return failed === 0\n''', re.S)
          replacement = '''    // Execute each DDL statement independently. PostgreSQL prepared statements
    // reject multiple SQL commands in one statement; one-by-one execution keeps
    // the safety-net deterministic and prevents noisy false DB errors.
    for (const sql of statements) {
      try {
        await (db as any).$executeRawUnsafe(sql)
        created++
      } catch (e: any) {
        const msg = e?.message ?? ''
        if (msg.includes('already exists')) {
          alreadyExisted++
        } else {
          failed++
          console.error('[db] SQL failed:', msg.slice(0, 240), '— statement:', sql.slice(0, 120))
        }
      }
    }
    console.log(`[db] Tables ensured via raw SQL — ${created} created, ${alreadyExisted} already existed, ${failed} failed (out of ${statements.length} statements)`)
    return failed === 0
'''
          new_text, count = pattern.subn(replacement, text)
          if count == 1 and new_text != text:
              path.write_text(new_text)
          elif count != 1:
              raise SystemExit(f'Expected exactly one DB raw-SQL batch block, found {count}')
          PY
          if ! git diff --quiet -- src/lib/db.ts; then
            git diff --check
            git config user.name 'Agent007 CI Repair'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/db.ts
            git commit -m 'fix: repair db raw sql batching'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare test database
        run: bunx prisma db push --skip-generate

      - name: Deep integrated audit
        run: bun scripts/deep-integrity-audit.ts

      - name: Repository coherence audit
        run: bun scripts/repository-coherence-audit.ts

      - name: Venture architecture regression audit
        run: bun scripts/venture-architecture-audit.ts

      - name: Architecture 5-13 integration contract
        run: bun test src/lib/venture-foundation-contract.test.ts

      - name: Venture OS upgrades 14-17 contract
        run: bun test src/lib/venture-autonomy-14-17.test.ts

      - name: Venture OS 5-17 deep audit
        run: bun test src/lib/venture-os-5-17-deep-audit.test.ts

      - name: Subagent Governance validation
        run: bun scripts/validate-subagent-governance.ts

      - name: Governance + Provider + Model + Performance + Outcome Intelligence tests
        run: bun test src/lib/provider-intelligence-v2.test.ts src/lib/model-intelligence.test.ts src/lib/model-intelligence-runtime.test.ts src/lib/performance-intelligence.test.ts src/lib/outcome-intelligence.test.ts

      - name: Venture OS contract tests
        run: bun test src/lib/venture-os.test.ts src/lib/venture-decision-engine.test.ts

      - name: TypeScript check
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Autonomy domain tests
        run: bun test src/lib/autonomy/autonomy.test.ts src/lib/autonomy/autonomy-runtime.test.ts src/lib/autonomy/autonomy-runtime.integration.test.ts src/lib/autonomy/capability-registry.test.ts src/lib/autonomy/owner-authorization.test.ts src/lib/autonomy/autonomy-scorecard.test.ts src/lib/autonomy/operational-evidence-bridge.test.ts src/lib/tools-runtime.test.ts src/lib/mission-telemetry.autonomy.test.ts src/lib/runtime/background-tasks.test.ts

      - name: Lint
        run: bun run lint
