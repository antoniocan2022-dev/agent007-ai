name: Agent007 Autonomy CI

on:
  push:
    branches:
      - 'development/**'
      - 'feat/**'
      - 'fix/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
      - 'development/**'

permissions:
  contents: read

jobs:
  static-integrity:
    name: Static integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: TypeScript check
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Autonomy domain tests
        run: bun test src/lib/autonomy/autonomy.test.ts src/lib/autonomy/capability-registry.test.ts src/lib/autonomy/autonomy-runtime.test.ts src/lib/autonomy/autonomy-runtime.integration.test.ts src/lib/tools-runtime.test.ts

      - name: Lint
        run: bun run lint
