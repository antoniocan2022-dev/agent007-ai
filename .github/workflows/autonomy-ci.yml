name: Agent007 Autonomy CI

on:
  push:
    branches:
      - main
      - 'development/**'
      - 'feat/**'
      - 'fix/**'
      - 'integration/**'
      - 'arch/**'
  pull_request:
    branches:
      - main
      - 'development/**'
      - 'feat/**'
      - 'fix/**'
      - 'integration/**'
      - 'arch/**'

permissions:
  contents: write

jobs:
  static-integrity:
    name: Static integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_test
      NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret
      OWNER_EMAIL: ci-owner@example.com
      SEED_EMAIL: ci-owner@example.com
      OWNER_BOOTSTRAP_PASSWORD: ci-only-strong-bootstrap-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent007_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent007_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: One-time canonical orchestrator prompt repair
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: trigger canonical orchestrator prompt repair')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/orchestrator.ts')
          text = path.read_text(encoding='utf-8')
          stale = 'You orchestrate 20 subagents.'
          if stale not in text:
              raise SystemExit('Expected stale orchestrator organization claim was not found; aborting.')

          import_line = "import { getCanonicalOrganizationPrompt } from './canonical-organization-prompt'"
          anchor = "import { assertDelegationAllowed, authorityLevelFor } from './architecture-control-plane'\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Canonical orchestrator import anchor not found.')
              text = text.replace(anchor, anchor + import_line + "\n", 1)

          start_marker = 'const ORCHESTRATOR_PROMPT_ADDENDUM = `'
          end_marker = '\nexport interface OrchestratorEventEmit {'
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0 or start >= end:
              raise SystemExit('Canonical orchestrator prompt block markers not found.')

          replacement = r'''const ORCHESTRATOR_PROMPT_ADDENDUM = `
ORCHESTRATION:
You are governed by the canonical Agent007 organization graph. Organization facts below are derived at runtime; do not invent, hardcode, or contradict leader, specialist, division, or venture-scope facts.

${getCanonicalOrganizationPrompt()}

For multi-step tasks, dispatch through the currently available sub-agent list supplied later in this prompt.
Use <dispatch agent="<canonical-id>" task="..."/> or <dispatch_subagent id="<canonical-id>">task</dispatch_subagent>.
Maximum dispatches per turn: ${MAX_DISPATCHES}.
After dispatches complete, synthesize and verify the results before answering.

MISSION PIPELINE:
Type "start mission: <type>: <objective>" to run the full governed pipeline.
Types: product_launch, content_creation, affiliate_campaign, generic.
Each stage is executed, independently verified, corrected when required, and then handed to the next stage.

The system handles quality scoring, cross-agent verification, tool-boundary enforcement, learning storage, notifications, and governed delegation automatically.`'''

          text = text[:start] + replacement + text[end:]

          for value in ('You orchestrate 20 subagents.', 'Plus 2 custom test agents (testfast2, fasttest3).', 'TEAM: SCOUT (research)'):
              if value in text:
                  raise SystemExit(f'Legacy organizational truth remains: {value}')

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/orchestrator.ts
          git diff --cached --check
          git commit -m "fix: derive orchestrator organization prompt canonically"
          git push origin HEAD:main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare test database
        run: bunx prisma db push --skip-generate

      - name: Reconcile commercial database schema contract
        run: bun run db:reconcile

      - name: Commercial database integrity integration suite
        run: bun test tests/commercial-database-integration.test.ts

      - name: Commercial lifecycle integration contract suite
        run: bun test tests/commercial-lifecycle-integration.test.ts

      - name: Commercial autonomy P0/P1 proof suite
        run: bun test tests/commercial-autonomy-loop.integration.test.ts

      - name: P0/P1 end-to-end contract audit
        run: bun scripts/p0-p1-autonomy-audit.ts

      - name: Phase A-C integrity certification gate
        run: bun test tests/phase-a-c-integrity.test.ts tests/stripe-economic-idempotency.integration.test.ts

      - name: CEO canonical decision integration
        run: bun test tests/ceo-venture-decision-integration.test.ts

      - name: CEO machine-verifiable authority envelope
        run: bun test tests/venture-authority-envelope.test.ts

      - name: Portfolio continuous learning integration
        run: bun test tests/portfolio-learning.integration.test.ts

      - name: Real-money proof architecture audit
        run: bun scripts/real-money-proof-audit.ts

      - name: Canonical organization, authority and venture-scope integrity
        run: bun test tests/architecture-control-plane.test.ts

      - name: Five-layer organization architecture audit
        run: bun scripts/organization-architecture-audit.ts

      - name: Phase 7 organizational single-source audit
        run: bun scripts/organizational-single-source-audit.ts

      - name: Deep integrated audit
        run: bun scripts/deep-integrity-audit.ts

      - name: Repository coherence audit
        run: bun scripts/repository-coherence-audit.ts

      - name: Venture architecture regression audit
        run: bun scripts/venture-architecture-audit.ts

      - name: Authentication integrity contract
        run: bun test tests/auth-login-integrity.test.ts tests/owner-bootstrap-login-contract.test.ts tests/login-2fa-flow-contract.test.ts

      - name: Truthful execution contract
        run: bun test tests/execution-contract.test.ts

      - name: Proof infrastructure contracts
        run: bun test tests/proof-ledger-contract.test.ts

      - name: Proof infrastructure database integration
        run: bun test tests/proof-ledger.integration.test.ts

      - name: Five-phase integrity and duplicate-file audit
        run: bun test tests/five-phase-integrity.test.ts

      - name: CEO verification hard gate
        run: bun test tests/ceo-verification-gate.test.ts

      - name: System proof, context, health and artifact contracts
        run: bun test tests/system-proof-and-context-contract.test.ts

      - name: Canonical runtime architecture
        run: bun test tests/canonical-runtime-integrity.test.ts

      - name: Adaptive execution architecture
        run: bun test tests/adaptive-execution.test.ts

      - name: CEO Decision Kernel
        run: bun test tests/ceo-decision-kernel.test.ts

      - name: Artifact evidence verification
        run: bun test tests/artifact-evidence.test.ts

      - name: CEO static shell and message navigation contract
        run: bun test tests/chat-layout-integrity.test.ts

      - name: Phase 5 independent verification officer
        run: bun test tests/verification-officer.test.ts tests/verification-gate.test.ts

      - name: Provider selection integrity
        run: bun test tests/provider-selection-contract.test.ts tests/provider-live-model-contract.test.ts

      - name: Hugging Face governed runtime
        run: bun test tests/huggingface-runtime.test.ts

      - name: Architecture 5-13 integration contract
        run: bun test src/lib/venture-foundation-contract.test.ts

      - name: Venture OS upgrades 14-17 contract
        run: bun test src/lib/venture-autonomy-14-17.test.ts

      - name: Venture OS 5-17 deep audit
        run: bun test src/lib/venture-os-5-17-deep-audit.test.ts

      - name: Subagent Governance validation
        run: bun scripts/validate-subagent-governance.ts

      - name: Governance + Provider + Model + Performance + Outcome Intelligence tests
        run: bun test src/lib/provider-intelligence-v2.test.ts src/lib/model-intelligence.test.ts src/lib/model-intelligence-runtime.test.ts src/lib/performance-intelligence.test.ts src/lib/outcome-intelligence.test.ts

      - name: Venture OS contract tests
        run: bun test src/lib/venture-os.test.ts src/lib/venture-decision-engine.test.ts

      - name: TypeScript check
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Autonomy domain tests
        run: bun test src/lib/autonomy/autonomy.test.ts src/lib/autonomy/autonomy-runtime.test.ts src/lib/autonomy/autonomy-runtime.integration.test.ts src/lib/autonomy/capability-registry.test.ts src/lib/autonomy/owner-authorization.test.ts src/lib/autonomy/autonomy-scorecard.test.ts src/lib/autonomy/operational-evidence-bridge.test.ts src/lib/tools-runtime.test.ts src/lib/mission-telemetry.autonomy.test.ts src/lib/runtime/background-tasks.test.ts tests/autonomy-graduation.integration.test.ts tests/phase-d-e-integration.test.ts

      - name: Phase A-E structural integrity
        run: bun test tests/phase-a-e-structural-integrity.test.ts

      - name: Lint
        run: bun run lint

      - name: Phase 8 production verification readiness
        run: bun scripts/production-verification-audit.ts

      - name: Upload production verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ github.sha }}
          path: .artifacts/production-verification-manifest.json
          if-no-files-found: error

# Release execution is intentionally separate and authorization-gated in production-release-watchdog.yml.
