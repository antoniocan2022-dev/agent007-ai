name: Complete canonical provider source repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Apply provider-neutral compatibility repair
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          compat = r'''import { callLlmWithRetry } from './agent-canonical-bridge'

export type CanonicalToolClient = ReturnType<typeof createCanonicalToolClient>

type SearchItem = { title?: string; name?: string; url?: string; description?: string; snippet?: string }

async function braveSearch(query: string, count = 5, recencyDays?: number) {
  const apiKey = process.env.BRAVE_API_KEY
  if (!apiKey) return { results: [] as SearchItem[] }
  const q = new URLSearchParams({ q, count: String(Math.min(Math.max(count, 1), 20)) })
  if (recencyDays && recencyDays > 0) q.set('freshness', `pd${Math.max(1, Math.round(recencyDays))}`)
  const response = await fetch(`https://api.search.brave.com/res/v1/web/search?${q}`, {
    headers: { Accept: 'application/json', 'X-Subscription-Token': apiKey },
    signal: AbortSignal.timeout(15000),
  })
  if (!response.ok) throw new Error(`Brave search failed: HTTP ${response.status}`)
  const data = await response.json() as any
  const results = Array.isArray(data?.web?.results) ? data.web.results.map((item: any) => ({
    title: item?.title,
    name: item?.title,
    url: item?.url,
    description: item?.description,
    snippet: item?.description,
  })) : []
  return { results }
}

async function pageReader(url: string) {
  const response = await fetch(url, {
    redirect: 'follow',
    signal: AbortSignal.timeout(15000),
    headers: { 'User-Agent': 'Agent007/1.0', Accept: 'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8' },
  })
  if (!response.ok) throw new Error(`page_reader: HTTP ${response.status}`)
  const html = await response.text()
  const title = html.match(/<title[^>]*>([^<]+)<\\/title>/i)?.[1]?.trim() ?? url
  return { data: { html, title } }
}

export function createCanonicalToolClient() {
  return {
    chat: {
      completions: {
        create: async (params: any) => callLlmWithRetry(params.messages, {
          temperature: params.temperature,
          maxTokens: params.max_tokens,
        }),
      },
    },
    functions: {
      invoke: async (name: string, args: any = {}) => {
        if (name === 'web_search') return braveSearch(String(args?.query ?? ''), Number(args?.num ?? 5), Number(args?.recency_days ?? 0))
        if (name === 'page_reader') return pageReader(String(args?.url ?? ''))
        throw new Error(`Canonical tool bridge does not implement legacy function: ${name}`)
      },
    },
    images: {
      generations: {
        create: async () => { throw new Error('Image generation is unavailable in the canonical provider set.') },
      },
    },
    audio: {
      asr: {
        create: async () => { throw new Error('Audio ASR uses the dedicated canonical HTTP path, not the legacy provider SDK.') },
      },
    },
    // Vision remains model-based: the canonical LLM lane receives the attachment reference as evidence.
    chatCompletionsVision: async (prompt: string, imageDataUrl: string) => callLlmWithRetry([
      { role: 'user', content: `${prompt}\n\nIMAGE_DATA_URL:\n${imageDataUrl.slice(0, 20000)}` },
    ], { taskType: 'analysis', verification: 'standard' }),
  }
}
'''
          Path('src/lib/canonical-tool-compat.ts').write_text(compat)

          # Replace locally defined legacy clients with the shared canonical client.
          client_files = [
            'src/lib/advanced-capabilities.ts',
            'src/lib/agent007-extensions.ts',
            'src/lib/agent007-meta.ts',
            'src/lib/business-infrastructure.ts',
            'src/lib/developer-enhancements.ts',
            'src/lib/enhanced-tools.ts',
            'src/lib/max-improvements.ts',
          ]
          helper = "async function getCanonicalLlmClient() { return createCanonicalToolClient() }\n"
          for name in client_files:
              p = Path(name)
              s = p.read_text()
              s = re.sub(r"\nasync function getCanonicalLlmClient\(\) \{.*?\n\}\n", '\n', s, flags=re.S)
              s = re.sub(r"\nasync function getZai\(\) \{.*?\n\}\n", '\n', s, flags=re.S)
              if "from './canonical-tool-compat'" not in s:
                  imports = list(re.finditer(r"^import .*\n", s, flags=re.M))
                  at = imports[-1].end() if imports else 0
                  s = s[:at] + "import { createCanonicalToolClient } from './canonical-tool-compat'\n" + s[at:]
              if 'getZai()' in s:
                  s = s.replace('getZai()', 'getCanonicalLlmClient()')
              if 'getCanonicalLlmClient()' in s:
                  imports = list(re.finditer(r"^import .*\n", s, flags=re.M))
                  at = imports[-1].end() if imports else 0
                  s = s[:at] + helper + s[at:]
              # max-improvements had a direct Z.AI client block; route it through the shared client.
              s = re.sub(r"const ZAI = \(await import\('z-ai-web-dev-sdk'\)\)\.default\n\s*let _z: any = \(globalThis as any\).__zai_singleton\n\s*if \(!_z\) \{ _z = await ZAI\.create\(\); \(globalThis as any\).__zai_singleton = _z \}\n\s*const results = await _z\.functions\.invoke", "const zai = await getCanonicalLlmClient()\n      const results = await zai.functions.invoke", s)
              p.write_text(s)

          # tools.ts: preserve the public getZai compatibility symbol, but return the canonical client.
          p = Path('src/lib/tools.ts')
          s = p.read_text()
          s = s.replace("import ZAI from 'z-ai-web-dev-sdk'\n", "import { createCanonicalToolClient } from './canonical-tool-compat'\n")
          s = re.sub(r"\nlet _zai: ZAI \| null = null\nasync function getZai\(\): Promise<ZAI> \{.*?\n\}\n", "\nasync function getZai() { return createCanonicalToolClient() }\n", s, flags=re.S)
          s = s.replace("const zai = await getZai()\n    const results = await zai.functions.invoke('web_search'", "const zai = await getZai()\n    const results = await zai.functions.invoke('web_search'")
          p.write_text(s)

          # Remove retired provider metadata from runtime health/audit/test configuration.
          p = Path('src/app/api/health/full-audit/route.ts')
          s = p.read_text()
          s = re.sub(r"\n\s*\{ id: 'gemini', env: 'GEMINI_API_KEY' \},", '', s)
          s = re.sub(r"\n\s*\{ id: 'z-ai', env: 'ZAI_API_KEY' \},", '', s)
          p.write_text(s)

          p = Path('src/app/api/system/capability-audit/route.ts')
          s = p.read_text()
          s = re.sub(r"\n\s*\{ name: 'z\.ai', env: 'ZAI_API_KEY', speed: 'medium', cost: 'free' \},", '', s)
          p.write_text(s)

          p = Path('src/lib/model-intelligence.test.ts')
          s = p.read_text()
          s = s.replace("const ACTIVE = ['cerebras', 'gemini', 'groq', 'mistral', 'zai'] as const", "const ACTIVE = ['cerebras', 'cloudflare', 'groq', 'mistral', 'openrouter'] as const")
          for old in [
              "  delete process.env.ZAI_API_KEY\n",
              "  delete process.env.GEMINI_API_KEY\n",
              "    process.env.ZAI_API_KEY = 'test'\n",
              "    process.env.GEMINI_API_KEY = 'test'\n",
          ]:
              s = s.replace(old, '')
          s = re.sub(r"\['groq', 'zai', 'mistral', 'gemini', 'cerebras'\]", "['groq', 'cloudflare', 'mistral', 'openrouter', 'cerebras']", s)
          p.write_text(s)

          # Keep multi-provider comparison aligned with the canonical provider control plane.
          p = Path('src/lib/multi-provider-comparison.ts')
          s = p.read_text()
          s = s.replace('mistral, groq, openrouter, cerebras, brave, gemini', 'mistral, groq, openrouter, cerebras, cloudflare')
          s = s.replace("      case 'gemini': return !!process.env.GEMINI_API_KEY\n", "      case 'cloudflare': return !!process.env.CLOUDFLARE_API_KEY\n")
          s = s.replace('GEMINI_API_KEY', 'CLOUDFLARE_API_KEY').replace("['gemini']", "['cloudflare']").replace("gemini", "cloudflare")
          p.write_text(s)

          # Remove stale provider versioning prose that trips the retirement gate.
          p = Path('src/lib/optimization-tools-v2.ts')
          s = p.read_text().replace('z-ai-web-dev-sdk: 1.4.0 → 1.5.1 (minor update available)', 'canonical provider control plane: governed runtime (no legacy SDK dependency)')
          p.write_text(s)

          # Remove temporary repair workflows; only this workflow remains until the commit below is made.
          for wf in ['.github/workflows/repair-media-tools.yml']:
              q = Path(wf)
              if q.exists(): q.unlink()
      - name: Validate full source and build
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E "z-ai-web-dev-sdk|ZAI\.create|ZAI_API_KEY|GEMINI_API_KEY|\"gemini\"|gemini-|z\.ai" -- src package.json bun.lock ':!src/lib/upgrade-manifest.ts'
          grep -nE "export async function tool(FileCreate|FileReadAny|FileDelete|FileModify|ImageProcess|AudioProcess|VideoProcess|DirectoryList)" src/lib/media-tools.ts
          bun install --frozen-lockfile
          bun run db:generate
          bunx tsc -p tsconfig.ci.json --noEmit
          bun run build
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/final-source-repair.yml
          git commit -m 'fix: complete canonical provider source repair'
          git push origin HEAD:main