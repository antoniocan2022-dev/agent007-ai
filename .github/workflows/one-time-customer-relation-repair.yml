name: One-time Customer Transaction relation repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-customer-transaction-relation.py'
      - '.github/workflows/one-time-customer-relation-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor == 'antoniocan2022-dev' || github.actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply relation completion
        run: python3 scripts/patch-customer-transaction-relation.py
      - name: Remove one-time repair files
        run: |
          rm -f scripts/patch-customer-transaction-relation.py .github/workflows/one-time-customer-relation-repair.yml
      - name: Commit relation completion
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma
          git add -u scripts/patch-customer-transaction-relation.py .github/workflows/one-time-customer-relation-repair.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(schema): complete Customer Transaction relation'
          git push origin main
