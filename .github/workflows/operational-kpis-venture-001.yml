name: Operational KPIs + Venture 001 Verification

on:
  push:
    branches:
      - 'feat/operational-kpis-venture-001'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify architecture and calculations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_test
      NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent007_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent007_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Prepare test database
        run: bunx prisma db push --skip-generate
      - name: Focused operational tests
        run: bun scripts/test-operational-kpis-venture-001.ts
      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit
      - name: Lint gate
        run: bun run lint
      - name: Repository coherence gate
        run: |
          test -f src/lib/operational-kpis.ts
          test -f src/lib/venture-001.ts
          test -f src/app/api/operational-kpis/route.ts
          test -f src/app/api/ventures/001/route.ts
          test -f src/components/agent/operational-kpi-panel.tsx
          test -f scripts/test-operational-kpis-venture-001.ts
          ! find . -type f \( -name '*.bak' -o -name '*.old' -o -name '*.tmp' -o -name '*.pyc' \) -print -quit | grep -q .
          ! find src -type f \( -name 'operational-kpis-v2.ts' -o -name 'venture-001-v2.ts' -o -name 'venture-reference-001.ts' \) -print -quit | grep -q .
      - name: Deployment safety gate
        run: |
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          ! grep -R "vercel deploy" .github/workflows/operational-kpis-venture-001.yml
