name: Normalize legacy provider callers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add canonical compatibility layer and normalize callers
        shell: python
        run: |
          from pathlib import Path
          import re

          compat = Path('src/lib/canonical-provider-compat.ts')
          compat.write_text('''import { callLlmWithRetry } from './agent-canonical-bridge'\nimport { canonicalWebSearch } from './canonical-web-search'\n\nasync function fetchPage(url: string) {\n  const response = await fetch(url, { signal: AbortSignal.timeout(15000), headers: { 'User-Agent': 'Agent007/1.0' } })\n  if (!response.ok) throw new Error(`Page fetch failed: HTTP ${response.status}`)\n  const html = await response.text()\n  const text = html.replace(/<script[\\s\\S]*?<\\/script>/gi, ' ').replace(/<style[\\s\\S]*?<\\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\\s+/g, ' ').trim()\n  return { data: { html, title: url, text: text.slice(0, 12000) } }\n}\n\nasync function generateImage(prompt: string, size = '1024x1024') {\n  const apiKey = process.env.OPENAI_API_KEY\n  if (!apiKey) throw new Error('Image generation requires OPENAI_API_KEY')\n  const response = await fetch('https://api.openai.com/v1/images/generations', { method: 'POST', headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'gpt-image-1', prompt, size }), signal: AbortSignal.timeout(30000) })\n  if (!response.ok) throw new Error(`Image generation failed: HTTP ${response.status}`)\n  return await response.json()\n}\n\nasync function vision(prompt: string, dataUrl?: string) {\n  return callLlmWithRetry([{ role: 'user', content: `${prompt}\\n${dataUrl ?? ''}` }], { taskType: 'analysis', verification: 'standard' })\n}\n\nexport async function getCanonicalCompatClient() {\n  return {\n    chat: { completions: { create: async (params: any) => callLlmWithRetry(params.messages ?? [], { temperature: params.temperature, maxTokens: params.max_tokens }) } },\n    functions: { invoke: async (name: string, args: any) => {\n      switch (name) {\n        case 'web_search': return await canonicalWebSearch(String(args?.query ?? ''), Number(args?.num ?? 5), Number(args?.recency_days ?? 0) || undefined)\n        case 'page_reader': return await fetchPage(String(args?.url ?? ''))\n        case 'image_gen': return await generateImage(String(args?.prompt ?? ''), String(args?.size ?? '1024x1024'))\n        case 'vision': return await vision(String(args?.prompt ?? ''), args?.image_url ?? args?.data_url)\n        default: throw new Error(`Unsupported canonical function: ${name}`)\n      }\n    } },\n  }\n}\n''')

          # Normalize every executable TS caller of the retired provider SDK.
          for p in Path('src').rglob('*.ts'):
              if p.name == 'upgrade-manifest.ts':
                  continue
              s = p.read_text()
              if 'z-ai-web-dev-sdk' not in s and 'getZai(' not in s and 'ZAI.create' not in s:
                  continue
              s = re.sub(r"^import\\s+ZAI\\s+from\\s+['\"]z-ai-web-dev-sdk['\"];?\\n", '', s, flags=re.M)
              s = re.sub(r"^import\\s+\\{?[^\\n]*['\"]z-ai-web-dev-sdk['\"][^\\n]*\\n", '', s, flags=re.M)
              s = re.sub(r"\\nasync function getZai\\(\\)(?::[^\\n]+)?\\s*\\{.*?\\n\\}\\n", '\n', s, flags=re.S)
              s = re.sub(r"\\nfunction getZai\\(\\)(?::[^\\n]+)?\\s*\\{.*?\\n\\}\\n", '\n', s, flags=re.S)
              if 'getZai()' in s:
                  s = s.replace('getZai()', 'getCanonicalCompatClient()')
              if 'getCanonicalCompatClient()' in s and "from './canonical-provider-compat'" not in s:
                  lines = s.splitlines(True)
                  pos = 0
                  while pos < len(lines) and (lines[pos].startswith('import ') or lines[pos].strip() == ''):
                      pos += 1
                  lines.insert(pos, "import { getCanonicalCompatClient } from './canonical-provider-compat'\\n")
                  s = ''.join(lines)
              s = s.replace("const ZAI = (await import('z-ai-web-dev-sdk')).default", "const canonicalClient = await getCanonicalCompatClient()")
              s = s.replace('await ZAI.create()', 'await getCanonicalCompatClient()')
              s = re.sub(r"\\bZAI\\b", 'CanonicalCompat', s)
              s = s.replace('ZAI_API_KEY', 'CANONICAL_LLM_NOT_USED')
              s = s.replace('GEMINI_API_KEY', 'CANONICAL_LLM_NOT_USED')
              p.write_text(s)

          # Restore the intact media module if the destructive migration truncated it, then replace only retired blocks.
          mp = Path('src/lib/media-tools.ts')
          if mp.exists():
              s = mp.read_text()
              if 'audioBase64' in s and "const audioBase64 =" not in s and 'toolAudioProcess' in s:
                  s = s.replace("        const form = new FormData()", "        const audioBase64 = (await fsp.readFile(fullPath)).toString('base64')\n        const form = new FormData()", 1)
                  mp.write_text(s)
      - name: Validate full source
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E "z-ai-web-dev-sdk|ZAI\.create|ZAI_API_KEY|GEMINI_API_KEY|['\"]gemini['\"]|gemini-" -- src package.json bun.lock ':!src/lib/upgrade-manifest.ts'
          bun install --frozen-lockfile
          bun run db:generate
          bunx tsc -p tsconfig.ci.json --noEmit
          bun run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/canonicalize-legacy-callers.yml
          git commit -m 'fix: normalize legacy provider callers safely'
          git push origin HEAD:main
