name: Agent007 TypeScript Hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Remove impossible intent comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/ceo-degraded-mode.ts')
          s=p.read_text()
          old="if (input.intent !== 'self_assessment') { const natural = buildNaturalRecoveryResponse"
          new="{ const natural = buildNaturalRecoveryResponse"
          if old in s:
              s=s.replace(old,new,1)
          elif "if (input.intent === 'self_assessment') return" in s and "if (input.intent !== 'self_assessment')" in s:
              s=s.replace("if (input.intent !== 'self_assessment') { const natural = buildNaturalRecoveryResponse","{ const natural = buildNaturalRecoveryResponse",1)
          else:
              raise SystemExit('degraded-mode guard not found')
          p.write_text(s)
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx tsc -p tsconfig.ci.json --noEmit
      - name: Commit hotfix and remove runner
        run: |
          git config user.name 'Agent007 CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent007-typescript-hotfix.yml
          git add src/lib/ceo-degraded-mode.ts
          git commit -m 'fix(ceo): remove impossible degraded intent branch'
          git push origin HEAD:main
