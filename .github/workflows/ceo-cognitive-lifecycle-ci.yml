name: CEO Cognitive Lifecycle CI

on:
  pull_request:
    paths:
      - 'src/lib/ceo-*.ts'
      - 'src/lib/adaptive-execution.ts'
      - 'src/lib/canonical-llm-router.ts'
      - 'src/lib/provider-runtime-v2.ts'
      - 'src/lib/agent-canonical-bridge.ts'
      - 'src/lib/orchestrator.ts'
      - 'src/lib/mission-*.ts'
      - 'src/app/api/agent/route.ts'
      - 'src/app/api/mission-active/**/route.ts'
      - 'src/app/api/system/mission-supervisor/**'
      - 'src/app/api/schedules/tick/route.ts'
      - 'scripts/run-venture-operation-cycle.ts'
      - 'src/lib/venture-operation-loop.ts'
      - 'src/lib/venture-autonomy-control.ts'
      - 'src/lib/venture-commercial-foundation.ts'
      - 'src/lib/venture-factory.ts'
      - 'src/lib/venture-001.ts'
      - 'src/lib/billing-lifecycle.ts'
      - 'src/lib/operational-kpi-engine.ts'
      - 'src/lib/reconcile-production-schema.ts'
      - 'src/lib/autonomy/**'
      - 'tests/ceo-cognitive-lifecycle.test.ts'
      - 'tests/mission-autonomy-supervisor.test.ts'
      - 'tests/commercial-venture-foundation.test.ts'
      - 'scripts/ceo-cognitive-lifecycle-audit.ts'
      - 'docs/CEO-COGNITIVE-LIFECYCLE.md'
      - 'docs/MISSION-AUTONOMY-SUPERVISOR.md'
      - 'tsconfig.ceo-lifecycle.json'
      - 'tsconfig.json'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'src/lib/ceo-*.ts'
      - 'src/lib/adaptive-execution.ts'
      - 'src/lib/canonical-llm-router.ts'
      - 'src/lib/provider-runtime-v2.ts'
      - 'src/lib/agent-canonical-bridge.ts'
      - 'src/lib/orchestrator.ts'
      - 'src/lib/mission-*.ts'
      - 'src/app/api/agent/route.ts'
      - 'src/app/api/mission-active/**/route.ts'
      - 'src/app/api/system/mission-supervisor/**'
      - 'src/app/api/schedules/tick/route.ts'
      - 'scripts/run-venture-operation-cycle.ts'
      - 'src/lib/venture-operation-loop.ts'
      - 'src/lib/venture-autonomy-control.ts'
      - 'src/lib/venture-commercial-foundation.ts'
      - 'src/lib/venture-factory.ts'
      - 'src/lib/venture-001.ts'
      - 'src/lib/billing-lifecycle.ts'
      - 'src/lib/operational-kpi-engine.ts'
      - 'src/lib/reconcile-production-schema.ts'
      - 'src/lib/autonomy/**'
      - 'tests/ceo-cognitive-lifecycle.test.ts'
      - 'tests/mission-autonomy-supervisor.test.ts'
      - 'tests/commercial-venture-foundation.test.ts'
      - 'scripts/ceo-cognitive-lifecycle-audit.ts'
      - 'docs/CEO-COGNITIVE-LIFECYCLE.md'
      - 'docs/MISSION-AUTONOMY-SUPERVISOR.md'
      - 'tsconfig.ceo-lifecycle.json'
      - 'tsconfig.json'
      - 'package.json'

permissions:
  contents: read

env:
  NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CEO architecture audit
        run: bun run audit:ceo-lifecycle

      - name: Run CEO lifecycle tests
        run: bun test tests/ceo-cognitive-lifecycle.test.ts

      - name: Run mission autonomy supervisor tests
        run: bun test tests/mission-autonomy-supervisor.test.ts

      - name: Run commercial venture foundation tests
        run: bun test tests/commercial-venture-foundation.test.ts

      - name: Typecheck CEO, autonomy, venture and commercial integration graph
        run: bunx tsc -p tsconfig.ceo-lifecycle.json --noEmit
