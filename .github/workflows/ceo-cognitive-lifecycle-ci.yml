      - 'prisma/schema.prisma'
      - 'tests/ceo-cognitive-lifecycle.test.ts'
      - 'tests/ceo-execution-contract.test.ts'
      - 'tests/ceo-recovery-policy.test.ts'
      - 'tests/ceo-real-request-corpus.test.ts'
      - 'tests/mission-autonomy-supervisor.test.ts'
      - 'tests/commercial-venture-foundation.test.ts'
      - 'tests/commercial-lifecycle-integration.test.ts'
      - 'tests/commercial-database-integration.test.ts'
      - 'tests/system-continuity-integrity.test.ts'
      - 'scripts/ceo-cognitive-lifecycle-audit.ts'
      - 'docs/CEO-COGNITIVE-LIFECYCLE.md'
      - 'docs/MISSION-AUTONOMY-SUPERVISOR.md'
      - 'docs/ARCHITECTURE-CONTINUITY-MAP.md'
      - 'tsconfig.ceo-lifecycle.json'
      - 'tsconfig.json'
      - 'package.json'

permissions:
  contents: read

env:
  NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_ci

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent007_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent007_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate Prisma client
        run: bun run db:generate

      - name: Create Prisma schema in CI database
        run: bunx prisma db push --accept-data-loss

      - name: Reconcile runtime commercial schema
        run: bun run db:reconcile

      - name: Run CEO architecture audit
        run: bun run audit:ceo-lifecycle

      - name: Run CEO lifecycle tests
        run: bun test tests/ceo-cognitive-lifecycle.test.ts

      - name: Run CEO execution contract regressions
        run: bun test tests/ceo-execution-contract.test.ts

      - name: Run CEO recovery policy tests
        run: bun test tests/ceo-recovery-policy.test.ts

      - name: Run real CEO request regression corpus
        run: bun test tests/ceo-real-request-corpus.test.ts

      - name: Run mission autonomy supervisor tests
        run: bun test tests/mission-autonomy-supervisor.test.ts

      - name: Run commercial venture foundation tests
        run: bun test tests/commercial-venture-foundation.test.ts

      - name: Run commercial lifecycle integration tests
        run: bun test tests/commercial-lifecycle-integration.test.ts

      - name: Run executable commercial database integration tests
        run: bun test tests/commercial-database-integration.test.ts

      - name: Run system continuity and transaction integrity tests
        run: bun test tests/system-continuity-integrity.test.ts

      - name: Typecheck CEO, autonomy, venture and commercial integration graph
        run: bunx tsc -p tsconfig.ceo-lifecycle.json --noEmit
