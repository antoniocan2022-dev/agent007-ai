name: Agent007 Revenue Execution Guardrails CI

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'development/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
      - 'development/**'

permissions:
  contents: read

jobs:
  revenue-execution-guardrails:
    name: Revenue execution guardrails contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_test
      NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret
      OWNER_EMAIL: ci-owner@example.com
      SEED_EMAIL: ci-owner@example.com
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent007_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent007_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare test database
        run: bunx prisma db push --skip-generate

      - name: Guardrail unit tests
        run: bun test src/lib/revenue-execution-guard.test.ts

      - name: Guardrail integration tests
        run: bun test src/lib/revenue-approval.integration.test.ts

      - name: TypeScript check
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Targeted lint
        run: bunx eslint src/lib/revenue-execution-guard.ts src/lib/revenue-execution-guard.test.ts src/lib/revenue-approval.ts src/lib/revenue-approval.integration.test.ts src/app/api/revenue-approval/route.ts
