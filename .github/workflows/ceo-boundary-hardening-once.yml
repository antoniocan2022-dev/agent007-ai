name: CEO Boundary Hardening (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact hardening transforms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected source pattern in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_exact('src/app/api/agent/route.ts',
              "import { safeConversationRows } from '@/lib/ceo-behavioral-policy'\n",
              "import { safeConversationRows } from '@/lib/ceo-behavioral-policy'\nimport { projectCeoPublicSsePayload } from '@/lib/ceo-public-transport'\nimport { filterConversationalMemories } from '@/lib/ceo-memory-visibility'\n")
          replace_exact('src/app/api/agent/route.ts',
              "function sse(event: string, data: unknown): string { const identity = getDeploymentIdentity(); const payload = data && typeof data === 'object' && !Array.isArray(data) ? { ...(data as Record<string, unknown>), deploymentId: identity.deploymentId, releaseCommit: identity.releaseCommit } : { data, deploymentId: identity.deploymentId, releaseCommit: identity.releaseCommit }; return `event: ${event}\\ndata: ${JSON.stringify(payload)}\\n\\n` }",
              "function sse(event: string, data: unknown): string { const identity = getDeploymentIdentity(); const payload = { ...projectCeoPublicSsePayload(event, data), deploymentId: identity.deploymentId, releaseCommit: identity.releaseCommit }; return `event: ${event}\\ndata: ${JSON.stringify(payload)}\\n\\n` }")
          replace_exact('src/app/api/agent/route.ts',
              "rows = (conversation?.Message ?? []).map((row) => ({ role: row.role, content: row.content, createdAt: row.createdAt }))",
              "rows = safeConversationRows((conversation?.Message ?? []).map((row) => ({ role: row.role, content: row.content, createdAt: row.createdAt })))")
          replace_exact('src/app/api/agent/route.ts',
              "let memories: PersistedMemoryRow[] = []\n  try { memories = await db.memory.findMany({ orderBy: { updatedAt: 'desc' }, take: 40, select: { key: true, value: true, category: true, updatedAt: true } })",
              "let memories: PersistedMemoryRow[] = []\n  try { memories = filterConversationalMemories(await db.memory.findMany({ orderBy: { updatedAt: 'desc' }, take: 40, select: { key: true, value: true, category: true, updatedAt: true } }))")
          replace_exact('src/app/api/agent/route.ts',
              "memories = fallback.slice(0, 40).map((entry) => ({ key: entry.key, value: entry.value, category: entry.category, updatedAt: entry.createdAt }))",
              "memories = filterConversationalMemories(fallback.slice(0, 40).map((entry) => ({ key: entry.key, value: entry.value, category: entry.category, updatedAt: entry.createdAt })))")
          replace_exact('src/app/api/agent/route.ts',
              "if (provenance) {\n            try { persistedAssistantMessageId = await persistCeoAssistantMessage({ conversationId, content: response.content, provenance, capturedTurnSequence: myTurnSequence }) } catch (persistErr: any) {\n              if (persistErr instanceof CeoResponseSupersededError) { responseSuperseded = true; await recordSupersededCeoResponse({ conversationId, content: response.content, capturedTurnSequence: myTurnSequence, latestRevision: persistErr.latestRevision }).catch((auditErr) => console.warn('[api/agent] Superseded-response audit logging failed:', auditErr instanceof Error ? auditErr.message.slice(0, 150) : String(auditErr))) }\n              else console.warn('[api/agent] CEO-lane assistant persistence failed:', persistErr?.message?.slice(0, 150))\n            }\n          } else console.warn('[api/agent] CEO-lane assistant persistence skipped: missing final response provenance.')",
              "if (provenance) {\n            try { persistedAssistantMessageId = await persistCeoAssistantMessage({ conversationId, content: response.content, provenance, capturedTurnSequence: myTurnSequence }) } catch (persistErr: any) {\n              if (persistErr instanceof CeoResponseSupersededError) { responseSuperseded = true; await recordSupersededCeoResponse({ conversationId, content: response.content, capturedTurnSequence: myTurnSequence, latestRevision: persistErr.latestRevision }).catch((auditErr) => console.warn('[api/agent] Superseded-response audit logging failed:', auditErr instanceof Error ? auditErr.message.slice(0, 150) : String(auditErr))) }\n              else { console.warn('[api/agent] CEO-lane assistant persistence failed:', persistErr?.message?.slice(0, 150)); throw persistErr }\n            }\n          } else throw new Error('CEO_RESPONSE_PERSISTENCE_PROVENANCE_MISSING')")
          replace_exact('src/app/api/agent/route.ts',
              "if (synthesisProvenance) {\n            try { await updateCeoAssistantMessage({ messageId: result.persistedAssistantMessageId, content: synthesis.content, provenance: synthesisProvenance, capturedTurnSequence: myTurnSequence, conversationId }) } catch (persistErr: any) {\n              if (persistErr instanceof CeoResponseSupersededError) { responseSuperseded = true; await recordSupersededCeoResponse({ conversationId, content: synthesis.content, capturedTurnSequence: myTurnSequence, latestRevision: persistErr.latestRevision }).catch((auditErr) => console.warn('[api/agent] Superseded-synthesis audit logging failed:', auditErr instanceof Error ? auditErr.message.slice(0, 150) : String(auditErr))) }\n              else console.warn('[api/agent] Operational synthesis history update failed:', persistErr?.message?.slice(0, 150))\n            }\n          } else console.warn('[api/agent] Operational synthesis history update skipped: missing final response provenance.')",
              "if (synthesisProvenance) {\n            try { await updateCeoAssistantMessage({ messageId: result.persistedAssistantMessageId, content: synthesis.content, provenance: synthesisProvenance, capturedTurnSequence: myTurnSequence, conversationId }) } catch (persistErr: any) {\n              if (persistErr instanceof CeoResponseSupersededError) { responseSuperseded = true; await recordSupersededCeoResponse({ conversationId, content: synthesis.content, capturedTurnSequence: myTurnSequence, latestRevision: persistErr.latestRevision }).catch((auditErr) => console.warn('[api/agent] Superseded-synthesis audit logging failed:', auditErr instanceof Error ? auditErr.message.slice(0, 150) : String(auditErr))) }\n              else { console.warn('[api/agent] Operational synthesis history update failed:', persistErr?.message?.slice(0, 150)); throw persistErr }\n            }\n          } else throw new Error('CEO_RESPONSE_PERSISTENCE_PROVENANCE_MISSING')")

          replace_exact('src/lib/ceo-cognitive-contract.ts',
              "export interface FinalResponseProvenance { finalizationId: string; finalResponseHash: string; finalContentLength: number; candidateId?: string; candidateHash?: string; qualityDecisionId?: string; sanitized: boolean; rejected: boolean }",
              "export interface FinalResponseProvenance { finalizationId: string; finalResponseHash: string; finalContentLength: number; candidateId?: string; candidateHash?: string; qualityDecisionId?: string; responseAction?: ResponseAction; sanitized: boolean; rejected: boolean }")

          p = Path('src/lib/ceo-response-finalizer.ts')
          text = p.read_text()
          text = text.replace("import type { CeoResponseDecisionEnvelope } from './ceo-response-contract'", "import type { CeoResponseDecisionEnvelope } from './ceo-response-contract'\nimport type { ResponseAction } from './ceo-cognitive-contract'", 1)
          text = text.replace("export interface FinalizedCeoResponse { readonly content: string; readonly finalizationId: string; readonly finalResponseHash: string; readonly candidateId?: string; readonly qualityDecisionId?: string; readonly candidateHash?: string; readonly sanitized: boolean; readonly rejected: boolean }", "export interface FinalizedCeoResponse { readonly content: string; readonly finalizationId: string; readonly finalResponseHash: string; readonly candidateId?: string; readonly qualityDecisionId?: string; readonly candidateHash?: string; readonly responseAction?: ResponseAction; readonly sanitized: boolean; readonly rejected: boolean }", 1)
          text = text.replace("qualityDecisionId: input.decisionEnvelope.quality.decisionId, candidateHash: input.decisionEnvelope.candidate.contentHash, sanitized: false", "qualityDecisionId: input.decisionEnvelope.quality.decisionId, candidateHash: input.decisionEnvelope.candidate.contentHash, responseAction: input.decisionEnvelope.controlPlaneSummary.responseAction, sanitized: false", 1)
          text = text.replace("candidateId?: string; candidateHash?: string; qualityDecisionId?: string; sanitized: boolean; rejected: boolean; context: string | undefined", "candidateId?: string; candidateHash?: string; qualityDecisionId?: string; responseAction?: ResponseAction; sanitized: boolean; rejected: boolean; context: string | undefined", 1)
          text = text.replace("candidateId: response.candidateId, candidateHash: response.candidateHash, qualityDecisionId: response.qualityDecisionId, sanitized: response.sanitized", "candidateId: response.candidateId, candidateHash: response.candidateHash, qualityDecisionId: response.qualityDecisionId, responseAction: response.responseAction, sanitized: response.sanitized", 1)
          p.write_text(text)

          p = Path('src/lib/ceo-response-composer.ts')
          text = p.read_text()
          text = text.replace("import type { EvidenceState, QualityResult } from './ceo-cognitive-contract'", "import type { EvidenceState, QualityResult, ResponseAction } from './ceo-cognitive-contract'", 1)
          text = text.replace("input: { content: string; quality: QualityResult; evidenceState: EvidenceState; degraded: boolean; conversational?: boolean; requestId?: string }", "input: { content: string; quality: QualityResult; evidenceState: EvidenceState; degraded: boolean; conversational?: boolean; requestId?: string; responseAction?: ResponseAction }", 1)
          text = text.replace("responseAction: undefined, evidenceState", "responseAction: input.responseAction ?? input.quality.finalResponseProvenance?.responseAction, evidenceState", 1)
          text = text.replace("input: { content: string; quality: QualityResult; evidenceState: EvidenceState; degraded: boolean; conversational?: boolean; userFacingStatus?: boolean; context?: string; requestId?: string }", "input: { content: string; quality: QualityResult; evidenceState: EvidenceState; degraded: boolean; conversational?: boolean; userFacingStatus?: boolean; context?: string; requestId?: string; responseAction?: ResponseAction }", 1)
          text = text.replace("degraded: input.degraded, conversational: input.conversational, requestId: input.requestId", "degraded: input.degraded, conversational: input.conversational, requestId: input.requestId, responseAction: input.responseAction", 1)
          text = text.replace("input: { content: string; evidenceState: EvidenceState; quality: QualityResult; degraded: boolean; conversational?: boolean; userFacingStatus?: boolean; requestId?: string }", "input: { content: string; evidenceState: EvidenceState; quality: QualityResult; degraded: boolean; conversational?: boolean; userFacingStatus?: boolean; requestId?: string; responseAction?: ResponseAction }", 1)
          text = text.replace("degraded: input.degraded, conversational: input.conversational, requestId: input.requestId })", "degraded: input.degraded, conversational: input.conversational, requestId: input.requestId, responseAction: input.responseAction })", 1)
          p.write_text(text)

          p = Path('src/lib/ceo-control-plane-summary.ts')
          text = p.read_text()
          text = text.replace("if (!summary.evidenceState || !summary.qualityDecision) throw new Error('CEO_CONTROL_PLANE_SUMMARY_INVALID')", "if (!summary.evidenceState || !summary.qualityDecision) throw new Error('CEO_CONTROL_PLANE_SUMMARY_INVALID')\n  if (summary.degraded && summary.executionCompleted) throw new Error('CEO_CONTROL_PLANE_DEGRADED_EXECUTION_INCONSISTENT')", 1)
          p.write_text(text)

          Path('.github/workflows/ceo-boundary-hardening-once.yml').unlink()
          PY
          git diff --check

      - name: Commit hardened main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/agent/route.ts src/lib/ceo-cognitive-contract.ts src/lib/ceo-response-finalizer.ts src/lib/ceo-response-composer.ts src/lib/ceo-control-plane-summary.ts src/lib/ceo-public-transport.ts .github/workflows/ceo-cognitive-lifecycle-ci.yml .github/workflows/ceo-boundary-hardening-once.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(ceo): enforce trust boundaries and canonical persistence [skip ci]"
          git push origin HEAD:main
