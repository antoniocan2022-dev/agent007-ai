name: Architecture Hardening — Hierarchy + Artifact Ledger

on:
  push:
    branches:
      - feat/real-hierarchy-artifact-ledger

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[architecture-upgrade]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply idempotent architecture transformation
        run: python3 scripts/apply-hierarchy-artifact-ledger.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma validation
        run: bunx prisma validate

      - name: Prisma client generation
        run: bunx prisma generate

      - name: TypeScript production graph check
        run: |
          cat > tsconfig.architecture.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "types": ["node", "bun-types"]
            },
            "files": [
              "src/lib/hierarchy-control.ts",
              "src/lib/artifact-ledger.ts",
              "src/lib/subagent-governance.ts",
              "src/lib/subagents.ts",
              "src/lib/orchestrator.ts",
              "src/lib/mission-pipeline.ts"
            ]
          }
          EOF
          bunx tsc --noEmit -p tsconfig.architecture.json
          rm -f tsconfig.architecture.json

      - name: Runtime hierarchy tests
        run: |
          bun -e "import { validateHierarchy } from './src/lib/hierarchy-control.ts'; const errors = validateHierarchy(); if (errors.length) { console.error(errors.join('\\n')); process.exit(1) } console.log('Hierarchy runtime tests: PASS')"

      - name: Static architecture invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')

          hierarchy = (root / 'src/lib/hierarchy-control.ts').read_text()
          assert "vid: 'ceo'" in hierarchy
          assert "aurora: 'vid'" in hierarchy
          assert "quill: 'aurora'" in hierarchy
          assert "developer: 'forge'" in hierarchy
          assert "evaluateDelegation('ceo', 'quill').allowed !== true" in hierarchy

          schema = (root / 'prisma/schema.prisma').read_text()
          assert 'model ArtifactLedger {' in schema
          for field in ['artifactId        String    @unique', 'contentHash       String', 'producerAgentId   String', 'consumerAgentId   String?']:
              assert field in schema, f'Missing schema field: {field}'

          db = (root / 'src/lib/db.ts').read_text()
          assert 'CREATE TABLE IF NOT EXISTS "ArtifactLedger"' in db
          assert 'ArtifactLedger_missionId_idx' in db

          ledger = (root / 'src/lib/artifact-ledger.ts').read_text()
          for symbol in ['registerArtifact', 'verifyArtifact', 'handoffArtifact', 'validateArtifactChain', 'hashArtifact']:
              assert f'export async function {symbol}' in ledger or f'export function {symbol}' in ledger, symbol

          governance = (root / 'src/lib/subagent-governance.ts').read_text()
          assert "from './hierarchy-control'" in governance
          assert "reportsTo: 'ceo'" in governance
          assert 'reportsTo: HIERARCHY_PARENT.' in governance

          mission = (root / 'src/lib/mission-pipeline.ts').read_text()
          assert 'previousArtifactId' in mission
          assert 'parentArtifactId' in mission
          assert 'handoffArtifact' in mission
          assert 'artifactId' in mission
          assert 'registerArtifact' in mission

          subs = (root / 'src/lib/subagents.ts').read_text()
          assert "from './hierarchy-control'" in subs
          assert "from './artifact-ledger'" in subs
          assert 'assertDelegationAllowed' in subs
          assert 'registerArtifact' in subs
          assert 'handoffArtifact' in subs

          orch = (root / 'src/lib/orchestrator.ts').read_text()
          assert "from './artifact-ledger'" in orch
          assert "parentAgentId: 'ceo'" in orch
          print('Static architecture invariants: PASS')
          PY

      - name: Git whitespace / diff validation
        run: git diff --check

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were necessary after transformation."
          else
            git commit -m "fix: make hierarchy and artifact handoffs executable [architecture-upgrade]"
            git push origin "${GITHUB_REF_NAME}"
          fi
