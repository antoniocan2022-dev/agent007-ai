name: Architecture Hardening — Hierarchy + Artifact Ledger

on:
  push:
    branches:
      - feat/real-hierarchy-artifact-ledger

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[architecture-upgrade]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply idempotent architecture transformations
        run: |
          python3 scripts/apply-hierarchy-artifact-ledger.py
          python3 scripts/patch-max-autonomy-hierarchy.py
          python3 scripts/patch-autonomy-tools-hierarchy.py
          python3 scripts/patch-owner-oversight.py

      - name: Verify transformed control-plane sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          team = Path('src/app/api/team/[leaderId]/route.ts').read_text()
          active = Path('src/app/api/mission-active/[missionId]/route.ts').read_text()
          print('TEAM owner marker:', 'OWNER_AUTHORITY_ID' in team)
          print('TEAM owner mode:', "delegationAuthority: 'owner'" in team)
          print('TEAM parent marker:', 'parentAgentId: OWNER_AUTHORITY_ID' in team)
          print('ACTIVE parent helper:', 'getParentId' in active)
          print('ACTIVE parent propagation:', "parentAgentId: getParentId(sub.id) ?? 'vid'" in active)
          if not all([
              'OWNER_AUTHORITY_ID' in team,
              "delegationAuthority: 'owner'" in team,
              'parentAgentId: OWNER_AUTHORITY_ID' in team,
              'getParentId' in active,
              "parentAgentId: getParentId(sub.id) ?? 'vid'" in active,
          ]):
              raise SystemExit('Control-plane transformation did not materialize all required authority markers.')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma validation
        run: bunx prisma validate

      - name: Prisma client generation
        run: bunx prisma generate

      - name: TypeScript production graph check
        run: |
          cat > qrcode-architecture.d.ts <<'EOF'
          declare module 'qrcode';
          EOF
          cat > tsconfig.architecture.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2017",
              "lib": ["DOM", "DOM.Iterable", "ESNext"],
              "allowJs": true,
              "skipLibCheck": true,
              "strict": true,
              "noImplicitAny": false,
              "noEmit": true,
              "esModuleInterop": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "react-jsx",
              "incremental": false,
              "baseUrl": ".",
              "paths": {
                "@/lib/tools": ["./src/lib/tools-runtime"],
                "@/*": ["./src/*"]
              },
              "types": ["node", "bun-types"]
            },
            "files": [
              "qrcode-architecture.d.ts",
              "src/lib/hierarchy-control.ts",
              "src/lib/artifact-ledger.ts",
              "src/lib/subagent-governance.ts",
              "src/lib/subagents.ts",
              "src/lib/orchestrator.ts",
              "src/lib/mission-pipeline.ts",
              "src/lib/max-autonomy-engine.ts",
              "src/lib/autonomy-tools.ts",
              "src/app/api/mission-active/[missionId]/route.ts",
              "src/app/api/team/[leaderId]/route.ts"
            ]
          }
          EOF
          bunx tsc -p tsconfig.architecture.json
          rm -f tsconfig.architecture.json qrcode-architecture.d.ts

      - name: Runtime hierarchy tests
        run: |
          bun -e "import { validateHierarchy, evaluateDelegation } from './src/lib/hierarchy-control.ts'; const errors = validateHierarchy(); if (errors.length) { console.error(errors.join('\\n')); process.exit(1) }; if (!evaluateDelegation('owner','quill',true,'owner').allowed) process.exit(1); console.log('Hierarchy runtime tests: PASS')"

      - name: Static architecture invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')

          required = [
              'src/lib/hierarchy-control.ts', 'src/lib/artifact-ledger.ts', 'src/lib/subagent-governance.ts',
              'src/lib/subagents.ts', 'src/lib/orchestrator.ts', 'src/lib/mission-pipeline.ts',
              'src/lib/max-autonomy-engine.ts', 'src/lib/autonomy-tools.ts', 'src/lib/tools.ts',
              'src/app/api/mission-active/[missionId]/route.ts', 'src/app/api/team/[leaderId]/route.ts',
              'prisma/schema.prisma', 'src/lib/db.ts',
          ]
          missing = [p for p in required if not (root / p).is_file()]
          assert not missing, f'Missing required files: {missing}'

          hierarchy = (root / 'src/lib/hierarchy-control.ts').read_text()
          for token in ["vid: 'ceo'", "aurora: 'vid'", "quill: 'aurora'", "developer: 'forge'", 'evaluateDelegation', 'OWNER_AUTHORITY_ID']:
              assert token in hierarchy, token

          schema = (root / 'prisma/schema.prisma').read_text()
          assert schema.count('model ArtifactLedger {') == 1
          for field in ['artifactId        String    @unique', 'contentHash       String', 'producerAgentId   String', 'consumerAgentId   String?']:
              assert field in schema, f'Missing schema field: {field}'

          db = (root / 'src/lib/db.ts').read_text()
          assert db.count('CREATE TABLE IF NOT EXISTS "ArtifactLedger"') == 1
          assert 'ArtifactLedger_missionId_idx' in db

          ledger = (root / 'src/lib/artifact-ledger.ts').read_text()
          for symbol in ['registerArtifact', 'verifyArtifact', 'handoffArtifact', 'validateArtifactChain', 'hashArtifact']:
              assert f'export async function {symbol}' in ledger or f'export function {symbol}' in ledger, symbol

          governance = (root / 'src/lib/subagent-governance.ts').read_text()
          assert "from './hierarchy-control'" in governance
          assert "reportsTo: 'ceo'" in governance
          assert 'reportsTo: HIERARCHY_PARENT.' in governance

          mission = (root / 'src/lib/mission-pipeline.ts').read_text()
          for token in ['previousArtifactId','parentArtifactId','handoffArtifact','artifactId','registerArtifact']:
              assert token in mission, token

          subs = (root / 'src/lib/subagents.ts').read_text()
          for token in ["from './hierarchy-control'", "from './artifact-ledger'", 'DelegationAuthority', 'assertDelegationAllowed', 'registerArtifact', 'handoffArtifact']:
              assert token in subs, token

          orch = (root / 'src/lib/orchestrator.ts').read_text()
          assert "from './artifact-ledger'" in orch
          assert "parentAgentId: 'ceo'" in orch

          autonomy = (root / 'src/lib/max-autonomy-engine.ts').read_text()
          assert autonomy.count("parentConversationId: 'mission',\n        parentAgentId: 'vid',") == 3
          assert autonomy.count("parentConversationId: 'offline',\n          parentAgentId: 'vid',") == 1

          auto_tools = (root / 'src/lib/autonomy-tools.ts').read_text()
          assert "parentAgentId: ctx?.parentAgentId ?? 'vid'" in auto_tools
          tools = (root / 'src/lib/tools.ts').read_text()
          assert 'parentAgentId?: string' in tools

          active_route = (root / 'src/app/api/mission-active/[missionId]/route.ts').read_text()
          assert 'getParentId' in active_route, 'ACTIVE_ROUTE missing getParentId'
          assert "parentAgentId: getParentId(sub.id) ?? 'vid'" in active_route, 'ACTIVE_ROUTE missing governed parent propagation'
          assert "appendLeaderMessageDB(missionId, leaderInfo.leaderId, 'LEADER', leaderResponse)" in active_route, 'ACTIVE_ROUTE invalid DB leader role'
          assert "appendLeaderMessage(missionId, leaderInfo.leaderId, 'LEADER', leaderResponse)" in active_route, 'ACTIVE_ROUTE invalid memory leader role'

          team_route = (root / 'src/app/api/team/[leaderId]/route.ts').read_text()
          assert 'OWNER_AUTHORITY_ID' in team_route, 'TEAM_ROUTE missing owner authority id'
          assert "parentAgentId: OWNER_AUTHORITY_ID" in team_route, 'TEAM_ROUTE missing owner parent propagation'
          assert "delegationAuthority: 'owner'" in team_route, 'TEAM_ROUTE missing owner delegation mode'

          src_names = [p.name for p in (root / 'src/lib').iterdir() if p.is_file()]
          assert src_names.count('hierarchy-control.ts') == 1, 'Duplicate hierarchy-control.ts'
          assert src_names.count('artifact-ledger.ts') == 1, 'Duplicate artifact-ledger.ts'
          assert not list(root.rglob('*.pyc')), 'Generated Python bytecode must not be committed.'

          production_files = [p for p in root.glob('src/**/*.ts') if p.is_file() and not p.name.endswith('.test.ts')]
          for path in production_files:
              text = path.read_text()
              for match in re.finditer(r'runSubagent\(\s*\{', text):
                  snippet = text[match.start():match.start()+1800]
                  assert 'parentAgentId:' in snippet, f'Unparented runSubagent call in {path}'

          print('Static architecture invariants: PASS')
          PY

      - name: Git whitespace / diff validation
        run: |
          git diff --check
          if git ls-files '*.pyc' | grep -q .; then
            echo 'Committed bytecode artifact detected'; exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          assert (root / 'src/lib/hierarchy-control.ts').is_file()
          assert (root / 'src/lib/artifact-ledger.ts').is_file()
          assert len(list((root / 'src/lib').glob('hierarchy-control.ts'))) == 1
          assert len(list((root / 'src/lib').glob('artifact-ledger.ts'))) == 1
          print('Diff/missing/duplicate/bytecode checks: PASS')
          PY

      - name: Commit repaired source
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if ! git diff --quiet; then
            git add prisma/schema.prisma src/lib src/app/api scripts .github/workflows/architecture-hardening.yml
            git commit -m "chore: apply verified hierarchy and artifact ledger [architecture-upgrade]"
            git push origin "${GITHUB_REF_NAME}"
          else
            echo 'No source repairs required; repository already clean.'
          fi