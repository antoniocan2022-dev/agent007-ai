name: Retire ZAI runtime dependency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'chore: retire z.ai runtime dependency'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Remove retired ZAI runtime and dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/lib/tools.ts')
          text = path.read_text()
          text = text.replace("import ZAI from 'z-ai-web-dev-sdk'\n", '')
          text = re.sub(r"let _zai: ZAI \| null = null\nasync function getZai\(\): Promise<ZAI> \{\n  if \(!_zai\) _zai = await ZAI\.create\(\)\n  return _zai\n\}\n\n", '', text)
          start = text.index('/* ----------------------------- Web search ----------------------------- */')
          end = text.index('/* ----------------------------- Page reader ---------------------------- */')
          replacement = r'''/* ----------------------------- Web search ----------------------------- */
          export async function toolWebSearch(
            args: { query?: string; num?: number; recency_days?: number },
            _ctx: ToolContext
          ): Promise<ToolResult> {
            const query = (args?.query ?? '').toString().trim()
            if (!query) return badResult('Missing "query" argument for web_search')
            const cached = getCached('web_search', args)
            if (cached) return { ...cached, preview: '[cached] ' + cached.preview }
            const limit = Math.min(Math.max(args.num ?? 5, 1), 10)

            if (process.env.BRAVE_API_KEY) {
              try {
                const response = await fetch(`https://api.search.brave.com/res/v1/web/search?q=${encodeURIComponent(query)}&count=${limit}`, {
                  signal: AbortSignal.timeout(8000),
                  headers: { Accept: 'application/json', 'X-Subscription-Token': process.env.BRAVE_API_KEY },
                })
                if (response.ok) {
                  const data = await response.json().catch(() => ({}))
                  const results: any[] = (data?.web?.results ?? []).map((item: any) => ({
                    name: item.title ?? item.url,
                    url: item.url,
                    snippet: String(item.description ?? '').slice(0, 400),
                    date: item.age ?? item.published,
                  })).slice(0, limit)
                  if (results.length) {
                    const formatted = results.map((item, i) => `${i + 1}. **${item.name}**\n   URL: ${item.url}\n   ${item.snippet}${item.date ? `\n   Date: ${item.date}` : ''}`).join('\n\n')
                    const out = okResult(results.slice(0, 3).map((item) => `• ${item.name}`).join('\n') + ' (via Brave Search)', `Web search results for "${query}" (via Brave Search):\n\n${formatted}`)
                    setCached('web_search', args, out)
                    return out
                  }
                }
              } catch (error: any) {
                console.warn('[web_search] Brave fallback failed:', error?.message?.slice(0, 120))
              }
            }

            try {
              const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`, {
                signal: AbortSignal.timeout(10000),
                headers: { 'User-Agent': 'Agent007-AI/2.0' },
              })
              const data = await response.json().catch(() => ({}))
              const results: any[] = []
              if (data.AbstractText) results.push({ name: data.Heading || query, url: data.AbstractURL || `https://duckduckgo.com/?q=${encodeURIComponent(query)}`, snippet: String(data.AbstractText).slice(0, 400) })
              if (Array.isArray(data.RelatedTopics)) {
                for (const topic of data.RelatedTopics.slice(0, 8)) {
                  if (topic?.Text && topic?.FirstURL) results.push({ name: String(topic.Text).slice(0, 80), url: topic.FirstURL, snippet: String(topic.Text).slice(0, 400) })
                  if (results.length >= limit) break
                }
              }
              if (results.length) {
                const formatted = results.slice(0, limit).map((item, i) => `${i + 1}. **${item.name}**\n   URL: ${item.url}\n   ${item.snippet}`).join('\n\n')
                const out = okResult(results.slice(0, 3).map((item) => `• ${item.name}`).join('\n') + ' (via DuckDuckGo)', `Web search results for "${query}" (via DuckDuckGo):\n\n${formatted}`)
                setCached('web_search', args, out)
                return out
              }
            } catch (error: any) {
              console.warn('[web_search] DuckDuckGo fallback failed:', error?.message?.slice(0, 120))
            }

            try {
              const response = await fetch(`https://www.google.com/search?q=${encodeURIComponent(query)}&num=${limit}`, {
                signal: AbortSignal.timeout(10000),
                headers: { 'User-Agent': 'Mozilla/5.0 Agent007-AI/2.0', Accept: 'text/html' },
              })
              const html = await response.text().catch(() => '')
              const urls = [...html.matchAll(/<a href="\/url\?q=([^&"]+)/g)].map((match) => decodeURIComponent(match[1]))
              const titles = [...html.matchAll(/<h3[^>]*>([^<]+)<\/h3>/g)].map((match) => match[1])
              const results = urls.slice(0, Math.min(limit, titles.length)).map((url, i) => ({ name: titles[i], url, snippet: titles[i] }))
              if (results.length) {
                const formatted = results.map((item, i) => `${i + 1}. **${item.name}**\n   URL: ${item.url}`).join('\n\n')
                const out = okResult(results.slice(0, 3).map((item) => `• ${item.name}`).join('\n') + ' (via Google)', `Web search results for "${query}" (via Google):\n\n${formatted}`)
                setCached('web_search', args, out)
                return out
              }
            } catch (error: any) {
              console.warn('[web_search] Google fallback failed:', error?.message?.slice(0, 120))
            }

            return badResult(`web_search exhausted Brave, DuckDuckGo, and Google for "${query}". Use http_fetch or page_reader with a specific URL.`)
          }

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          bun remove z-ai-web-dev-sdk
          bunx tsc -p tsconfig.ci.json --noEmit
          bun scripts/provider-control-plane-audit.ts
          git diff --check
          if git diff --quiet; then
            echo 'No migration changes produced'; exit 0
          fi
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/tools.ts package.json bun.lock
          git commit -m 'chore: retire z.ai runtime dependency'
          git push origin main
      - name: Self-delete migration workflow
        run: |
          git rm .github/workflows/retire-zai-runtime.yml
          git commit -m 'chore: remove one-time ZAI migration workflow'
          git push origin main
