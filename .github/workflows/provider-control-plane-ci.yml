name: Provider Control Plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/provider-control-plane.ts'
      - 'src/lib/provider-runtime-v2.ts'
      - 'src/lib/provider-intelligence.ts'
      - 'src/lib/provider-intelligence-policy.ts'
      - 'src/lib/model-intelligence.ts'
      - 'src/lib/subagent-governance.ts'
      - 'src/lib/provider-capability-health.ts'
      - 'src/lib/provider-error-lifecycle.ts'
      - 'src/lib/ceo-cognitive-lifecycle.ts'
      - 'src/lib/agent.ts'
      - 'src/app/api/system/diagnose-providers/route.ts'
      - 'src/app/api/release-health/route.ts'
      - 'src/app/api/health/provider-canary/route.ts'
      - 'src/app/api/health/llm-providers/route.ts'
      - 'src/app/api/health/llm-test/route.ts'
      - 'tests/provider-control-plane.integration.test.ts'
      - 'tests/provider-live-probe-regression.test.ts'
      - 'tests/provider-live-model-contract.test.ts'
      - 'tests/ceo-cognitive-lifecycle.test.ts'
      - 'src/lib/model-intelligence-runtime.test.ts'
      - 'scripts/provider-control-plane-audit.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/provider-control-plane-ci.yml'

permissions:
  contents: write

jobs:
  provider-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: One-time retired-provider cleanup
        if: github.event_name == 'push' && github.event.head_commit.message == 'audit: remove retired provider runtime'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [
            Path('src/lib/tools.ts'), Path('src/lib/media-tools.ts'), Path('src/lib/agent007-extensions.ts'),
            Path('src/lib/agent007-meta.ts'), Path('src/lib/enhanced-tools.ts'), Path('src/lib/advanced-capabilities.ts'),
            Path('src/lib/optimization-tools-v2.ts'), Path('src/lib/max-improvements.ts'), Path('src/lib/self-fix-tools.ts'),
            Path('src/lib/business-infrastructure.ts'), Path('src/lib/developer-enhancements.ts'),
          ]
          for path in targets:
            text = path.read_text()
            original = text
            text = text.replace("import ZAI from 'z-ai-web-dev-sdk'\n", '')
            text = re.sub(r"async function getZai\(\) \{[\s\S]*?\n\}\n\n", '', text, count=1)
            text = re.sub(r"let _zai: ZAI \| null = null\nasync function getZai\(\): Promise<ZAI> \{[\s\S]*?\n\}\n\n", '', text, count=1)
            text = re.sub(r"const zai = await getZai\(\)\n(?:\s*)const c = await zai\.chat\.completions\.create\((\{[\s\S]*?\})\)\n", "const c = await (async () => {\n      const { runCanonicalLlm } = await import('./canonical-llm-router')\n      const result = await runCanonicalLlm({ messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }], taskType: 'analysis', maxTokens, temperature: 0.4 })\n      return { choices: [{ message: { content: result.content } }] }\n    })()\n", text, count=1)
            if text != original:
              path.write_text(text)
          PY
          bun install --lockfile-only
          bunx tsc -p tsconfig.ci.json --noEmit
          bun scripts/provider-control-plane-audit.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Remove the one-time migration workflow and restore this workflow to read-only CI.
          git rm -f .github/workflows/retire-zai-runtime.yml || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/provider-control-plane-ci.yml')
          text = p.read_text()
          marker = "      - name: One-time retired-provider cleanup\n"
          start = text.find(marker)
          if start != -1:
            end = text.find("      - name: Install dependencies\n", start)
            if end == -1:
              raise SystemExit('canonical Install dependencies step not found')
            head = text[:start]
            tail = text[end:]
            head = head.replace('permissions:\n  contents: write', 'permissions:\n  contents: read')
            p.write_text(head + tail)
          PY
          git add src/lib package.json bun.lock .github/workflows/provider-control-plane-ci.yml
          git commit -m 'chore: retire z.ai runtime dependency'
          git push origin main
      - name: Install dependencies
        if: github.event_name != 'push' || github.event.head_commit.message != 'audit: remove retired provider runtime'
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit
      - name: Provider control-plane integrity audit
        run: bun scripts/provider-control-plane-audit.ts
      - name: Provider governance unit and integration matrix
        run: bun test tests/provider-live-model-contract.test.ts tests/provider-live-probe-regression.test.ts src/lib/model-intelligence-runtime.test.ts tests/provider-control-plane.integration.test.ts tests/ceo-cognitive-lifecycle.test.ts
      - name: Repository hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"