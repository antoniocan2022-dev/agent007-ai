name: Provider Control Plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/provider-control-plane.ts'
      - 'src/lib/provider-runtime-v2.ts'
      - 'src/lib/provider-intelligence.ts'
      - 'src/lib/provider-intelligence-policy.ts'
      - 'src/lib/model-intelligence.ts'
      - 'src/lib/subagent-governance.ts'
      - 'src/lib/provider-capability-health.ts'
      - 'src/lib/provider-error-lifecycle.ts'
      - 'src/lib/ceo-cognitive-lifecycle.ts'
      - 'src/lib/agent.ts'
      - 'src/app/api/system/diagnose-providers/route.ts'
      - 'src/app/api/release-health/route.ts'
      - 'src/app/api/health/provider-canary/route.ts'
      - 'src/app/api/health/llm-providers/route.ts'
      - 'src/app/api/health/llm-test/route.ts'
      - 'tests/provider-control-plane.integration.test.ts'
      - 'tests/provider-live-probe-regression.test.ts'
      - 'tests/provider-live-model-contract.test.ts'
      - 'tests/ceo-cognitive-lifecycle.test.ts'
      - 'src/lib/model-intelligence-runtime.test.ts'
      - 'scripts/provider-control-plane-audit.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/provider-control-plane-ci.yml'

permissions:
  contents: write

jobs:
  provider-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: One-time retirement repair
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/retire_provider_runtime.mjs <<'JS'
          import fs from 'node:fs'
          import ts from 'typescript'

          const targets = [
            'src/lib/tools.ts', 'src/lib/media-tools.ts', 'src/lib/agent007-extensions.ts',
            'src/lib/agent007-meta.ts', 'src/lib/enhanced-tools.ts', 'src/lib/advanced-capabilities.ts',
            'src/lib/optimization-tools-v2.ts', 'src/lib/max-improvements.ts', 'src/lib/self-fix-tools.ts',
            'src/lib/business-infrastructure.ts', 'src/lib/developer-enhancements.ts',
          ]
          const legacyNeedle = /z-ai-web-dev-sdk|api\.z\.ai|ZAI\.create|ZAI\.createAsync|getZai\s*\(|zai\.chat/i
          const genericLLM = `async function llm(systemPrompt: string, userPrompt: string, maxTokens = 1500): Promise<string> {
            try {
              const { runCanonicalLlm } = await import('./canonical-llm-router')
              const result = await runCanonicalLlm({ messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }], taskType: 'analysis', maxTokens, temperature: 0.4 })
              return result.content ?? ''
            } catch (e) {
              return '(LLM unavailable)'
            }
          }`
          const webSearch = `export async function toolWebSearch(args: { query?: string; num?: number; recency_days?: number }, _ctx: ToolContext): Promise<ToolResult> {
            const query = (args?.query ?? '').toString().trim()
            if (!query) return badResult('Missing "query" argument for web_search')
            const cached = getCached('web_search', args)
            if (cached) return { ...cached, preview: '[cached] ' + cached.preview }
            const limit = Math.min(Math.max(args.num ?? 5, 1), 10)
            if (process.env.BRAVE_API_KEY) {
              try {
                const response = await fetch(\`https://api.search.brave.com/res/v1/web/search?q=${encodeURIComponent(query)}&count=${limit}\`, { signal: AbortSignal.timeout(8000), headers: { Accept: 'application/json', 'X-Subscription-Token': process.env.BRAVE_API_KEY } })
                if (response.ok) {
                  const data = await response.json().catch(() => ({}))
                  const results = (data?.web?.results ?? []).slice(0, limit)
                  if (results.length) {
                    const formatted = results.map((item, i) => \`${i + 1}. **${item.title ?? item.url}**\\n   URL: ${item.url}\\n   ${String(item.description ?? '').slice(0, 400)}\`).join('\\n\\n')
                    const out = okResult(results.slice(0, 3).map((item) => \`• ${item.title ?? item.url}\`).join('\\n') + ' (via Brave Search)', \`Web search results for "${query}" (via Brave Search):\\n\\n${formatted}\`)
                    setCached('web_search', args, out); return out
                  }
                }
              } catch (error) { console.warn('[web_search] Brave fallback failed') }
            }
            return badResult(\`web_search did not return results for "${query}". Configure BRAVE_API_KEY or use a dedicated search adapter.\`)
          }`

          function rewriteFile(path) {
            const source = fs.readFileSync(path, 'utf8')
            if (!legacyNeedle.test(source)) return false
            const file = ts.createSourceFile(path, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            const edits = []
            for (const statement of file.statements) {
              if (ts.isImportDeclaration(statement)) {
                const mod = statement.moduleSpecifier.getText(file).replace(/^['"]|['"]$/g, '')
                if (mod === 'z-ai-web-dev-sdk') edits.push({ start: statement.getFullStart(), end: statement.end, text: '' })
              }
              if (ts.isFunctionDeclaration(statement) && statement.name) {
                if (statement.name.text === 'getZai') edits.push({ start: statement.getFullStart(), end: statement.end, text: '' })
                if (statement.name.text === 'llm') edits.push({ start: statement.getFullStart(), end: statement.end, text: genericLLM })
                if (path === 'src/lib/tools.ts' && statement.name.text === 'toolWebSearch') edits.push({ start: statement.getFullStart(), end: statement.end, text: webSearch })
              }
            }
            const next = edits.sort((a,b) => b.start - a.start).reduce((text, e) => text.slice(0, e.start) + e.text + text.slice(e.end), source)
            if (legacyNeedle.test(next)) throw new Error(`Unsafe residual legacy provider runtime in ${path}`)
            fs.writeFileSync(path, next)
            return next !== source
          }

          let changed = false
          for (const path of targets) if (rewriteFile(path)) changed = true
          fs.writeFileSync('/tmp/provider-migration-needed', changed ? '1' : '0')
          JS
          bun /tmp/retire_provider_runtime.mjs
          if [ "$(cat /tmp/provider-migration-needed)" = "1" ]; then
            bun install --lockfile-only
            bunx tsc -p tsconfig.ci.json --noEmit
            bun scripts/provider-control-plane-audit.ts
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib package.json bun.lock
            git commit -m 'chore: retire z.ai runtime dependency'
            git push origin main
            exit 0
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit
      - name: Provider control-plane integrity audit
        run: bun scripts/provider-control-plane-audit.ts
      - name: Provider governance unit and integration matrix
        run: bun test tests/provider-live-model-contract.test.ts tests/provider-live-probe-regression.test.ts src/lib/model-intelligence-runtime.test.ts tests/provider-control-plane.integration.test.ts tests/ceo-cognitive-lifecycle.test.ts tests/provider-selection-contract.test.ts
      - name: Repository hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"