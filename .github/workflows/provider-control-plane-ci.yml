name: Provider Control Plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/provider-control-plane.ts'
      - 'src/lib/provider-runtime-v2.ts'
      - 'src/lib/provider-intelligence.ts'
      - 'src/lib/provider-intelligence-policy.ts'
      - 'src/lib/model-intelligence.ts'
      - 'src/lib/subagent-governance.ts'
      - 'src/lib/provider-capability-health.ts'
      - 'src/lib/provider-error-lifecycle.ts'
      - 'src/lib/ceo-cognitive-lifecycle.ts'
      - 'src/lib/agent.ts'
      - 'src/app/api/system/diagnose-providers/route.ts'
      - 'src/app/api/release-health/route.ts'
      - 'src/app/api/health/provider-canary/route.ts'
      - 'src/app/api/health/llm-providers/route.ts'
      - 'src/app/api/health/llm-test/route.ts'
      - 'tests/provider-control-plane.integration.test.ts'
      - 'tests/provider-live-probe-regression.test.ts'
      - 'tests/provider-live-model-contract.test.ts'
      - 'tests/ceo-cognitive-lifecycle.test.ts'
      - 'src/lib/model-intelligence-runtime.test.ts'
      - 'scripts/provider-control-plane-audit.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/provider-control-plane-ci.yml'

permissions:
  contents: write

jobs:
  provider-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Retire legacy provider runtime when detected
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGETS = [
              Path('src/lib/media-tools.ts'), Path('src/lib/agent007-extensions.ts'),
              Path('src/lib/agent007-meta.ts'), Path('src/lib/enhanced-tools.ts'), Path('src/lib/advanced-capabilities.ts'),
              Path('src/lib/optimization-tools-v2.ts'), Path('src/lib/max-improvements.ts'), Path('src/lib/self-fix-tools.ts'),
              Path('src/lib/business-infrastructure.ts'), Path('src/lib/developer-enhancements.ts'),
          ]
          LEGACY_RE = re.compile(r'z-ai-web-dev-sdk|api\\.z\\.ai|\\bZAI\\.(?:create|createAsync)\\b|\\bgetZai\\s*\\(|\\bzai\\.chat\\b')
          GENERIC_LLM = '''async function llm(systemPrompt: string, userPrompt: string, maxTokens = 1500): Promise<string> {
            try {
              const { runCanonicalLlm } = await import('./canonical-llm-router')
              const result = await runCanonicalLlm({
                messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
                taskType: 'analysis', maxTokens, temperature: 0.4,
              })
              return result.content ?? ''
            } catch (e: any) {
              return `(LLM unavailable: ${e?.message ?? String(e)})`
            }
          }'''
          TOOLS_SEARCH = r'''/* ----------------------------- Web search ----------------------------- */
          export async function toolWebSearch(
            args: { query?: string; num?: number; recency_days?: number },
            _ctx: ToolContext
          ): Promise<ToolResult> {
            const query = (args?.query ?? '').toString().trim()
            if (!query) return badResult('Missing "query" argument for web_search')
            const cached = getCached('web_search', args)
            if (cached) return { ...cached, preview: '[cached] ' + cached.preview }
            const limit = Math.min(Math.max(args.num ?? 5, 1), 10)

            if (process.env.BRAVE_API_KEY) {
              try {
                const response = await fetch(`https://api.search.brave.com/res/v1/web/search?q=${encodeURIComponent(query)}&count=${limit}`, {
                  signal: AbortSignal.timeout(8000),
                  headers: { Accept: 'application/json', 'X-Subscription-Token': process.env.BRAVE_API_KEY },
                })
                if (response.ok) {
                  const data = await response.json().catch(() => ({}))
                  const results: any[] = (data?.web?.results ?? []).map((item: any) => ({ name: item.title ?? item.url, url: item.url, snippet: String(item.description ?? '').slice(0, 400), date: item.age ?? item.published })).slice(0, limit)
                  if (results.length) {
                    const formatted = results.map((item, i) => `${i + 1}. **${item.name}**\n   URL: ${item.url}\n   ${item.snippet}${item.date ? `\n   Date: ${item.date}` : ''}`).join('\n\n')
                    const out = okResult(results.slice(0, 3).map((item) => `• ${item.name}`).join('\n') + ' (via Brave Search)', `Web search results for "${query}" (via Brave Search):\n\n${formatted}`)
                    setCached('web_search', args, out); return out
                  }
                }
              } catch (error: any) { console.warn('[web_search] Brave fallback failed:', error?.message?.slice(0, 120)) }
            }
            try {
              const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`, { signal: AbortSignal.timeout(10000), headers: { 'User-Agent': 'Agent007-AI/2.0' } })
              const data = await response.json().catch(() => ({})); const results: any[] = []
              if (data.AbstractText) results.push({ name: data.Heading || query, url: data.AbstractURL || `https://duckduckgo.com/?q=${encodeURIComponent(query)}`, snippet: String(data.AbstractText).slice(0, 400) })
              if (Array.isArray(data.RelatedTopics)) for (const topic of data.RelatedTopics.slice(0, 8)) { if (topic?.Text && topic?.FirstURL) results.push({ name: String(topic.Text).slice(0, 80), url: topic.FirstURL, snippet: String(topic.Text).slice(0, 400) }); if (results.length >= limit) break }
              if (results.length) {
                const formatted = results.slice(0, limit).map((item, i) => `${i + 1}. **${item.name}**\n   URL: ${item.url}\n   ${item.snippet}`).join('\n\n')
                const out = okResult(results.slice(0, 3).map((item) => `• ${item.name}`).join('\n') + ' (via DuckDuckGo)', `Web search results for "${query}" (via DuckDuckGo):\n\n${formatted}`)
                setCached('web_search', args, out); return out
              }
            } catch (error: any) { console.warn('[web_search] DuckDuckGo fallback failed:', error?.message?.slice(0, 120)) }
            try {
              const response = await fetch(`https://www.google.com/search?q=${encodeURIComponent(query)}&num=${limit}`, { signal: AbortSignal.timeout(10000), headers: { 'User-Agent': 'Mozilla/5.0 Agent007-AI/2.0', Accept: 'text/html' } })
              const html = await response.text().catch(() => '')
              const urls = [...html.matchAll(/<a href="\/url\?q=([^&"]+)/g)].map((match) => decodeURIComponent(match[1]))
              const titles = [...html.matchAll(/<h3[^>]*>([^<]+)<\/h3>/g)].map((match) => match[1])
              const results = urls.slice(0, Math.min(limit, titles.length)).map((url, i) => ({ name: titles[i], url, snippet: titles[i] }))
              if (results.length) {
                const formatted = results.map((item, i) => `${i + 1}. **${item.name}**\n   URL: ${item.url}`).join('\n\n')
                const out = okResult(results.slice(0, 3).map((item) => `• ${item.name}`).join('\n') + ' (via Google)', `Web search results for "${query}" (via Google):\n\n${formatted}`)
                setCached('web_search', args, out); return out
              }
            } catch (error: any) { console.warn('[web_search] Google fallback failed:', error?.message?.slice(0, 120)) }
            return badResult(`web_search exhausted Brave, DuckDuckGo, and Google for "${query}". Use http_fetch or page_reader with a specific URL.`)
          }
          '''

          def rewrite_tools(path: Path, text: str) -> str:
              if path.name != 'tools.ts': return text
              text = text.replace("import ZAI from 'z-ai-web-dev-sdk'\n", '')
              text = re.sub(r"let _zai: ZAI \\| null = null\nasync function getZai\\(\\): Promise<ZAI> \\{[\\s\\S]*?^\\}\s*\n", '', text, count=1, flags=re.M)
              start = text.find('/* ----------------------------- Web search ----------------------------- */')
              end = text.find('/* ----------------------------- Page reader ---------------------------- */')
              if start >= 0 and end > start: text = text[:start] + TOOLS_SEARCH + text[end:]
              text = re.sub(r"const zai = await getZai\\(\\)\n", '', text)
              text = re.sub(r"await zai\\.web\\.search\\([^;]+;?", "return badResult('Legacy provider web search path removed. Configure BRAVE_API_KEY or use the search adapters.')", text, count=1, flags=re.S)
              return text

          changed = False
          # tools.ts is handled separately because its legacy integration was web search, not llm().
          tools = Path('src/lib/tools.ts')
          tools_original = tools.read_text()
          tools_text = rewrite_tools(tools, tools_original)
          if tools_text != tools_original: tools.write_text(tools_text); changed = True

          for path in TARGETS:
              text = path.read_text(); original = text
              if not LEGACY_RE.search(text): continue
              text = text.replace("import ZAI from 'z-ai-web-dev-sdk'\n", '')
              text = re.sub(r"async function getZai\\(\\)\\s*\\{[\\s\\S]*?^\\}\\s*\n", '', text, count=1, flags=re.M)
              if LEGACY_RE.search(text) and 'async function llm(' in text:
                  text = re.sub(r"(?ms)^async function llm\\([^\\n]*\\n.*?^}\\s*$", GENERIC_LLM, text, count=1)
              text = re.sub(r"const ZAI = \(await import\('z-ai-web-dev-sdk'\)\)\.default\\s*;?\n", '', text)
              if LEGACY_RE.search(text): raise SystemExit(f'Unsafe residual legacy provider path in {path}')
              if text != original: path.write_text(text); changed = True

          if changed:
              Path('.provider-migration-needed').write_text('1')
          else:
              Path('.provider-migration-needed').write_text('0')
          PY

          if [ "$(cat .provider-migration-needed)" = "1" ]; then
            bun install --lockfile-only
            bunx tsc -p tsconfig.ci.json --noEmit
            bun scripts/provider-control-plane-audit.ts
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -f .github/workflows/retire-zai-runtime.yml 2>/dev/null || true
            git add src/lib package.json bun.lock .github/workflows/provider-control-plane-ci.yml
            git commit -m 'chore: retire z.ai runtime dependency'
            git push origin main
            exit 0
          fi
          rm -f .provider-migration-needed

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit
      - name: Provider control-plane integrity audit
        run: bun scripts/provider-control-plane-audit.ts
      - name: Provider governance unit and integration matrix
        run: bun test tests/provider-live-model-contract.test.ts tests/provider-live-probe-regression.test.ts src/lib/model-intelligence-runtime.test.ts tests/provider-control-plane.integration.test.ts tests/ceo-cognitive-lifecycle.test.ts
      - name: Repository hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"