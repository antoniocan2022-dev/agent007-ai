name: CEO Long Conversation Certification

# Certification replay is intentionally committed on main so the exact production candidate is tested.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  long-conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Typecheck runtime source
        run: bunx tsc -p tsconfig.ci.json --noEmit
      - name: Long conversation certification
        run: |
          set -euo pipefail
          for test_file in \
            tests/ceo-conversation-long-certification.test.ts \
            tests/ceo-cognitive-conversation.test.ts \
            tests/ceo-conversation-runtime-regressions.test.ts \
            tests/ceo-long-conversation-certification.test.ts \
            tests/ceo-personality-and-resilience.test.ts \
            tests/ceo-self-reflection.test.ts \
            tests/architecture-integrity-contract.test.ts; do
            echo "Running isolated test process: $test_file"
            bun test --max-concurrency=1 "$test_file"
          done
      - name: P0-P5 CEO runtime integrity certification
        run: bun test --max-concurrency=1 tests/ceo-p0-p5-integrity.test.ts
      - name: P5 continuous-loop certification
        run: bun test --max-concurrency=1 tests/continuous-loop-integrity.test.ts
