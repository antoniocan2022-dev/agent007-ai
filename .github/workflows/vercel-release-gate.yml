name: Vercel Controlled Release Gate

on:
  workflow_dispatch:
    inputs:
      confirm_main:
        description: "Confirm this release must originate from main"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: read

env:
  VERCEL_API_BASE: https://api.vercel.com
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_PRODUCTION_URL: https://agent007-ai.vercel.app

jobs:
  candidate:
    name: Candidate deployment + live-state verification
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      candidate_url: ${{ steps.deploy.outputs.url }}
      candidate_id: ${{ steps.deploy.outputs.id }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Assert source is exact main commit
        id: source
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Assert controlled Vercel configuration
        run: |
          set -euo pipefail
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = "false"
          test "$(jq -r 'has("crons") and ((.crons // []) | length > 0)' vercel.json)" = "false"
          test -f src/app/api/release-health/route.ts

      - name: Assert Vercel release credentials are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_ORG_ID}" || { echo "VERCEL_ORG_ID is missing" >&2; exit 1; }
          test -n "${VERCEL_PROJECT_ID}" || { echo "VERCEL_PROJECT_ID is missing" >&2; exit 1; }
          test -n "${VERCEL_TOKEN}" || { echo "VERCEL_TOKEN is missing" >&2; exit 1; }

      - name: Capture Vercel live state BEFORE deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            > release-evidence/vercel-project-before.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=20" \
            > release-evidence/vercel-deployments-before.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' \
            release-evidence/vercel-project-before.json > release-evidence/vercel-before-summary.json
          cat release-evidence/vercel-before-summary.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Build gate
        run: bun run build

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Pull Vercel preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token "${VERCEL_TOKEN}"

      - name: Validate Preview runtime configuration
        run: |
          set -euo pipefail
          env_file=".vercel/.env.preview.local"
          test -f "$env_file"

          # Parse dotenv values without printing secrets. Vercel may quote values
          # with either single or double quotes; strip only a matching outer pair.
          get_env() {
            local key="$1"
            local raw
            raw="$(sed -n "s/^${key}=//p" "$env_file" | head -n 1)"
            if [ -z "$raw" ]; then
              printf '%s' ''
              return 0
            fi
            case "$raw" in
              \"*\") raw="${raw#\"}"; raw="${raw%\"}" ;;
              \'*\') raw="${raw#\'}"; raw="${raw%\'}" ;;
            esac
            printf '%s' "$raw"
          }

          database_url="$(get_env DATABASE_URL)"
          nextauth_secret="$(get_env NEXTAUTH_SECRET)"

          case "$database_url" in
            postgres://*|postgresql://*) ;;
            *)
              echo "Preview DATABASE_URL is missing or is not PostgreSQL." >&2
              echo "The Vercel Preview env file is present, but its DATABASE_URL value could not be parsed as a PostgreSQL URL." >&2
              exit 1
              ;;
          esac

          test -n "$nextauth_secret" || { echo "Preview NEXTAUTH_SECRET is missing." >&2; exit 1; }
          echo "Preview runtime configuration contains a PostgreSQL DATABASE_URL and NEXTAUTH_SECRET."

      - name: Build Vercel candidate artifact
        run: vercel build --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?connect_timeout=1
          NEXTAUTH_SECRET: agent007-build-only-secret-do-not-use-at-runtime
          NEXTAUTH_URL: https://agent007-ai.vercel.app

      - name: Deploy candidate preview
        id: deploy
        run: |
          set -euo pipefail
          output="$(vercel deploy --prebuilt --token "${VERCEL_TOKEN}" --env RELEASE_COMMIT_SHA="${GITHUB_SHA}")"
          echo "$output"
          raw_url="$(printf '%s\n' "$output" | tail -n 1 | tr -d '\r')"
          case "$raw_url" in
            https://*|http://*) url="$raw_url" ;;
            *) url="https://$raw_url" ;;
          esac
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          id="$(printf '%s\n' "$output" | grep -Eo 'dpl_[A-Za-z0-9]+' | tail -n 1 || true)"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Wait for candidate deployment readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          id="${{ steps.deploy.outputs.id }}"
          for attempt in $(seq 1 30); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${VERCEL_API_BASE}/v13/deployments/${id}?teamId=${VERCEL_ORG_ID}")"
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$response")"
            echo "candidate attempt=${attempt} state=${state}"
            case "$state" in
              READY) printf '%s' "$response" > release-evidence/candidate-deployment.json; exit 0 ;;
              ERROR|CANCELED|DELETED) printf '%s' "$response" > release-evidence/candidate-deployment.json; exit 1 ;;
            esac
            sleep 10
          done
          echo "Candidate deployment did not become READY within the verification window." >&2
          exit 1

      - name: Assert candidate artifact identity
        run: |
          set -euo pipefail
          test "$(jq -r '.id' release-evidence/candidate-deployment.json)" = "${{ steps.deploy.outputs.id }}"
          test "$(jq -r '.url' release-evidence/candidate-deployment.json)" != "null"
          git_sha="$(jq -r '.meta.githubCommitSha // ""' release-evidence/candidate-deployment.json)"
          test -n "$git_sha"
          test "$git_sha" = "${GITHUB_SHA}"

      - name: Candidate release-health cold-start test
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Cache-Control: no-cache' \
            --max-time 30 \
            "${CANDIDATE_URL}/api/release-health" \
            > release-evidence/release-health-cold.json
          jq --arg sha "${GITHUB_SHA}" 'if .releaseCommit == $sha then . else error("releaseCommit mismatch") end' \
            release-evidence/release-health-cold.json > /dev/null

      - name: Candidate release-health warm test
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Cache-Control: no-cache' \
            --max-time 30 \
            "${CANDIDATE_URL}/api/release-health" \
            > release-evidence/release-health-warm.json
          jq --arg sha "${GITHUB_SHA}" 'if .releaseCommit == $sha then . else error("releaseCommit mismatch") end' \
            release-evidence/release-health-warm.json > /dev/null

      - name: Candidate runtime error check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          id="${{ steps.deploy.outputs.id }}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v3/deployments/${id}/events?teamId=${VERCEL_ORG_ID}" \
            > release-evidence/candidate-events.ndjson
          if grep -Eqi '"level"[[:space:]]*:[[:space:]]*"error"|"type"[[:space:]]*:[[:space:]]*"error"|level=error' release-evidence/candidate-events.ndjson; then
            echo "Candidate runtime/build events contain an error." >&2
            exit 1
          fi

      - name: Release evidence bundle
        if: always()
        run: |
          set -euo pipefail
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "candidate_id=${{ steps.deploy.outputs.id || '' }}"
            echo "candidate_url=${{ steps.deploy.outputs.url || '' }}"
          } > release-evidence/release-summary.txt

      - name: Upload candidate release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent007-vercel-candidate-${{ github.run_id }}
          path: release-evidence

  production:
    name: Production promotion (manual approval)
    needs: candidate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Assert source is still exact main commit
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_SHA}" = "${{ needs.candidate.outputs.source_sha }}"

      - name: Capture Vercel live state BEFORE promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            > release-evidence/vercel-project-before-promotion.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=20" \
            > release-evidence/vercel-deployments-before-promotion.json

      - name: Promote exact candidate artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          candidate_id="${{ needs.candidate.outputs.candidate_id }}"
          test -n "$candidate_id"
          vercel promote "$candidate_id" --token "${VERCEL_TOKEN}"

      - name: Verify Production artifact identity and health
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v13/deployments/${{ needs.candidate.outputs.candidate_id }}?teamId=${VERCEL_ORG_ID}" \
            > release-evidence/production-deployment.json
          jq --arg sha "${GITHUB_SHA}" 'if (.meta.githubCommitSha // "") == $sha then . else error("Production Git SHA mismatch") end' \
            release-evidence/production-deployment.json > /dev/null
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            "${VERCEL_PRODUCTION_URL}/api/release-health" \
            > release-evidence/production-release-health.json
          jq --arg sha "${GITHUB_SHA}" 'if .releaseCommit == $sha then . else error("Production releaseCommit mismatch") end' \
            release-evidence/production-release-health.json > /dev/null

      - name: Capture Vercel live state AFTER promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            > release-evidence/vercel-project-after-promotion.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=20" \
            > release-evidence/vercel-deployments-after-promotion.json

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent007-vercel-production-${{ github.run_id }}
          path: release-evidence
