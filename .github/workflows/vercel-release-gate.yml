name: Vercel Controlled Release Gate

on:
  workflow_dispatch:
    inputs:
      confirm_main:
        description: "Confirm this release must originate from main"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: vercel-production-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate deployment + cold-start verification
    if: github.ref == 'refs/heads/main' && inputs.confirm_main == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.id }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assert source is main
        run: |
          test "$(git branch --show-current)" = "main" || test "$(git symbolic-ref --short HEAD 2>/dev/null || true)" = "main"
          test -n "${GITHUB_SHA}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Build gate
        run: bun run build

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel candidate artifact
        run: vercel build --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy candidate preview
        id: deploy
        run: |
          output="$(vercel deploy --prebuilt --token "${VERCEL_TOKEN}")"
          echo "$output"
          url="$(printf '%s\n' "$output" | tail -n 1 | tr -d '\r')"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          id="$(printf '%s\n' "$output" | grep -Eo 'dpl_[A-Za-z0-9]+' | tail -n 1 || true)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: First-request smoke test
        id: cold
        run: |
          url="https://${{ steps.deploy.outputs.url }}"
          start=$(date +%s%3N)
          code=$(curl -L -sS -o /tmp/candidate-response -w '%{http_code}' --max-time 45 "$url/")
          end=$(date +%s%3N)
          latency=$((end-start))
          echo "HTTP=$code latency_ms=$latency"
          test "$code" -ge 200 && test "$code" -lt 500
          echo "latency_ms=$latency" >> "$GITHUB_OUTPUT"

      - name: Warm-request comparison
        id: warm
        run: |
          url="https://${{ steps.deploy.outputs.url }}"
          start=$(date +%s%3N)
          code=$(curl -L -sS -o /tmp/candidate-response-warm -w '%{http_code}' --max-time 30 "$url/")
          end=$(date +%s%3N)
          latency=$((end-start))
          echo "HTTP=$code latency_ms=$latency"
          test "$code" -ge 200 && test "$code" -lt 500
          echo "latency_ms=$latency" >> "$GITHUB_OUTPUT"

      - name: Release evidence
        run: |
          cat <<EOF
          candidate_url=${{ steps.deploy.outputs.url }}
          commit=${GITHUB_SHA}
          cold_latency_ms=${{ steps.cold.outputs.latency_ms }}
          warm_latency_ms=${{ steps.warm.outputs.latency_ms }}
          cron_policy=daily-only
          source=main
          EOF

  production:
    name: Production promotion (manual approval)
    needs: candidate
    if: needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 15
    steps:
      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Promote exact candidate artifact
        run: vercel promote "${CANDIDATE_URL}" --yes --token "${VERCEL_TOKEN}"
        env:
          CANDIDATE_URL: ${{ needs.candidate.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Production smoke test
        run: |
          url="https://${{ needs.candidate.outputs.deployment_url }}"
          code=$(curl -L -sS -o /tmp/production-response -w '%{http_code}' --max-time 45 "$url/")
          echo "Promoted artifact smoke HTTP=$code"
          test "$code" -ge 200 && test "$code" -lt 500
