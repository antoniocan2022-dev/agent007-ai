name: Vercel Controlled Release Gate

on:
  workflow_dispatch:
    inputs:
      confirm_main:
        description: "Confirm this release must originate from main"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_PRODUCTION_URL: https://agent007-ai.vercel.app
  VERCEL_API_BASE: https://api.vercel.com

concurrency:
  group: vercel-production-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate deployment + live-state verification
    if: github.ref == 'refs/heads/main' && inputs.confirm_main == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.id }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assert source is exact main commit
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Assert controlled Vercel configuration
        run: |
          set -euo pipefail
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = "false"
          test "$(jq -r 'has("crons") and ((.crons // []) | length > 0)' vercel.json)" = "false"
          test -f src/app/api/release-health/route.ts

      - name: Capture Vercel live state BEFORE deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v9/projects/${VERCEL_PROJECT_ID}" \
            > release-evidence/vercel-project-before.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v13/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=20" \
            > release-evidence/vercel-deployments-before.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' \
            release-evidence/vercel-project-before.json > release-evidence/vercel-before-summary.json
          cat release-evidence/vercel-before-summary.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Build gate
        run: bun run build

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel candidate artifact
        run: vercel build --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy candidate preview
        id: deploy
        run: |
          set -euo pipefail
          output="$(vercel deploy --prebuilt --token "${VERCEL_TOKEN}" --env RELEASE_COMMIT_SHA="${GITHUB_SHA}")"
          echo "$output"
          raw_url="$(printf '%s\n' "$output" | tail -n 1 | tr -d '\r')"
          case "$raw_url" in
            https://*|http://*) url="$raw_url" ;;
            *) url="https://$raw_url" ;;
          esac
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          id="$(printf '%s\n' "$output" | grep -Eo 'dpl_[A-Za-z0-9]+' | tail -n 1 || true)"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Wait for candidate deployment readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          id="${{ steps.deploy.outputs.id }}"
          for attempt in $(seq 1 30); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${VERCEL_API_BASE}/v13/deployments/${id}?teamId=${VERCEL_ORG_ID}")"
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$response")"
            echo "candidate attempt=${attempt} state=${state}"
            case "$state" in
              READY) printf '%s' "$response" > release-evidence/candidate-deployment.json; exit 0 ;;
              ERROR|CANCELED|DELETED) printf '%s' "$response" > release-evidence/candidate-deployment.json; exit 1 ;;
            esac
            sleep 10
          done
          echo "Candidate deployment did not become READY within the verification window." >&2
          exit 1

      - name: Assert candidate artifact identity
        run: |
          set -euo pipefail
          test "$(jq -r '.id' release-evidence/candidate-deployment.json)" = "${{ steps.deploy.outputs.id }}"
          test "$(jq -r '.url' release-evidence/candidate-deployment.json)" != "null"
          git_sha="$(jq -r '.meta.githubCommitSha // ""' release-evidence/candidate-deployment.json)"
          test -z "$git_sha" || test "$git_sha" = "${GITHUB_SHA}"

      - name: Candidate release-health cold-start test
        id: cold
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}/api/release-health"
          start=$(date +%s%3N)
          code=$(curl -L -sS -o /tmp/candidate-response -w '%{http_code}' --max-time 45 "$url")
          end=$(date +%s%3N)
          latency=$((end-start))
          echo "HTTP=$code latency_ms=$latency"
          test "$code" = "200"
          jq -e --arg sha "${GITHUB_SHA}" '.ok == true and .releaseGate == true and .releaseCommit == $sha' /tmp/candidate-response
          echo "latency_ms=$latency" >> "$GITHUB_OUTPUT"

      - name: Candidate release-health warm test
        id: warm
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}/api/release-health"
          start=$(date +%s%3N)
          code=$(curl -L -sS -o /tmp/candidate-response-warm -w '%{http_code}' --max-time 30 "$url")
          end=$(date +%s%3N)
          latency=$((end-start))
          echo "HTTP=$code latency_ms=$latency"
          test "$code" = "200"
          jq -e --arg sha "${GITHUB_SHA}" '.ok == true and .releaseGate == true and .releaseCommit == $sha' /tmp/candidate-response-warm
          echo "latency_ms=$latency" >> "$GITHUB_OUTPUT"

      - name: Candidate runtime error check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v3/deployments/${{ steps.deploy.outputs.id }}/events?teamId=${VERCEL_ORG_ID}" \
            > release-evidence/candidate-events.ndjson
          error_count="$(jq -s '[.[] | select(.level? == "error" or .type? == "error" or .level? == "fatal")] | length' release-evidence/candidate-events.ndjson)"
          test "$error_count" = "0"

      - name: Release evidence bundle
        run: |
          set -euo pipefail
          cat <<EOF > release-evidence/release-evidence.txt
          source=main
          main_commit=${GITHUB_SHA}
          candidate_url=${{ steps.deploy.outputs.url }}
          deployment_id=${{ steps.deploy.outputs.id }}
          cold_latency_ms=${{ steps.cold.outputs.latency_ms }}
          warm_latency_ms=${{ steps.warm.outputs.latency_ms }}
          cron_policy=disabled-until-authorized
          git_auto_deployment=disabled
          EOF
          cat release-evidence/release-evidence.txt

      - name: Upload candidate release evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent007-vercel-candidate-${{ github.sha }}
          path: release-evidence/
          retention-days: 30

  production:
    name: Production promotion (manual approval)
    needs: candidate
    if: needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 25
    steps:
      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Capture Vercel live state BEFORE promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence-production
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v9/projects/${VERCEL_PROJECT_ID}" \
            > release-evidence-production/vercel-project-before-promote.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v13/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=10" \
            > release-evidence-production/vercel-production-before-promote.json
          previous_id="$(jq -r '.deployments[] | select((.readyState == "READY" or .state == "READY") and .id != "${{ needs.candidate.outputs.deployment_id }}") | .id' release-evidence-production/vercel-production-before-promote.json | head -n 1)"
          echo "previous_production_deployment=${previous_id:-none}" | tee release-evidence-production/rollback-reference.txt

      - name: Promote exact candidate artifact
        run: vercel promote "${CANDIDATE_URL}" --yes --token "${VERCEL_TOKEN}"
        env:
          CANDIDATE_URL: ${{ needs.candidate.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Wait for Production readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${VERCEL_API_BASE}/v13/deployments/${{ needs.candidate.outputs.deployment_id }}?teamId=${VERCEL_ORG_ID}")"
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$response")"
            echo "production promotion attempt=${attempt} state=${state}"
            case "$state" in
              READY) printf '%s' "$response" > release-evidence-production/promoted-deployment.json; exit 0 ;;
              ERROR|CANCELED|DELETED) printf '%s' "$response" > release-evidence-production/promoted-deployment.json; exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Production health and exact-artifact test
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          code=$(curl -L -sS -o /tmp/production-response -w '%{http_code}' --max-time 45 "${VERCEL_PRODUCTION_URL}/api/release-health")
          end=$(date +%s%3N)
          latency=$((end-start))
          echo "HTTP=$code latency_ms=$latency"
          test "$code" = "200"
          jq -e --arg sha "${{ needs.candidate.outputs.source_sha }}" '.ok == true and .releaseGate == true and .releaseCommit == $sha' /tmp/production-response

      - name: Capture Vercel live state AFTER promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v9/projects/${VERCEL_PROJECT_ID}" \
            > release-evidence-production/vercel-project-after.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v13/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=10" \
            > release-evidence-production/vercel-production-after.json
          latest_id="$(jq -r '.deployments[0].id // ""' release-evidence-production/vercel-production-after.json)"
          test "$latest_id" = "${{ needs.candidate.outputs.deployment_id }}"
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' release-evidence-production/vercel-project-after.json

      - name: Production runtime error check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v3/deployments/${{ needs.candidate.outputs.deployment_id }}/events?teamId=${VERCEL_ORG_ID}" \
            > release-evidence-production/production-events.ndjson
          error_count="$(jq -s '[.[] | select(.level? == "error" or .type? == "error" or .level? == "fatal")] | length' release-evidence-production/production-events.ndjson)"
          test "$error_count" = "0"

      - name: Upload production release evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent007-vercel-production-${{ needs.candidate.outputs.deployment_id }}
          path: release-evidence-production/
          retention-days: 30
