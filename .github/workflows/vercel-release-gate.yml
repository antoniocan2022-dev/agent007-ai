name: Vercel Controlled Release Gate

on:
  workflow_dispatch:
    inputs:
      confirm_main:
        description: Confirm this release must originate from main
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - release/agent007-production-release.trigger

permissions:
  contents: read

concurrency:
  group: agent007-controlled-production-release
  cancel-in-progress: true

env:
  VERCEL_API_BASE: https://api.vercel.com
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  release:
    name: Authorized first Production release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify source and deployment controls
        env:
          CONFIRM_MAIN: ${{ inputs.confirm_main || 'true' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRM_MAIN" = true
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          test "$(jq -r 'has("crons") and ((.crons // []) | length > 0)' vercel.json)" = false

      - name: Assert Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Capture Vercel state before release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/vercel-before.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' /tmp/vercel-before.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install exact repository dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Deploy exact checked-out main commit to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg name "agent007-ai" \
            --arg org "antoniocan2022-dev" \
            --arg repo "agent007-ai" \
            --arg ref "main" \
            --arg sha "$GITHUB_SHA" \
            '{name:$name,target:"production",withLatestCommit:false,gitSource:{type:"github",org:$org,repo:$repo,ref:$ref},gitMetadata:{remoteUrl:"https://github.com/antoniocan2022-dev/agent007-ai",commitRef:$ref,commitSha:$sha,ci:"true",ciType:"github-actions"}}')"
          http_code="$(curl --silent --show-error --max-time 30 \
            -o /tmp/vercel-create.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "$VERCEL_API_BASE/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=true" \
            --data "$payload")"
          cat /tmp/vercel-create.json
          test "$http_code" -ge 200
          test "$http_code" -lt 300
          id="$(jq -r '.id // empty' /tmp/vercel-create.json)"
          test -n "$id"
          echo "deploymentId=$id"
          echo "PRODUCTION_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"

      - name: Resolve Production deployment and wait for READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          id="$PRODUCTION_DEPLOYMENT_ID"
          for attempt in $(seq 1 30); do
            deployment="$(curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$VERCEL_API_BASE/v13/deployments/$id?teamId=$VERCEL_ORG_ID")"
            state="$(jq -r '.readyState // "UNKNOWN"' <<<"$deployment")"
            target="$(jq -r '.target // "null"' <<<"$deployment")"
            sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$deployment")"
            url="$(jq -r '.url // empty' <<<"$deployment")"
            echo "attempt=$attempt state=$state target=$target sha=$sha url=$url"
            if [ "$state" = READY ] && [ "$target" = production ]; then
              test "$sha" = "$GITHUB_SHA"
              test -n "$url"
              echo "PRODUCTION_URL=https://$url" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$state" = ERROR ] || [ "$state" = CANCELED ]; then
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify production health through canonical production domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            response="$(curl --silent --show-error --max-time 20 \
              --write-out '\nHTTP_STATUS=%{http_code}' \
              "https://agent007-ai.vercel.app/api/release-health")"
            echo "$response"
            body="${response%HTTP_STATUS=*}"
            status="${response##*HTTP_STATUS=}"
            if [ "$status" = 200 ] && printf '%s' "$body" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Capture Vercel state after release
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          curl --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/vercel-after.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' /tmp/vercel-after.json
