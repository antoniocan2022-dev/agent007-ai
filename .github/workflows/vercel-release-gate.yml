name: Vercel Controlled Two-Stage Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_main:
        description: Confirm this release must originate from main
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent007-controlled-two-stage-release-v6
  cancel-in-progress: false

env:
  VERCEL_API_BASE: https://api.vercel.com
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59.1.3

jobs:
  candidate:
    name: Stage 1 — Build and verify immutable Production candidate
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'authorize final Venture OS production release') }}
    runs-on: ubuntu-latest
    outputs:
      staged_url: ${{ steps.deploy.outputs.staged_url }}
      staged_id: ${{ steps.resolve.outputs.staged_id }}
      release_sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify source and release controls
        id: source
        env:
          CONFIRM_MAIN: ${{ inputs.confirm_main || 'true' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRM_MAIN" = true
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          test "$(jq -r 'has("crons") and ((.crons // []) | length > 0)' vercel.json)" = false
          echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Assert Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Link runner to exact Vercel project
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install exact repository dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Venture OS heartbeat contract gate
        env:
          DATABASE_URL: ''
        run: |
          set -euo pipefail
          bun test tests/venture-os-v2.test.ts tests/architecture-control-plane.test.ts tests/venture-os-integration.test.ts tests/db-runtime-policy.test.ts tests/owner-bootstrap-security.test.ts

      - name: Create staged Production artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GIT_MESSAGE: ${{ github.event.head_commit.message || 'Controlled two-stage release' }}
          GIT_ACTOR: ${{ github.actor }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          short_msg="$(printf '%s\n' "$GIT_MESSAGE" | head -n1)"
          set +e
          output="$(bunx vercel@$VERCEL_CLI_VERSION deploy \
            --prod \
            --skip-domain \
            --yes \
            --token "$VERCEL_TOKEN" \
            --build-env AGENT007_RELEASE_SCHEMA_RECONCILE=1 \
            -m githubCommitAuthorName=antoniocan2022-dev \
            -m githubCommitMessage="$short_msg" \
            -m githubCommitOrg=antoniocan2022-dev \
            -m githubCommitRef=main \
            -m githubCommitRepo=agent007-ai \
            -m githubCommitSha="$GITHUB_SHA" \
            -m githubDeployment=1 \
            -m githubOrg=antoniocan2022-dev \
            -m githubRepo=agent007-ai \
            -m githubCommitAuthorLogin="$GIT_ACTOR" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          staged_url="$(printf '%s\n' "$output" | grep -Eo 'https://[a-zA-Z0-9._-]+\.vercel\.app' | tail -1)"
          test -n "$staged_url"
          echo "staged_url=$staged_url" >> "$GITHUB_OUTPUT"

      - name: Resolve staged artifact and wait for READY
        id: resolve
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_URL: ${{ steps.deploy.outputs.staged_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$VERCEL_API_BASE/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=50" > /tmp/vercel-deployments.json
            deployment="$(jq -c --arg url "${STAGED_URL#https://}" '[.deployments[] | select(.url == $url)][0] // empty' /tmp/vercel-deployments.json)"
            if [ -z "$deployment" ]; then sleep 5; continue; fi
            id="$(jq -r '.uid // .id' <<<"$deployment")"
            state="$(jq -r '.state' <<<"$deployment")"
            sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$deployment")"
            ref="$(jq -r '.meta.githubCommitRef // empty' <<<"$deployment")"
            target="$(jq -r '.target // "null"' <<<"$deployment")"
            echo "attempt=$attempt id=$id state=$state target=$target ref=$ref sha=$sha"
            if [ "$state" = READY ]; then
              test "$sha" = "$GITHUB_SHA"
              test "$ref" = main
              test "$target" = production
              echo "staged_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = ERROR ] || [ "$state" = CANCELED ]; then exit 1; fi
            sleep 10
          done
          exit 1

      - name: Verify staged artifact health
        env:
          STAGED_URL: ${{ steps.deploy.outputs.staged_url }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --max-time 20 "https://${STAGED_URL#https://}/api/release-health")"
          echo "$response"
          test "$(jq -r '.ok' <<<"$response")" = true
          test "$(jq -r '.environment' <<<"$response")" = production
          test "$(jq -r '.releaseCommit' <<<"$response")" = "$GITHUB_SHA"

  promote:
    name: Stage 2 — Promote exact verified artifact to Production
    needs: candidate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Verify promotion inputs
        run: |
          set -euo pipefail
          test -n "${{ needs.candidate.outputs.staged_url }}"
          test -n "${{ needs.candidate.outputs.staged_id }}"
          test "${{ needs.candidate.outputs.release_sha }}" = "$GITHUB_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Promote exact staged artifact without rebuild
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_URL: ${{ needs.candidate.outputs.staged_url }}
        timeout-minutes: 6
        run: bunx vercel@$VERCEL_CLI_VERSION promote "$STAGED_URL" --yes --timeout 5m --token "$VERCEL_TOKEN"

      - name: Verify canonical Production identity and health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --max-time 20 --write-out '\nHTTP_STATUS=%{http_code}' "https://agent007-ai.vercel.app/api/release-health")"
            body="${response%HTTP_STATUS=*}"
            status="${response##*HTTP_STATUS=}"
            echo "$response"
            if [ "$status" = 200 ] && printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q "\"releaseCommit\":\"$GITHUB_SHA\""; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verify Production has no immediate error surface
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          log_output="$(bunx vercel@$VERCEL_CLI_VERSION logs --environment production --level error --since 5m --limit 50 --token "$VERCEL_TOKEN" 2>&1 || true)"
          echo "$log_output"
          if printf '%s' "$log_output" | grep -Eiq '(error|fatal)'; then exit 1; fi

      - name: Capture final production deployment identity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "$VERCEL_API_BASE/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=50" > /tmp/vercel-after.json
          jq -r '[.deployments[] | select(.state == "READY")][0] | {id,url,created,target,sha:(.meta.githubCommitSha // null)}' /tmp/vercel-after.json

      - name: Write release evidence
        run: |
          cat <<EOF
          Two-stage release completed.
          Release SHA: ${{ needs.candidate.outputs.release_sha }}
          Candidate: ${{ needs.candidate.outputs.staged_id }}
          Candidate URL: ${{ needs.candidate.outputs.staged_url }}
          Promotion: exact staged artifact promoted without rebuild.
          Git auto-deployment: disabled.
          Cron: disabled.
          EOF
