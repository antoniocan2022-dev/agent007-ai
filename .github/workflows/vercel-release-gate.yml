name: Vercel Controlled Release Gate

on:
  workflow_dispatch:
    inputs:
      confirm_main:
        description: Confirm this release must originate from main
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  VERCEL_API_BASE: https://api.vercel.com
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_PRODUCTION_URL: https://agent007-ai.vercel.app

jobs:
  candidate:
    name: Candidate deployment + live-state verification
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      candidate_id: ${{ steps.deploy.outputs.id }}
      candidate_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Assert main and controlled configuration
        env:
          CONFIRM_MAIN: ${{ inputs.confirm_main }}
        run: |
          set -euo pipefail
          test "$CONFIRM_MAIN" = true
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          test "$(jq -r 'has("crons") and ((.crons // []) | length > 0)' vercel.json)" = false
          test -f src/app/api/release-health/route.ts

      - name: Assert Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Capture Vercel live state BEFORE deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > release-evidence/vercel-project-before.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20" \
            > release-evidence/vercel-deployments-before.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' \
            release-evidence/vercel-project-before.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Build gate
        run: bun run build

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Pull exact Vercel Preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Validate Preview runtime configuration
        run: |
          set -euo pipefail
          test -f .vercel/.env.preview.local
          python3 .github/workflows/validate-preview-env.py .vercel/.env.preview.local

      - name: Build Vercel candidate artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?connect_timeout=1
          NEXTAUTH_SECRET: agent007-build-only-secret-do-not-use-at-runtime
          NEXTAUTH_URL: https://agent007-ai.vercel.app
        run: vercel build --token "$VERCEL_TOKEN"

      - name: Deploy candidate Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          output="$(vercel deploy --prebuilt --token "$VERCEL_TOKEN" --env RELEASE_COMMIT_SHA="$GITHUB_SHA")"
          printf '%s\n' "$output"
          raw_url="$(printf '%s\n' "$output" | tail -n 1 | tr -d '\r')"
          case "$raw_url" in
            http://*|https://*) url="$raw_url" ;;
            *) url="https://$raw_url" ;;
          esac
          id="$(printf '%s\n' "$output" | grep -Eo 'dpl_[A-Za-z0-9]+' | tail -n 1 || true)"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for candidate READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          id="${{ steps.deploy.outputs.id }}"
          for attempt in $(seq 1 30); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$VERCEL_API_BASE/v13/deployments/$id?teamId=$VERCEL_ORG_ID")"
            state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$response")"
            echo "candidate attempt=$attempt state=$state"
            case "$state" in
              READY) printf '%s' "$response" > release-evidence/candidate-deployment.json; exit 0 ;;
              ERROR|CANCELED|DELETED) printf '%s' "$response" > release-evidence/candidate-deployment.json; exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Verify Candidate exact commit and health
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'Cache-Control: no-cache' "$CANDIDATE_URL/api/release-health" \
            > release-evidence/release-health-cold.json
          jq --arg sha "$GITHUB_SHA" 'if .releaseCommit == $sha then . else error("cold releaseCommit mismatch") end' release-evidence/release-health-cold.json > /dev/null
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'Cache-Control: no-cache' "$CANDIDATE_URL/api/release-health" \
            > release-evidence/release-health-warm.json
          jq --arg sha "$GITHUB_SHA" 'if .releaseCommit == $sha then . else error("warm releaseCommit mismatch") end' release-evidence/release-health-warm.json > /dev/null
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v3/deployments/${{ steps.deploy.outputs.id }}/events?teamId=$VERCEL_ORG_ID" \
            > release-evidence/candidate-events.ndjson
          if grep -Eqi '"level"[[:space:]]*:[[:space:]]*"error"|"type"[[:space:]]*:[[:space:]]*"error"|level=error' release-evidence/candidate-events.ndjson; then
            exit 1
          fi

      - name: Record cold and warm evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('cold','warm'):
              p=Path(f'release-evidence/release-health-{name}.json')
              data=json.loads(p.read_text())
              Path(f'release-evidence/{name}-summary.txt').write_text(
                  f"releaseCommit={data.get('releaseCommit','')}\n"
                  f"status={data.get('status','')}\n"
              )
          PY

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent007-vercel-candidate-${{ github.run_id }}
          path: release-evidence

  production:
    name: Production promotion (manual approval)
    needs: candidate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Assert exact candidate identity
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD 2>/dev/null || true)" = "$GITHUB_SHA" || true
          test "${{ needs.candidate.outputs.source_sha }}" = "$GITHUB_SHA"

      - name: Capture Vercel live state BEFORE promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > release-evidence/vercel-project-before-promotion.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20" \
            > release-evidence/vercel-deployments-before-promotion.json

      - name: Promote exact Candidate artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "${{ needs.candidate.outputs.candidate_id }}" --token "$VERCEL_TOKEN"

      - name: Verify Production exact commit and health
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v13/deployments/${{ needs.candidate.outputs.candidate_id }}?teamId=$VERCEL_ORG_ID" \
            > release-evidence/production-deployment.json
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$VERCEL_PRODUCTION_URL/api/release-health" \
            > release-evidence/production-release-health.json
          jq --arg sha "$GITHUB_SHA" 'if .releaseCommit == $sha then . else error("production releaseCommit mismatch") end' release-evidence/production-release-health.json > /dev/null

      - name: Capture Vercel live state AFTER promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > release-evidence/vercel-project-after-promotion.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20" \
            > release-evidence/vercel-deployments-after-promotion.json

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent007-vercel-production-${{ github.run_id }}
          path: release-evidence
