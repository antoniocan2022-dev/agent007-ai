name: Vercel Controlled Release Gate

on:
  workflow_dispatch:
    inputs:
      confirm_main:
        description: Confirm this release must originate from main
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - release/agent007-production-release.trigger

permissions:
  contents: read

env:
  VERCEL_API_BASE: https://api.vercel.com
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  release:
    name: Authorized first Production release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify source and deployment controls
        env:
          CONFIRM_MAIN: ${{ inputs.confirm_main || 'true' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRM_MAIN" = true
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          test "$(jq -r 'has("crons") and ((.crons // []) | length > 0)' vercel.json)" = false

      - name: Assert Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Capture Vercel state before release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/vercel-before.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' /tmp/vercel-before.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install exact repository dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Local production build gate without database mutation
        env:
          VERCEL_ENV: preview
        run: bun run build

      - name: Deploy exact checked-out main commit to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bun add --global vercel@latest
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Resolve Production deployment and wait for READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            project="$(curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$VERCEL_API_BASE/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
            state="$(jq -r '.latestDeployment.readyState // "UNKNOWN"' <<<"$project")"
            target="$(jq -r '.latestDeployment.target // "null"' <<<"$project")"
            id="$(jq -r '.latestDeployment.id // empty' <<<"$project")"
            url="$(jq -r '.latestDeployment.url // empty' <<<"$project")"
            echo "attempt=$attempt state=$state target=$target id=$id url=$url"
            if [ "$state" = READY ] && [ "$target" = production ] && [ -n "$id" ]; then
              deployment="$(curl --fail-with-body --silent --show-error --max-time 20 \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "$VERCEL_API_BASE/v13/deployments/$id?teamId=$VERCEL_ORG_ID")"
              sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$deployment")"
              echo "deploymentSha=$sha"
              test "$sha" = "$GITHUB_SHA"
              echo "PRODUCTION_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
              echo "PRODUCTION_URL=https://$url" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$state" = ERROR ] || [ "$state" = CANCELED ]; then
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify production health through Vercel protection bypass
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_URL"
          bun add --global vercel@latest
          for attempt in $(seq 1 10); do
            if output="$(vercel curl "$PRODUCTION_URL/api/release-health" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" 2>/tmp/vercel-curl.err)"; then
              printf '%s\n' "$output" | tee /tmp/release-health.txt
              if printf '%s\n' "$output" | grep -q '"ok":true'; then
                exit 0
              fi
            else
              cat /tmp/vercel-curl.err
            fi
            sleep 5
          done
          exit 1

      - name: Capture Vercel state after release
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          curl --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API_BASE/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/vercel-after.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' /tmp/vercel-after.json
