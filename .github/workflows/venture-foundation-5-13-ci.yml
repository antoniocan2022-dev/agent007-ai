name: Venture OS 5-13 Foundation CI

on:
  push:
    branches:
      - 'arch/venture-control-plane-5-13'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  venture-foundation:
    name: Venture OS 5-13 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_test
      NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret
      OWNER_EMAIL: ci-owner@example.com
      SEED_EMAIL: ci-owner@example.com
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent007_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent007_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Prepare test database
        run: bunx prisma db push --skip-generate
      - name: Run Venture OS 5-13 contract tests
        run: bun test src/lib/venture-foundation-contract.test.ts
      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit --pretty false
      - name: Diff hygiene
        run: git diff --check
      - name: Repository coherence audit
        run: bun scripts/repository-coherence-audit.ts
      - name: Venture architecture audit
        run: bun scripts/venture-architecture-audit.ts
      - name: Deep integrated audit
        run: bun scripts/deep-integrity-audit.ts
