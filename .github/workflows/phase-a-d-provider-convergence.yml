name: Phase A-D Provider Convergence

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase-a-d-provider-convergence
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Apply provider retirement
        run: python3 scripts/retire-legacy-providers.py
      - name: Regenerate lockfile
        run: bun install --lockfile-only
      - name: Verify retired providers are absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E "z-ai-web-dev-sdk|ZAI\.create|ZAI_API_KEY|Z_AI|api\.z\.ai|GEMINI_API_KEY|['\"]gemini['\"]|gemini-" -- src package.json bun.lock; then
            echo 'FAIL: retired provider references remain.' >&2
            exit 1
          fi
      - name: Phase A-D verification chain
        shell: bash
        run: |
          set -euo pipefail
          bun run audit:deep
          bun run audit:coherence
          bun run audit:ceo-lifecycle
          bun x tsc --noEmit
          bun x eslint .
          bun run build
      - name: Commit converged main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete provider convergence and retire legacy SDKs'
          git push origin HEAD:main
      - name: Remove one-time migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          rm -f .github/workflows/phase-a-d-provider-convergence.yml
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase-a-d-provider-convergence.yml
          git commit -m 'ci: remove one-time provider migration workflow'
          git push origin cleanup:main
          git push origin --delete cleanup || true
