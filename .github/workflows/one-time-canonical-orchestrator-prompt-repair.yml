name: One-Time Canonical Orchestrator Prompt Repair

on:
  push:
    paths:
      - '.github/workflows/one-time-canonical-orchestrator-prompt-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch only orchestrator prompt block
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/lib/orchestrator.ts')
          text = path.read_text()

          if 'export async function runOrchestrator' not in text:
              raise SystemExit('SAFETY STOP: runOrchestrator export is missing; refusing to modify orchestrator.ts')
          if 'export const MAX_ITERATIONS' not in text:
              raise SystemExit('SAFETY STOP: MAX_ITERATIONS export is missing; refusing to modify orchestrator.ts')
          if 'export interface OrchestratorEventEmit' not in text:
              raise SystemExit('SAFETY STOP: OrchestratorEventEmit export is missing; refusing to modify orchestrator.ts')

          import_line = "import { getCanonicalOrganizationPrompt } from './canonical-organization-prompt'\n"
          if import_line not in text:
              anchor = "import { verifyToolAction } from \"./tool-action-verification\"\n"
              if anchor not in text:
                  raise SystemExit('SAFETY STOP: orchestrator import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)

          replacement = '''const ORCHESTRATOR_PROMPT_ADDENDUM = `
  ORCHESTRATION:
  You orchestrate the canonical organization defined by the Agent007 organization graph. For multi-step tasks, dispatch leaders and specialists using identities present in the canonical organization context.
  <dispatch agent="scout" task="find 3 trending AI niches"/>
  <dispatch_subagent id="aurora">Design a content calendar</dispatch_subagent>
  Max 3 dispatches per turn, then synthesize into a final answer.

  ${getCanonicalOrganizationPrompt()}

  MISSION PIPELINE (hierarchical verification):
  Type "start mission: <type>: <objective>" to run a full pipeline.
  Types: product_launch, content_creation, affiliate_campaign, generic.
  Each stage: Leader runs -> Super Agent verifies (0-100 score) -> if score < 85,
  retry with corrections (max 3 rounds) -> next stage -> CEO presents final report.

  The system auto-handles: quality scoring, cross-leader verification, tool
  boundary audits, learning storage, and Telegram notifications. You don't
  need to manually trigger these -- just dispatch, synthesize, and answer.`'''

          pattern = r'const ORCHESTRATOR_PROMPT_ADDENDUM = `.*?`\nexport interface OrchestratorEventEmit'
          new_text, count = re.subn(pattern, replacement + '\nexport interface OrchestratorEventEmit', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('SAFETY STOP: expected exactly one orchestrator prompt block')

          if '20 subagents' in new_text or '20 pod leaders' in new_text or 'Plus 2 custom test agents' in new_text:
              raise SystemExit('SAFETY STOP: legacy organizational description remains after targeted patch')

          if new_text.count('export async function runOrchestrator') != 1:
              raise SystemExit('SAFETY STOP: runOrchestrator export count changed unexpectedly')
          if new_text.count('export const MAX_ITERATIONS') != 1:
              raise SystemExit('SAFETY STOP: MAX_ITERATIONS export count changed unexpectedly')
          if new_text.count('export interface OrchestratorEventEmit') != 1:
              raise SystemExit('SAFETY STOP: OrchestratorEventEmit export count changed unexpectedly')

          path.write_text(new_text)

      - name: Verify targeted diff
        run: |
          set -euo pipefail
          git diff -- src/lib/orchestrator.ts
          git status --short
          ! grep -n "20 subagents\|20 pod leaders\|Plus 2 custom test agents" src/lib/orchestrator.ts
          grep -n "getCanonicalOrganizationPrompt" src/lib/orchestrator.ts
          grep -n "export async function runOrchestrator" src/lib/orchestrator.ts
          grep -n "export const MAX_ITERATIONS" src/lib/orchestrator.ts

      - name: Commit repair and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/orchestrator.ts
          git rm .github/workflows/one-time-canonical-orchestrator-prompt-repair.yml
          git commit -m 'fix: derive orchestrator prompt from canonical organization'
          git push origin HEAD:main
