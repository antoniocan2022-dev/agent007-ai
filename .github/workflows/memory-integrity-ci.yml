name: Agent007 Memory Integrity CI

on:
  push:
    branches:
      - main
      - 'development/**'
      - 'feat/**'
      - 'fix/**'
      - 'integration/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  memory-integrity:
    name: Memory Unicode boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Unicode boundary regression tests
        run: bun scripts/test-memory-text.ts
