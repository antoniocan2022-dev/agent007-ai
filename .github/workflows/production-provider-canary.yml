name: Production provider canary

on:
  deployment_status:

permissions:
  contents: read

env:
  # The canary must probe the stable production alias, not the per-deployment URL from the
  # deployment_status event (github.event.deployment_status.environment_url / target_url):
  # that URL is unique per deployment and sits behind Vercel Authentication, so a curl against
  # it gets redirected to the SSO login page instead of JSON -- the exact failure this workflow
  # showed on every run regardless of production's real health. The alias is what real users
  # and every other health probe in this project actually hit, so it's also the correct target.
  PRODUCTION_URL: https://agent007-ai.vercel.app

jobs:
  provider-canary:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify release health and CEO reasoning canary
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/release-health" > release-health.json
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/health/provider-canary" > provider-canary.json
          node <<'NODE'
          const fs = require('node:fs')
          const release = JSON.parse(fs.readFileSync('release-health.json', 'utf8'))
          const canary = JSON.parse(fs.readFileSync('provider-canary.json', 'utf8'))
          const deploymentSha = process.env.DEPLOYMENT_SHA
          const failures = []
          if (release.ok !== true || release.proof?.tripleProof !== true) failures.push('release-health triple proof is not green')
          if (release.source?.mainSha !== deploymentSha) failures.push(`GitHub main SHA mismatch: ${release.source?.mainSha} != ${deploymentSha}`)
          if (release.runtime?.commitSha !== deploymentSha) failures.push(`runtime SHA mismatch: ${release.runtime?.commitSha} != ${deploymentSha}`)
          if (canary.ok !== true) failures.push('provider canary failed')
          if (canary.degraded !== false) failures.push('provider canary entered degraded mode')
          if (canary.nonEmptyResponse !== true) failures.push('provider canary returned empty response')
          if (canary.executionValidated !== true) failures.push('provider execution was not validated')
          if (canary.acceptableLatency !== true || canary.responseMs > 5000) failures.push(`provider latency unacceptable: ${canary.responseMs}ms`)
          if (!canary.provider || !canary.model) failures.push('provider/model identity missing from canary')
          if (failures.length) { console.error(failures.join('\n')); process.exit(1) }
          console.log(`Production provider canary PASSED: ${canary.provider}/${canary.model} ${canary.responseMs}ms; SHA ${deploymentSha}`)
          NODE
