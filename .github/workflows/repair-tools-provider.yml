name: Repair tools provider boundary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Replace tools provider boundary safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/lib/tools.ts')
          s = p.read_text()

          # Remove the retired SDK import and singleton helper only.
          s = s.replace("import ZAI from 'z-ai-web-dev-sdk'\n", '')
          s = re.sub(r"\nlet _zai: ZAI \| null = null\nasync function getZai\(\): Promise<ZAI> \{\n  if \(!_zai\) _zai = await ZAI\.create\(\)\n  return _zai\n\}\n", '\n', s)

          if "from './canonical-web-search'" not in s:
              s = "import { canonicalWebSearch } from './canonical-web-search'\n" + s

          # Migrate the primary web_search call while keeping the entire existing fallback logic intact.
          s = s.replace("    const zai = await getZai()\n    const results = await zai.functions.invoke('web_search', {\n      query,\n      num: Math.min(Math.max(args.num ?? 5, 1), 10),\n      recency_days: args.recency_days,\n    })", "    const results = await canonicalWebSearch(query, Math.min(Math.max(args.num ?? 5, 1), 10), args.recency_days)")
          s = s.replace("throw new Error('Z.ai returned empty results')", "throw new Error('Canonical web search returned empty results')")
          s = s.replace('via Z.ai, DuckDuckGo, or Google', 'via canonical search providers, DuckDuckGo, or Google')
          s = s.replace('Z.ai error:', 'Primary search error:')

          # Any remaining provider function calls in this file are routed through the canonical compatibility client.
          if 'getZai()' in s:
              s = s.replace('getZai()', 'getCanonicalCompatClient()')
          if 'getCanonicalCompatClient()' in s and "from './canonical-provider-compat'" not in s:
              lines = s.splitlines(True)
              pos = 0
              while pos < len(lines) and (lines[pos].startswith('import ') or not lines[pos].strip()): pos += 1
              lines.insert(pos, "import { getCanonicalCompatClient } from './canonical-provider-compat'\n")
              s = ''.join(lines)

          # Eliminate any remaining direct ZAI identifier references; function-call shapes are intentionally left intact for the compatibility client.
          s = s.replace("const ZAI = (await import('z-ai-web-dev-sdk')).default", "const CanonicalCompat = await getCanonicalCompatClient()")
          s = s.replace('await ZAI.create()', 'await getCanonicalCompatClient()')
          s = s.replace('ZAI.create()', 'getCanonicalCompatClient()')

          if 'z-ai-web-dev-sdk' in s or 'ZAI.create' in s or "import ZAI" in s:
              raise SystemExit('retired SDK still present in tools.ts')
          p.write_text(s)

      - name: Validate tools module
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE "z-ai-web-dev-sdk|ZAI\.create|ZAI_API_KEY|GEMINI_API_KEY" src/lib/tools.ts
          bun install --frozen-lockfile
          bun run db:generate
          bunx tsc -p tsconfig.ci.json --noEmit
          bun test tests/system-proof-and-context-contract.test.ts
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/tools.ts
          git rm .github/workflows/repair-tools-provider.yml
          git commit -m 'fix: retire legacy provider from tools module'
          git push origin HEAD:main
