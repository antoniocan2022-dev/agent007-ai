name: Production DB Schema Coherence Repair

on:
  workflow_dispatch:
    inputs:
      confirm_repair:
        description: Confirm this is an authorized production database schema repair
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  repair:
    name: Add missing nullable schema columns
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Require explicit authorization
        env:
          CONFIRM_REPAIR: ${{ inputs.confirm_repair }}
        run: |
          set -euo pipefail
          test "$CONFIRM_REPAIR" = true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Apply additive PostgreSQL schema repair
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          cat > /tmp/schema-repair.sql <<'SQL'
          ALTER TABLE "PhoneConfig" ADD COLUMN IF NOT EXISTS "emailImapHost" TEXT;
          ALTER TABLE "PhoneConfig" ADD COLUMN IF NOT EXISTS "emailImapPort" TEXT;
          ALTER TABLE "PhoneConfig" ADD COLUMN IF NOT EXISTS "emailImapUser" TEXT;
          ALTER TABLE "PhoneConfig" ADD COLUMN IF NOT EXISTS "emailImapPassword" TEXT;

          ALTER TABLE "Opportunity" ADD COLUMN IF NOT EXISTS "source" TEXT;
          ALTER TABLE "Opportunity" ADD COLUMN IF NOT EXISTS "url" TEXT;
          ALTER TABLE "Opportunity" ADD COLUMN IF NOT EXISTS "riskScore" INTEGER;
          ALTER TABLE "Opportunity" ADD COLUMN IF NOT EXISTS "estIncome" DOUBLE PRECISION;
          SQL
          bunx prisma db execute --stdin --url "$DATABASE_URL" < /tmp/schema-repair.sql

      - name: Verify repaired columns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          cat > /tmp/schema-verify.sql <<'SQL'
          SELECT table_name, column_name
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND (
              (table_name = 'PhoneConfig' AND column_name IN ('emailImapHost','emailImapPort','emailImapUser','emailImapPassword'))
              OR
              (table_name = 'Opportunity' AND column_name IN ('source','url','riskScore','estIncome'))
            )
          ORDER BY table_name, column_name;
          SQL
          bunx prisma db execute --stdin --url "$DATABASE_URL" < /tmp/schema-verify.sql

      - name: Record safety boundary
        run: |
          echo 'Only additive nullable columns were applied. No tables or existing columns were dropped or overwritten.'
