name: Production DB Schema Coherence Repair

on:
  workflow_dispatch:
    inputs:
      confirm_repair:
        description: Confirm this is an authorized production database schema repair
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  repair:
    name: Add missing nullable schema columns
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Require explicit authorization
        env:
          CONFIRM_REPAIR: ${{ inputs.confirm_repair }}
        run: |
          set -euo pipefail
          test "$CONFIRM_REPAIR" = true

      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Assert Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install and link Vercel CLI to exact project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bun add --global vercel@latest
          vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          test -f .vercel/project.json

      - name: Verify Production DATABASE_URL exists in Vercel without exposing it
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          vercel env run -e production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" -- sh -lc 'test -n "$DATABASE_URL"'
          echo 'Production DATABASE_URL is configured in Vercel: yes'

      - name: Apply additive PostgreSQL schema repair from Vercel Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          cat > /tmp/schema-repair.sql <<'SQL'
          ALTER TABLE "PhoneConfig" ADD COLUMN IF NOT EXISTS "emailImapHost" TEXT;
          ALTER TABLE "PhoneConfig" ADD COLUMN IF NOT EXISTS "emailImapPort" TEXT;
          ALTER TABLE "PhoneConfig" ADD COLUMN IF NOT EXISTS "emailImapUser" TEXT;
          ALTER TABLE "PhoneConfig" ADD COLUMN IF NOT EXISTS "emailImapPassword" TEXT;

          ALTER TABLE "Opportunity" ADD COLUMN IF NOT EXISTS "source" TEXT;
          ALTER TABLE "Opportunity" ADD COLUMN IF NOT EXISTS "url" TEXT;
          ALTER TABLE "Opportunity" ADD COLUMN IF NOT EXISTS "riskScore" INTEGER;
          ALTER TABLE "Opportunity" ADD COLUMN IF NOT EXISTS "estIncome" DOUBLE PRECISION;
          SQL
          vercel env run -e production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" -- bunx prisma db execute --stdin < /tmp/schema-repair.sql

      - name: Verify repaired columns from Vercel Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          cat > /tmp/schema-verify.sql <<'SQL'
          WITH expected(table_name, column_name) AS (
            VALUES
              ('PhoneConfig','emailImapHost'),
              ('PhoneConfig','emailImapPort'),
              ('PhoneConfig','emailImapUser'),
              ('PhoneConfig','emailImapPassword'),
              ('Opportunity','source'),
              ('Opportunity','url'),
              ('Opportunity','riskScore'),
              ('Opportunity','estIncome')
          )
          SELECT e.table_name, e.column_name
          FROM expected e
          JOIN information_schema.columns c
            ON c.table_schema = 'public'
           AND c.table_name = e.table_name
           AND c.column_name = e.column_name
          ORDER BY e.table_name, e.column_name;
          SQL
          result="$(vercel env run -e production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" -- bunx prisma db execute --stdin < /tmp/schema-verify.sql)"
          printf '%s\n' "$result"
          count="$(printf '%s\n' "$result" | grep -Ec 'PhoneConfig|Opportunity' || true)"
          test "$count" -eq 8

      - name: Record safety boundary
        run: |
          echo 'Only additive nullable columns were applied. No tables or existing columns were dropped or overwritten.'
