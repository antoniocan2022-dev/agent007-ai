name: Agent007 Revenue Foundation CI

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'development/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
      - 'development/**'

permissions:
  contents: read

jobs:
  revenue-foundation:
    name: Revenue integrity contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install
      - name: Revenue integrity tests
        run: bun test src/lib/revenue-integrity.test.ts
      - name: Targeted lint
        run: bunx eslint src/lib/revenue-integrity.ts src/lib/revenue-integrity.test.ts src/app/api/webhooks/stripe/route.ts src/lib/revenue-reconciliation.ts
