name: Agent007 Revenue Foundation CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'development/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
      - 'development/**'

permissions:
  contents: read

jobs:
  revenue-foundation:
    name: Revenue integrity contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_test
      NEXTAUTH_SECRET: agent007-ci-only-test-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent007_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent007_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Prepare test database
        run: bunx prisma db push --skip-generate
      - name: Revenue integrity tests
        run: bun test src/lib/revenue-integrity.test.ts src/lib/product-fulfillment.security.test.ts
      - name: Targeted lint
        run: bunx eslint src/lib/revenue-integrity.ts src/lib/revenue-integrity.test.ts src/app/api/webhooks/stripe/route.ts src/lib/revenue-reconciliation.ts src/lib/product-fulfillment.ts src/lib/product-fulfillment.security.test.ts src/app/api/download-link/route.ts
