name: _one-shot-p1-p7-patch
on:
  push:
    branches: [feat/ceo-p1-p4-conversational-integrity]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ceo-p1-p4-conversational-integrity
          fetch-depth: 0
      - name: Fix P5 boundary and remove patcher
        env:
          BRANCH: feat/ceo-p1-p4-conversational-integrity
        run: |
          python -c "from pathlib import Path; p=Path('src/lib/ceo-reference-resolution.ts'); s=p.read_text(); s=s.replace('if(ordinal===1 || (sawListHeader && currentListId===`list-${listSerial}`)){listSerial+=1;currentListId=`list-${listSerial}`}','if(ordinal===1 || sawListHeader){listSerial+=1;currentListId=`list-${listSerial}`;sawListHeader=false}'); p.write_text(s)"
          git rm -f .github/workflows/_p1_p7_patch.yml
          git add src/lib/ceo-reference-resolution.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ceo): correct latest-list boundary state"
          git push origin "$BRANCH"
