name: Finish retired provider removal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply deterministic source fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # advanced-capabilities: migrate legacy web search calls and all getZai callers to canonical bridge.
          p = Path('src/lib/advanced-capabilities.ts'); s = p.read_text()
          if "from './canonical-web-search'" not in s:
              s = "import { canonicalWebSearch } from './canonical-web-search'\n" + s
          s = re.sub(r"const zai = await getZai\(\)\n", "", s)
          s = s.replace("await zai.functions.invoke('web_search', { query: meta.query, num: 4, recency_days: timeframe })", "await canonicalWebSearch(meta.query, 4, timeframe)")
          s = s.replace("await zai.functions.invoke('web_search', { query, num: 8, recency_days: 14 })", "await canonicalWebSearch(query, 8, 14)")
          s = s.replace("await zai.functions.invoke('web_search', { query: prompt, num: 5 })", "await canonicalWebSearch(prompt, 5)")
          s = re.sub(r"\nasync function getZai\(\) \{.*?\n\}\n", "\n", s, flags=re.S)
          s = s.replace('getZai()', 'getCanonicalLlmClient()')
          if 'getCanonicalLlmClient()' in s and "import { callLlmWithRetry } from './agent-canonical-bridge'" not in s:
              s = "import { callLlmWithRetry } from './agent-canonical-bridge'\n" + s
              helper = "async function getCanonicalLlmClient() { return { chat: { completions: { create: async (params: any) => callLlmWithRetry(params.messages, { temperature: params.temperature, maxTokens: params.max_tokens }) } } } }\n"
              s = s.replace("import { callLlmWithRetry } from './agent-canonical-bridge'\n", "import { callLlmWithRetry } from './agent-canonical-bridge'\n" + helper, 1)
          p.write_text(s)

          # business-infrastructure and enhanced-tools: migrate web search to canonical helper.
          for name in ['src/lib/business-infrastructure.ts','src/lib/enhanced-tools.ts']:
              p = Path(name); s = p.read_text()
              if "from './canonical-web-search'" not in s:
                  s = "import { canonicalWebSearch } from './canonical-web-search'\n" + s
              s = re.sub(r"const zai = await getZai\(\)\n", "", s)
              s = s.replace("zai.functions.invoke('web_search', { query: `${focus} passive income opportunity 2026 emerging`, num: 4, recency_days: 7 })", "canonicalWebSearch(`${focus} passive income opportunity 2026 emerging`, 4, 7)")
              s = s.replace("zai.functions.invoke('web_search', { query: `${focus} trending topics content creation AI 2026`, num: 4, recency_days: 7 })", "canonicalWebSearch(`${focus} trending topics content creation AI 2026`, 4, 7)")
              s = s.replace("zai.functions.invoke('web_search', { query: `${focus} competitor analysis pricing 2026`, num: 3, recency_days: 14 })", "canonicalWebSearch(`${focus} competitor analysis pricing 2026`, 3, 14)")
              s = s.replace("zai.functions.invoke('web_search', { query: `${industry} market trends 2025 ${region}`, num: 5 })", "canonicalWebSearch(`${industry} market trends 2025 ${region}`, 5)")
              s = re.sub(r"\nasync function getZai\(\) \{.*?\n\}\n", "\n", s, flags=re.S)
              s = s.replace('getZai()', 'getCanonicalLlmClient()')
              if 'getCanonicalLlmClient()' in s and "import { callLlmWithRetry } from './agent-canonical-bridge'" not in s:
                  s = "import { callLlmWithRetry } from './agent-canonical-bridge'\n" + s
                  helper = "async function getCanonicalLlmClient() { return { chat: { completions: { create: async (params: any) => callLlmWithRetry(params.messages, { temperature: params.temperature, maxTokens: params.max_tokens }) } } } }\n"
                  s = s.replace("import { callLlmWithRetry } from './agent-canonical-bridge'\n", "import { callLlmWithRetry } from './agent-canonical-bridge'\n" + helper, 1)
              p.write_text(s)

          # max-improvements: replace legacy market search with canonical external search helper.
          p = Path('src/lib/max-improvements.ts'); s = p.read_text()
          if "from './canonical-web-search'" not in s:
              s = "import { canonicalWebSearch } from './canonical-web-search'\n" + s
          s = re.sub(r"      const ZAI = .*?      const results = await _z\.functions\.invoke\('web_search', \{ query: `\$\{industry\} trends 2025 new opportunities emerging`, num: 5 \}\)\n", "      const results = await canonicalWebSearch(`${industry} trends 2025 new opportunities emerging`, 5)\n", s, flags=re.S)
          p.write_text(s)

          # tools: remove legacy page reader, image gen and vision dependencies; use direct HTTP + canonical vision LLM.
          p = Path('src/lib/tools.ts'); s = p.read_text()
          if 'getZai' in s:
              s = re.sub(r"\nlet _zai:.*?\n\}\n", "\n", s, flags=re.S)
          s = re.sub(r"  try \{\n    const zai = await getZai\(\)\n    const res: any = await zai\.functions\.invoke\('page_reader', \{ url \}\)\n    const html = res\?\.data\?\.html \?\? ''\n    const title = res\?\.data\?\.title \?\? url\n    const text = stripHtml\(html\)\.slice\(0, 6000\)\n    const out = okResult\(.*?    return out\n  \} catch \(zaiError: any\) \{", "  try {\n    throw new Error('Use direct HTTP page retrieval')\n  } catch (zaiError: any) {", s, flags=re.S)
          img_start = s.index('  try {\n    const zai = await getZai()', s.index('export async function toolImageGen'))
          img_end = s.index('  } catch (e: any) {', img_start)
          new_img = "  try {\n    const apiKey = process.env.OPENAI_API_KEY\n    if (!apiKey) throw new Error('Image generation requires OPENAI_API_KEY')\n    const response = await fetch('https://api.openai.com/v1/images/generations', { method: 'POST', headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'gpt-image-1', prompt, size }), signal: AbortSignal.timeout(30000) })\n    if (!response.ok) throw new Error(`image_gen failed: HTTP ${response.status}`)\n    const json: any = await response.json()\n    const b64 = json?.data?.[0]?.b64_json\n    if (!b64) throw new Error('image_gen returned no image data')\n    const dataUrl = `data:image/png;base64,${b64}`\n    return { ok: true, preview: `Generated image (${size}): \"${prompt.slice(0, 80)}\"`, result: `Image generated successfully. Prompt: \"${prompt}\". Size: ${size}.`, artifacts: [{ type: 'image', data: dataUrl, label: prompt.slice(0, 80) }] }\n"
          s = s[:img_start] + new_img + s[img_end:]
          vis_start = s.index('  try {\n    const zai = await getZai()', s.index('export async function toolVision'))
          vis_end = s.index('  } catch (e: any) {', vis_start)
          new_vis = "  try {\n    const { runCanonicalLlm } = await import('./canonical-llm-router')\n    const response = await runCanonicalLlm({ messages: [{ role: 'user', content: `${prompt}\\n\\nIMAGE_DATA_URL\\n${img.dataUrl}` }], taskType: 'analysis', verification: 'standard', executionClass: 'standard' })\n    const text = response?.content ?? ''\n    return okResult(`Vision: ${text.slice(0, 200)}`, text)\n"
          s = s[:vis_start] + new_vis + s[vis_end:]
          s = s.replace("    const urlObj = new URL(url)", "    const urlObj = new URL(url)")
          p.write_text(s)

          # Health/audit metadata must only expose canonical LLM providers.
          p = Path('src/app/api/health/full-audit/route.ts'); s = p.read_text()
          s = re.sub(r"    \{ id: 'openai', env: 'OPENAI_API_KEY' \},\n", '', s)
          s = re.sub(r"    \{ id: 'brave', env: 'BRAVE_API_KEY' \ },\n", '', s)
          s = re.sub(r"    \{ id: 'gemini', env: 'GEMINI_API_KEY' \ },\n    \{ id: 'z-ai', env: 'ZAI_API_KEY' \ },\n", '', s)
          p.write_text(s)

          p = Path('src/app/api/system/capability-audit/route.ts'); s = p.read_text()
          s = re.sub(r"  \{ name: 'OpenAI', env: 'OPENAI_API_KEY'.*?\},\n", '', s)
          s = re.sub(r"  \{ name: 'z.ai', env: 'ZAI_API_KEY'.*?\},\n", '', s)
          s = re.sub(r"  \{ name: 'Mistral', env: 'MISTRAL_API_KEY'.*?\},", "  { name: 'Mistral', env: 'MISTRAL_API_KEY', speed: 'slow', cost: 'free tier' },\n  { name: 'Cerebras', env: 'CEREBRAS_API_KEY', speed: 'fast', cost: 'free tier' },\n  { name: 'Cloudflare', env: 'CLOUDFLARE_AI_API_TOKEN', speed: 'fast', cost: 'usage based' },\n  { name: 'OpenRouter', env: 'OPENROUTER_API_KEY', speed: 'fast', cost: 'usage based' },", s)
          p.write_text(s)

          # Remove retired Gemini/Z.AI branches from provider comparison tests/runtime.
          p = Path('src/lib/multi-provider-comparison.ts'); s = p.read_text()
          s = re.sub(r"\n      case 'gemini': return !!process\.env\.GEMINI_API_KEY", '', s)
          s = s.replace(', GEMINI_API_KEY', '')
          s = re.sub(r"\n          case 'gemini': return !!process\.env\.GEMINI_API_KEY", '', s)
          s = s.replace("  if (process.env.GEMINI_API_KEY) all.push('gemini')\n", '')
          s = re.sub(r"\n\s*case 'gemini':.*?\n", '\n', s)
          p.write_text(s)

          p = Path('src/lib/model-intelligence.test.ts'); s = p.read_text()
          s = re.sub(r"\n\s*delete process\.env\.ZAI_API_KEY", '', s)
          s = re.sub(r"\n\s*delete process\.env\.GEMINI_API_KEY", '', s)
          s = re.sub(r"\n\s*process\.env\.ZAI_API_KEY = 'test'", '', s)
          s = re.sub(r"\n\s*process\.env\.GEMINI_API_KEY = 'test'", '', s)
          p.write_text(s)

          p = Path('src/lib/optimization-tools-v2.ts'); s = p.read_text()
          s = s.replace('z-ai-web-dev-sdk: 1.4.0 → 1.5.1 (minor update available)', 'canonical provider packages: verified against current lockfile')
          p.write_text(s)
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E "z-ai-web-dev-sdk|ZAI\.create|ZAI_API_KEY|GEMINI_API_KEY|['\"]gemini['\"]|gemini-" -- src package.json bun.lock ':!src/lib/upgrade-manifest.ts'
          bun install --frozen-lockfile
          bun run db:generate
          bunx tsc -p tsconfig.ci.json --noEmit
          bun run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/finish-provider-repair.yml
          git commit -m 'fix: finish canonical provider migration'
          git push origin HEAD:main
