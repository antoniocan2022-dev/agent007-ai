name: Phase 6 Registry Migration
on:
  push:
    branches: [feat/phase6-final-ci]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register Phase 6 tools in canonical registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/tools.ts')
          text = path.read_text()
          marker = "/* PHASE 6 — COMMERCIAL INTEGRATION & EXECUTION PLATFORM */"
          if marker not in text:
              block = """

/* PHASE 6 — COMMERCIAL INTEGRATION & EXECUTION PLATFORM */
import { COMMERCIAL_PHASE6_TOOLS } from './commercial-phase6-tools'
for (const [toolId, fn] of Object.entries(COMMERCIAL_PHASE6_TOOLS)) {
  TOOL_REGISTRY[toolId] = { fn, icon: 'zap', label: `Phase 6 ${toolId.replace(/_/g, ' ')}` }
}
"""
              path.write_text(text.rstrip() + block)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-registry-migration.yml
          git add src/lib/tools.ts
          git commit -m "feat(phase6): register commercial execution tools"
          git push
