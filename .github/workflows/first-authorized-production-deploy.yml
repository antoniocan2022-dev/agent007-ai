name: First Authorized Production Deploy

# Canonical controlled production release path.
# Automatic Vercel Git deployment remains disabled; only an explicitly authorized main push or manual release can deploy.
# Release gate includes the repaired Venture OS heartbeat/security suite before Vercel deploy.
# Release architecture is self-protected by permanent invariants and the repaired Venture OS heartbeat/security suite.
# Release-architecture invariant distinguishes real deploy/promote operations from Vercel CLI admin/DB usage.
# Owner-bootstrap security invariant is validated before deployment.
# Deployment verification inspects the exact Vercel deployment returned by the CLI.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      authorize_production:
        description: Explicitly authorize the production deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59.1.3

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.authorize_production == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'authorize final Venture OS production release')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact source and release controls
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          test "$(jq -r 'has(\"crons\") and ((.crons // []) | length > 0)' vercel.json)" = false

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Capture Vercel state before deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" > /tmp/vercel-before.json
          jq '{id,name,live,domains,framework,nodeVersion}' /tmp/vercel-before.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install exact repository dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Release architecture invariants
        run: bun test tests/release-architecture.test.ts

      - name: Venture OS heartbeat contract gate
        env:
          DATABASE_URL: ''
        run: |
          set -euo pipefail
          bun test tests/venture-os-v2.test.ts tests/architecture-control-plane.test.ts tests/venture-os-integration.test.ts tests/db-runtime-policy.test.ts tests/owner-bootstrap-security.test.ts

      - name: Production build gate
        env:
          VERCEL_ENV: production
        run: bun run build

      - name: Deploy exact triggering commit to Production
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GIT_MESSAGE: ${{ github.event.head_commit.message || 'Controlled production release' }}
          GIT_ACTOR: ${{ github.actor }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          short_msg="$(printf '%s\n' "$GIT_MESSAGE" | head -n1)"
          set +e
          output="$(bunx vercel@$VERCEL_CLI_VERSION deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            --build-env AGENT007_RELEASE_SCHEMA_RECONCILE=1 \
            -m githubCommitAuthorName=antoniocan2022-dev \
            -m githubCommitMessage="$short_msg" \
            -m githubCommitOrg=antoniocan2022-dev \
            -m githubCommitRef=main \
            -m githubCommitRepo=agent007-ai \
            -m githubCommitSha="$GITHUB_SHA" \
            -m githubDeployment=1 \
            -m githubOrg=antoniocan2022-dev \
            -m githubRepo=agent007-ai \
            -m githubCommitAuthorLogin="$GIT_ACTOR" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0

          deployment_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed exact release to: $deployment_url"

      - name: Verify exact Vercel deployment directly
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.vercel-deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          deployment_json="$(bunx vercel@$VERCEL_CLI_VERSION inspect "$DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --format json)"
          printf '%s\n' "$deployment_json"
          state="$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$deployment_json")"
          target="$(jq -r '.target // .targets[0] // "null"' <<<"$deployment_json")"
          deployment_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$deployment_json")"
          echo "state=$state target=$target sha=$deployment_sha"
          test "$state" = READY
          test "$target" = production
          test "$deployment_sha" = "$GITHUB_SHA"

      - name: Verify deployed artifact health
        env:
          DEPLOYMENT_URL: ${{ steps.vercel-deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --max-time 20 --write-out '\nHTTP_STATUS=%{http_code}' "${DEPLOYMENT_URL}/api/release-health")"
            body="${response%HTTP_STATUS=*}"
            status="${response##*HTTP_STATUS=}"
            echo "$response"
            if [ "$status" = 200 ] && printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q "\"releaseCommit\":\"$GITHUB_SHA\""; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verify canonical Production health and exact release identity
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --max-time 20 --write-out '\nHTTP_STATUS=%{http_code}' "https://agent007-ai.vercel.app/api/release-health")"
            body="${response%HTTP_STATUS=*}"
            status="${response##*HTTP_STATUS=}"
            echo "$response"
            if [ "$status" = 200 ] && printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q "\"releaseCommit\":\"$GITHUB_SHA\""; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verify immediate production error surface
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          log_output="$(bunx vercel@$VERCEL_CLI_VERSION logs --environment production --level error --since 5m --limit 50 --token "$VERCEL_TOKEN" 2>&1 || true)"
          echo "$log_output"
          if printf '%s' "$log_output" | grep -Eiq '(error|fatal)'; then exit 1; fi

      - name: Final Vercel state snapshot
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          curl --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" > /tmp/vercel-after.json
          jq '{id,name,live,domains,framework,nodeVersion}' /tmp/vercel-after.json
