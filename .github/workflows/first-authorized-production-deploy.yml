name: First Authorized Production Deploy

# Canonical controlled production release path.
# Automatic Vercel Git deployment remains disabled; only an explicitly authorized
# main push, manual release, or the scheduled recovery check can deploy.
# The scheduled recovery exists because the external deployment connector cannot
# be relied on to dispatch GitHub Actions; it is idempotent and deploys only the
# exact authorized main SHA when no production deployment for that SHA exists.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      authorize_production:
        description: Explicitly authorize the production deployment
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: agent007-controlled-production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59.1.3

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.authorize_production == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'authorize final Venture OS production release')) || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact current main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Authorize or safely skip scheduled recovery
        id: authorization
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ "${{ inputs.authorize_production }}" = "true" ]; then
                echo 'authorized=true' >> "$GITHUB_OUTPUT"
              else
                echo 'authorized=false' >> "$GITHUB_OUTPUT"
              fi
              ;;
            push)
              message="${{ github.event.head_commit.message }}"
              if printf '%s' "$message" | grep -Fq 'authorize final Venture OS production release'; then
                echo 'authorized=true' >> "$GITHUB_OUTPUT"
              else
                echo 'authorized=false' >> "$GITHUB_OUTPUT"
              fi
              ;;
            schedule)
              message="$(git log -1 --pretty=%B)"
              if printf '%s' "$message" | grep -Fq 'authorize final Venture OS production release'; then
                echo 'authorized=true' >> "$GITHUB_OUTPUT"
              else
                echo 'authorized=false' >> "$GITHUB_OUTPUT"
                echo 'Scheduled recovery: latest main commit is not an explicitly authorized production release; safely skipping.'
              fi
              ;;
            *)
              echo 'authorized=false' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Verify exact source and release controls
        if: steps.authorization.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || test "$GITHUB_EVENT_NAME" = schedule
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          jq -e '((.crons // []) | length == 0)' vercel.json >/dev/null

      - name: Verify Vercel credentials
        if: steps.authorization.outputs.authorized == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Check for an existing production deployment of this exact SHA
        id: existing
        if: steps.authorization.outputs.authorized == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployments="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=20&teamId=$VERCEL_ORG_ID")"
          if printf '%s' "$deployments" | jq -e --arg sha "$(git rev-parse HEAD)" 'any(.deployments[]?.meta?.githubCommitSha == $sha)' >/dev/null; then
            echo 'already_deployed=true' >> "$GITHUB_OUTPUT"
            echo "Exact SHA $(git rev-parse HEAD) is already deployed to production; idempotent skip."
          else
            echo 'already_deployed=false' >> "$GITHUB_OUTPUT"
            echo "Exact SHA $(git rev-parse HEAD) is not yet deployed; continuing."
          fi

      - name: Capture Vercel state before deploy
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" > /tmp/vercel-before.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' /tmp/vercel-before.json

      - name: Setup Bun
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install exact repository dependencies
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        run: bunx prisma generate

      - name: TypeScript gate
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Release architecture invariants
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        run: bun test tests/release-architecture.test.ts

      - name: Venture OS heartbeat contract gate
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        env:
          DATABASE_URL: ''
        run: |
          set -euo pipefail
          bun test tests/venture-os-v2.test.ts tests/architecture-control-plane.test.ts tests/venture-os-integration.test.ts tests/db-runtime-policy.test.ts tests/owner-bootstrap-security.test.ts

      - name: Production build gate
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        env:
          VERCEL_ENV: production
        run: bun run build

      - name: Deploy exact authorized main SHA to Production
        id: vercel-deploy
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GIT_MESSAGE: ${{ github.event.head_commit.message || 'Controlled production release' }}
          GIT_ACTOR: ${{ github.actor }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          short_msg="$(printf '%s\n' "$GIT_MESSAGE" | head -n1)"
          output="$(bunx vercel@$VERCEL_CLI_VERSION deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            --build-env AGENT007_RELEASE_SCHEMA_RECONCILE=1 \
            -m githubCommitAuthorName=antoniocan2022-dev \
            -m githubCommitMessage="$short_msg" \
            -m githubCommitOrg=antoniocan2022-dev \
            -m githubCommitRef=main \
            -m githubCommitRepo=agent007-ai \
            -m githubCommitSha="$(git rev-parse HEAD)" \
            -m githubDeployment=1 \
            -m githubOrg=antoniocan2022-dev \
            -m githubRepo=agent007-ai \
            -m githubCommitAuthorLogin="$GIT_ACTOR" 2>&1)"
          printf '%s\n' "$output"
          deployment_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed exact release to: $deployment_url"

      - name: Resolve deployed URL for verification
        id: deployment-url
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        run: |
          set -euo pipefail
          test -n "${{ steps.vercel-deploy.outputs.deployment_url }}"

      - name: Verify exact Vercel deployment identity
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="${{ steps.vercel-deploy.outputs.deployment_url }}"
          deployment_host="${deployment_url#https://}"
          deployment_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID")"
          printf '%s\n' "$deployment_json" | jq '{id,name,url,state,readyState,target,meta:{githubCommitSha:.meta.githubCommitSha,githubCommitRef:.meta.githubCommitRef,githubCommitRepo:.meta.githubCommitRepo},alias}'
          test "$(jq -r '.readyState // .state // "UNKNOWN"' <<<"$deployment_json")" = READY
          test "$(jq -r '.target // .targets[0] // "null"' <<<"$deployment_json")" = production
          test "$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$deployment_json")" = "$(git rev-parse HEAD)"
          test "$(jq -r '.meta.githubCommitRef // .gitSource.ref // .gitMetadata.commitRef // ""' <<<"$deployment_json")" = main
          test "$(jq -r '.meta.githubCommitRepo // .gitSource.repo // .gitMetadata.repo // ""' <<<"$deployment_json")" = agent007-ai

      - name: Verify deployed artifact health
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_deployed != 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.vercel-deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --max-time 20 --write-out '\nHTTP_STATUS=%{http_code}' "${DEPLOYMENT_URL}/api/release-health")"
            body="${response%HTTP_STATUS=*}"
            status="${response##*HTTP_STATUS=}"
            echo "$response"
            if [ "$status" = 200 ] && printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q "\"releaseCommit\":\"$(git rev-parse HEAD)\""; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verify canonical Production health and exact release identity
        if: steps.authorization.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --max-time 20 --write-out '\nHTTP_STATUS=%{http_code}' "https://agent007-ai.vercel.app/api/release-health")"
            body="${response%HTTP_STATUS=*}"
            status="${response##*HTTP_STATUS=}"
            echo "$response"
            if [ "$status" = 200 ] && printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q "\"releaseCommit\":\"$(git rev-parse HEAD)\""; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verify immediate production error surface
        if: steps.authorization.outputs.authorized == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          log_output="$(bunx vercel@$VERCEL_CLI_VERSION logs --environment production --level error --since 5m --limit 50 --token "$VERCEL_TOKEN" 2>&1 || true)"
          echo "$log_output"
          if printf '%s' "$log_output" | grep -Eiq '(error|fatal)'; then exit 1; fi

      - name: Final Vercel state snapshot
        if: always() && steps.authorization.outputs.authorized == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          curl --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" > /tmp/vercel-after.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' /tmp/vercel-after.json
