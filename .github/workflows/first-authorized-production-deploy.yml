name: First Authorized Production Deploy

# Legacy release workflow retained for emergency/manual use only.
# The canonical push-triggered production release path is vercel-release-gate.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify controlled deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          test "$(jq -r 'has("crons") and ((.crons // []) | length > 0)' vercel.json)" = false
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Production build gate
        env:
          VERCEL_ENV: production
        run: bun run build

      - name: Deploy exact main commit to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bunx vercel@59.1.3 deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
