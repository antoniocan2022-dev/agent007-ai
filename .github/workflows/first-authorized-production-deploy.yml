name: First Authorized Production Deploy

on:
  push:
    branches: [main]
    paths:
      - release/agent007-first-production-deploy.marker

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify controlled deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          test "$(jq -r 'has("crons") and ((.crons // []) | length > 0)' vercel.json)" = false
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Capture Vercel state before deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/vercel-before.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' /tmp/vercel-before.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: TypeScript gate
        run: bunx tsc -p tsconfig.ci.json --noEmit

      - name: Production build gate
        env:
          VERCEL_ENV: production
        run: bun run build

      - name: Deploy exact checked-out commit to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bun add --global vercel@latest
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Verify Production deployment state
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            project="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
            state="$(jq -r '.latestDeployment.readyState // "UNKNOWN"' <<<"$project")"
            target="$(jq -r '.latestDeployment.target // "null"' <<<"$project")"
            echo "attempt=$attempt state=$state target=$target"
            if [ "$state" = READY ] && [ "$target" = production ]; then
              exit 0
            fi
            if [ "$state" = ERROR ] || [ "$state" = CANCELED ]; then
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify release health and runtime errors
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          project="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          domain="$(jq -r '.domains[0] // empty' <<<"$project")"
          test -n "$domain"
          curl --fail-with-body --silent --show-error "https://$domain/api/release-health" -o /tmp/release-health.raw || true
          python3 - <<'PY'
from pathlib import Path
raw = Path('/tmp/release-health.raw').read_text(encoding='utf-8', errors='replace')
if not raw.strip():
    raise SystemExit('release-health returned an empty response')
print(raw[:4000])
PY

      - name: Final Vercel state snapshot
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          curl --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            > /tmp/vercel-after.json
          jq '{id,name,live,latestDeployment,domains,framework,nodeVersion}' /tmp/vercel-after.json
