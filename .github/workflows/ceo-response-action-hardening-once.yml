name: CEO Response Action Hardening (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Propagate authoritative response action
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ceo-cognitive-lifecycle.ts')
          text = p.read_text()
          marker = "composeCeoResponse({ content:"
          count = text.count(marker)
          if count == 0:
              raise SystemExit('No canonical composeCeoResponse lifecycle calls found')
          replacement = "composeCeoResponse({ responseAction: request.decisionContract?.responseAction, content:"
          text = text.replace(marker, replacement)
          if text.count(replacement) != count:
              raise SystemExit('Response-action propagation count mismatch')
          p.write_text(text)

          test = Path('tests/ceo-response-contract.test.ts')
          t = test.read_text()
          if "composeCeoResponse" not in t:
              t = t.replace("import { finalizeCeoResponse, assertFinalResponseInvariant } from '../src/lib/ceo-response-finalizer'", "import { finalizeCeoResponse, assertFinalResponseInvariant } from '../src/lib/ceo-response-finalizer'\nimport { composeCeoResponse } from '../src/lib/ceo-response-composer'")
              t += "\n\ndescribe('CEO response action propagation', () => {\n  test('composeCeoResponse preserves the authoritative response action in final provenance', () => {\n    const localQuality: QualityResult = { ...quality, reasons: ['accepted'] }\n    const content = composeCeoResponse({ content: 'A concrete recommendation.', quality: localQuality, evidenceState: 'NOT_APPLICABLE', degraded: false, responseAction: 'recommend' })\n    expect(content).toBe('A concrete recommendation.')\n    expect(localQuality.finalResponseProvenance?.responseAction).toBe('recommend')\n  })\n})\n"
              test.write_text(t)

          Path('.github/workflows/ceo-response-action-hardening-once.yml').unlink()
          PY
          git diff --check
      - name: Commit hardened lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ceo-cognitive-lifecycle.ts tests/ceo-response-contract.test.ts .github/workflows/ceo-response-action-hardening-once.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(ceo): preserve response action through lifecycle finalization [skip ci]"
          git push origin HEAD:main
