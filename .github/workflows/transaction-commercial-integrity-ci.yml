name: Transaction Commercial Integrity CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'integration/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  transaction-commercial-integrity:
    name: Transaction / commercial database integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_test
      NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret
      OWNER_EMAIL: ci-owner@example.com
      SEED_EMAIL: ci-owner@example.com
      OWNER_BOOTSTRAP_PASSWORD: ci-only-strong-bootstrap-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent007_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent007_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate Prisma client
        run: bunx prisma generate

      - name: Prepare isolated PostgreSQL schema
        run: bunx prisma db push --skip-generate

      - name: Reconcile production schema contract locally
        run: bun run db:reconcile

      - name: Verify Transaction.customerId semantics
        run: bun test tests/transaction-customer-schema.integration.test.ts

      - name: Run Mission → Money, invoice settlement, and KPI reconciliation integration suite
        run: bun test tests/commercial-database-integration.test.ts

      - name: TypeScript check
        run: bunx tsc -p tsconfig.ci.json --noEmit
