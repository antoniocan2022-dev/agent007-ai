name: Agent007 Production Release Watchdog
run-name: Authorized production release · ${{ inputs.release_sha || github.sha }}

# Permanent production authority: this workflow is the only repository path
# that can deploy or promote production. Git pushes never authorize release.
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type DEPLOY_AGENT007_MAIN to authorize production
        required: true
        type: string
      release_sha:
        description: Exact GitHub main SHA to release
        required: true
        type: string
      existing_deployment_id:
        description: Optional READY Vercel deployment ID to promote instead of building
        required: false
        default: ''
        type: string
      existing_deployment_sha:
        description: Required source SHA for an existing deployment
        required: false
        default: ''
        type: string
      previous_deployment_ids:
        description: Optional comma-separated legacy production deployment IDs that must receive zero fresh traffic
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agent007-production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59.3.0
  PRODUCTION_URL: https://agent007-ai.vercel.app
  PRODUCTION_SCOPE: ${{ secrets.VERCEL_ORG_ID }}
  CANONICAL_WORKFLOW: production-release-watchdog.yml

jobs:
  production-release:
    if: ${{ inputs.authorization == 'DEPLOY_AGENT007_MAIN' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout exact authorized SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Bun 1.3.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Establish immutable release identity
        id: release
        shell: bash
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$RELEASE_SHA_INPUT"
          test "$sha" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA Autonomy CI and Heartbeat
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push&per_page=100")"
            autonomy_id="$(jq -r '.workflow_runs[] | select(.name == "Agent007 Autonomy CI") | .id' <<<"$runs" | head -n1)"
            heartbeat_id="$(jq -r '.workflow_runs[] | select(.name == "Venture OS 24x7 Heartbeat") | .id' <<<"$runs" | head -n1)"
            autonomy="$(test -n "$autonomy_id" && gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${autonomy_id}" --jq '.conclusion // ""' || true)"
            heartbeat="$(test -n "$heartbeat_id" && gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${heartbeat_id}" --jq '.conclusion // ""' || true)"
            echo "Attempt $attempt/60 — Autonomy=${autonomy:-pending}; Heartbeat=${heartbeat:-pending}"
            if [ "$autonomy" = success ] && [ "$heartbeat" = success ]; then exit 0; fi
            if [[ "$autonomy" =~ ^(failure|cancelled|timed_out|action_required|startup_failure|stale)$ ]] || [[ "$heartbeat" =~ ^(failure|cancelled|timed_out|action_required|startup_failure|stale)$ ]]; then exit 1; fi
            sleep 10
          done
          exit 1

      - name: Verify permanent production-release authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW" = "Agent007 Production Release Watchdog"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$CANONICAL_WORKFLOW" = "production-release-watchdog.yml"
          bun test tests/release-architecture.test.ts

      - name: Verify Vercel credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Snapshot production aliases before cutover
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          : > production-alias-snapshot.jsonl
          for domain in agent007-ai.vercel.app agent007-ai-antoniocan2022-devs-projects.vercel.app; do
            body="$(curl --fail-with-body --silent --show-error --max-time 15 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v4/aliases/$domain?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")"
            jq -c --arg domain "$domain" '{domain:$domain, alias:(.alias // null), projectId:(.projectId // null), deploymentId:(.deploymentId // null)}' <<<"$body" | tee -a production-alias-snapshot.jsonl
          done

      - name: Validate or build immutable target deployment
        id: target
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_DEPLOYMENT_ID_INPUT: ${{ inputs.existing_deployment_id }}
          TARGET_DEPLOYMENT_SHA_INPUT: ${{ inputs.existing_deployment_sha }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET_DEPLOYMENT_ID_INPUT" ]; then
            test "$TARGET_DEPLOYMENT_SHA_INPUT" = "$RELEASE_SHA"
            body="$(curl --fail-with-body --silent --show-error --max-time 15 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$TARGET_DEPLOYMENT_ID_INPUT?teamId=$VERCEL_ORG_ID")"
            test "$(jq -r '.readyState // .state // ""' <<<"$body")" = READY
            test "$(jq -r '.target // .targets[0] // ""' <<<"$body")" = production
            test "$(jq -r '.meta.githubCommitRepo // .gitSource.repo // .gitMetadata.repo // ""' <<<"$body")" = agent007-ai
            test "$(jq -r '.meta.githubCommitRef // .gitSource.ref // .gitMetadata.commitRef // ""' <<<"$body")" = main
            test "$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$body")" = "$RELEASE_SHA"
            url="https://$(jq -r '.url' <<<"$body")"
          else
            output="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" \
              -m githubCommitAuthorName=antoniocan2022-dev \
              -m githubCommitMessage="authorized production deployment" \
              -m githubCommitOrg=antoniocan2022-dev \
              -m githubCommitRef=main \
              -m githubCommitRepo=agent007-ai \
              -m githubCommitSha="$RELEASE_SHA" \
              -m githubDeployment=1 \
              -m githubOrg=antoniocan2022-dev \
              -m githubRepo=agent007-ai 2>&1)"
            printf '%s\n' "$output"
            url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n1)"
            test -n "$url"
          fi
          host="${url#https://}"
          for attempt in $(seq 1 36); do
            body="$(curl --fail-with-body --silent --show-error --max-time 15 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID")"
            state="$(jq -r '.readyState // .state // ""' <<<"$body")"
            echo "Target deployment state: $state"
            if [ "$state" = READY ]; then
              id="$(jq -r '.id // .uid // ""' <<<"$body")"
              sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$body")"
              test "$id" = "${TARGET_DEPLOYMENT_ID_INPUT:-$id}"
              test "$sha" = "$RELEASE_SHA"
              echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
              echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$state" != ERROR ] || exit 1
            sleep 5
          done
          exit 1

      - name: Reconcile canonical production aliases
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for domain in agent007-ai.vercel.app agent007-ai-antoniocan2022-devs-projects.vercel.app; do
            curl --fail-with-body --silent --show-error --max-time 20 \
              --request POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v2/deployments/$TARGET_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
              --data "{\"alias\":\"$domain\",\"redirect\":null}" >/dev/null
          done

      - name: Verify alias state with explicit failure states
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
        run: |
          set -euo pipefail
          owners=()
          for domain in agent007-ai.vercel.app agent007-ai-antoniocan2022-devs-projects.vercel.app; do
            body="$(curl --fail-with-body --silent --show-error --max-time 15 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v4/aliases/$domain?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")"
            alias_name="$(jq -r '.alias // ""' <<<"$body")"
            owner="$(jq -r '.deploymentId // ""' <<<"$body")"
            project="$(jq -r '.projectId // ""' <<<"$body")"
            echo "$domain: owner=$owner project=$project"
            [ "$alias_name" = "$domain" ] || { echo 'STALE_ALIAS'; exit 44; }
            [ "$project" = "$VERCEL_PROJECT_ID" ] || { echo 'STALE_ALIAS'; exit 44; }
            owners+=("$owner")
          done
          if [ "${owners[0]}" != "${owners[1]}" ]; then echo 'DUAL_ALIAS_CONFLICT'; exit 45; fi
          if [ "${owners[0]}" != "$TARGET_DEPLOYMENT_ID" ]; then echo 'STALE_ALIAS'; exit 44; fi

      # Architecture 7: traffic ownership is the first production proof.
      - name: Generate protected /api/agent traffic canary
        id: traffic_canary
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
          TARGET_DEPLOYMENT_URL: ${{ steps.target.outputs.deployment_url }}
        run: |
          set -euo pipefail
          conversation_id="release-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="{\"message\":\"Agent007 production traffic canary. Reply with OK only.\",\"conversationId\":\"$conversation_id\",\"attachments\":[],\"language\":\"en\"}"
          npx --yes vercel@$VERCEL_CLI_VERSION curl /api/agent --deployment "$TARGET_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" -- \
            --request POST --header 'Content-Type: application/json' --data "$payload" > agent-canary.txt
          node <<'NODE'
          const fs = require('node:fs')
          const expectedSha = process.env.EXPECTED_RELEASE_SHA
          const targetId = process.env.TARGET_DEPLOYMENT_ID
          const text = fs.readFileSync('agent-canary.txt', 'utf8')
          const dataLines = text.split(/\r?\n/).filter(line => line.startsWith('data: ')).map(line => line.slice(6)).filter(Boolean)
          if (dataLines.length === 0) throw new Error('TRAFFIC_OWNERSHIP_UNPROVEN: no SSE data envelopes')
          for (const line of dataLines) {
            let envelope
            try { envelope = JSON.parse(line) } catch { throw new Error('TRAFFIC_OWNERSHIP_UNPROVEN: invalid SSE JSON envelope') }
            if (!Object.prototype.hasOwnProperty.call(envelope, 'deploymentId') || !Object.prototype.hasOwnProperty.call(envelope, 'releaseCommit')) throw new Error('TRAFFIC_OWNERSHIP_UNPROVEN: missing deployment identity in SSE envelope')
            if (envelope.deploymentId !== targetId) throw new Error(`TRAFFIC_OWNERSHIP_UNPROVEN: deployment ${envelope.deploymentId} != ${targetId}`)
            if (envelope.releaseCommit !== expectedSha) throw new Error(`TRAFFIC_OWNERSHIP_UNPROVEN: release ${envelope.releaseCommit} != ${expectedSha}`)
          }
          if (!text.includes('event: done')) throw new Error('TRAFFIC_OWNERSHIP_UNPROVEN: done event missing')
          NODE
          echo "conversation_id=$conversation_id" >> "$GITHUB_OUTPUT"

      - name: Verify fresh traffic ownership and legacy runtime exclusion
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
          CANARY_CONVERSATION_ID: ${{ steps.traffic_canary.outputs.conversation_id }}
          PREVIOUS_DEPLOYMENT_IDS: ${{ inputs.previous_deployment_ids }}
        run: |
          set -euo pipefail
          sleep 15
          logs="$(npx --yes vercel@$VERCEL_CLI_VERSION logs "$PRODUCTION_URL" --environment production --since 2m --limit 300 --token "$VERCEL_TOKEN" 2>&1 || true)"
          printf '%s\n' "$logs" | tee production-traffic-proof.log
          target_count="$(printf '%s' "$logs" | grep -o "$TARGET_DEPLOYMENT_ID" | wc -l | tr -d ' ')"
          canary_count="$(printf '%s' "$logs" | grep -o "$CANARY_CONVERSATION_ID" | wc -l | tr -d ' ')"
          if [ "$target_count" -eq 0 ] && [ "$canary_count" -eq 0 ]; then echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; fi
          IFS=',' read -r -a legacy_ids <<< "$PREVIOUS_DEPLOYMENT_IDS"
          for legacy in "${legacy_ids[@]}"; do
            [ -n "$legacy" ] || continue
            legacy_count="$(printf '%s' "$logs" | grep -o "$legacy" | wc -l | tr -d ' ')"
            if [ "$legacy_count" -ne 0 ]; then echo "LEGACY_RUNTIME: $legacy"; exit 47; fi
          done

      # Architecture 9: broader SHA/fingerprint proof remains after traffic proof.
      - name: Verify release health and broader SHA/fingerprint proof
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          deployment_host="${{ steps.target.outputs.deployment_url }}"; deployment_host="${deployment_host#https://}"
          deployment_json="$(curl --fail-with-body --silent --show-error --max-time 15 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID")"
          test "$(jq -r '.readyState // .state // ""' <<<"$deployment_json")" = READY
          test "$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$deployment_json")" = "$EXPECTED_RELEASE_SHA"
          body="$(curl --silent --show-error --max-time 45 "$PRODUCTION_URL/api/release-health")"
          test "$(jq -r '.ok' <<<"$body")" = true
          test "$(jq -r '.deploymentId' <<<"$body")" = "$TARGET_DEPLOYMENT_ID"
          test "$(jq -r '.releaseCommit' <<<"$body")" = "$EXPECTED_RELEASE_SHA"
          test "$(jq -r '.proof.tripleProof' <<<"$body")" = true
          test "$(jq -r '.proof.deploymentIdentityVerified' <<<"$body")" = true
          test "$(jq -r '.actualExecution.verified' <<<"$body")" = true
          expected_graph="$(bun -e "import { organizationGraphFingerprint } from './src/lib/organization-graph-fingerprint'; console.log(organizationGraphFingerprint())" | tail -n1)"
          test "$(jq -r '.organizationGraphFingerprint' <<<"$body")" = "$expected_graph"

      - name: Verify immediate production error surface
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          logs="$(npx --yes vercel@$VERCEL_CLI_VERSION logs "$PRODUCTION_URL" --environment production --level error --since 5m --limit 100 --token "$VERCEL_TOKEN" 2>&1 || true)"
          echo "$logs"
          if printf '%s' "$logs" | grep -Eiq '(error|fatal)'; then exit 1; fi

      - name: Persist release evidence summary
        if: always()
        shell: bash
        run: |
          echo "Authorized SHA: ${{ steps.release.outputs.sha }}"
          echo "Deployment: ${{ steps.target.outputs.deployment_id }}"
          echo "Production URL: $PRODUCTION_URL"
          echo "Traffic proof conversation: ${{ steps.traffic_canary.outputs.conversation_id }}"
