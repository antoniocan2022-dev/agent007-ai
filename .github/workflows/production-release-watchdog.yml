name: Agent007 Production Release Watchdog
run-name: Authorized production release · ${{ github.sha }}

# Production deployment is intentionally MANUAL and authorization-gated.
# A push to main never deploys to Vercel by itself.
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type DEPLOY_AGENT007_MAIN to authorize the current main commit for production
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: agent007-production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59.3.0
  PRODUCTION_URL: https://agent007-ai.vercel.app

jobs:
  production-release:
    if: ${{ inputs.authorization == 'DEPLOY_AGENT007_MAIN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main exactly
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js 24 for release tooling
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Establish exact release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Authorized production release SHA: $sha"

      - name: Verify required release credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Verify exact main CI commit before deployment
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Deployment is authorized only for main SHA $RELEASE_SHA."
          test -n "$RELEASE_SHA"

      - name: Deterministic Vercel production deployment
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          output="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy \
            --prod --yes --token "$VERCEL_TOKEN" \
            -m githubCommitAuthorName=antoniocan2022-dev \
            -m githubCommitMessage="authorized production deployment" \
            -m githubCommitOrg=antoniocan2022-dev \
            -m githubCommitRef=main \
            -m githubCommitRepo=agent007-ai \
            -m githubCommitSha="$RELEASE_SHA" \
            -m githubDeployment=1 \
            -m githubOrg=antoniocan2022-dev \
            -m githubRepo=agent007-ai 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify exact deployment identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          deployment_host="${{ steps.deploy.outputs.deployment_url }}"
          deployment_host="${deployment_host#https://}"
          deployment_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID")"
          test "$(jq -r '.readyState // .state' <<<"$deployment_json")" = READY
          test "$(jq -r '.target // .targets[0] // "null"' <<<"$deployment_json")" = production
          test "$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$deployment_json")" = "$RELEASE_SHA"
          test "$(jq -r '.meta.githubCommitRef // .gitSource.ref // .gitMetadata.commitRef // ""' <<<"$deployment_json")" = main
          test "$(jq -r '.meta.githubCommitRepo // .gitSource.repo // .gitMetadata.repo // ""' <<<"$deployment_json")" = agent007-ai

      - name: Compute expected organization graph fingerprint
        id: graph
        shell: bash
        run: |
          set -euo pipefail
          bunx --bun tsx -e "import { organizationGraphFingerprint } from './src/lib/organization-graph-fingerprint'; console.log(organizationGraphFingerprint())" > /tmp/expected-org-fingerprint
          fingerprint="$(tail -n 1 /tmp/expected-org-fingerprint)"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Verify canonical production exact SHA and organization graph
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          EXPECTED_GRAPH_FINGERPRINT: ${{ steps.graph.outputs.fingerprint }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error --max-time 30 "$PRODUCTION_URL/api/release-health")"
            echo "$body"
            if printf '%s' "$body" | grep -q '"ok":true' \
              && printf '%s' "$body" | grep -q "\"releaseCommit\":\"$RELEASE_SHA\"" \
              && printf '%s' "$body" | grep -q "\"organizationGraphFingerprint\":\"$EXPECTED_GRAPH_FINGERPRINT\""; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not report the exact release SHA and canonical organization graph fingerprint." >&2
          exit 1

      - name: Verify immediate production error surface
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          log_output="$(npx --yes vercel@$VERCEL_CLI_VERSION logs --environment production --level error --since 5m --limit 50 --token "$VERCEL_TOKEN" 2>&1 || true)"
          echo "$log_output"
          if printf '%s' "$log_output" | grep -Eiq '(error|fatal)'; then exit 1; fi

      - name: Post deployment release summary
        if: always()
        shell: bash
        run: |
          echo "Authorized release SHA: ${{ steps.release.outputs.sha }}"
          echo "Deployment URL: ${{ steps.deploy.outputs.deployment_url }}"
          echo "Production URL: $PRODUCTION_URL"
