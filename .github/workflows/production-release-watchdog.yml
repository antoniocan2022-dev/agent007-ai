name: Agent007 Production Release Watchdog
run-name: Production release watchdog · ${{ github.sha }}

# Single release-control contract:
# 1) Vercel Git is the primary production executor for main.
# 2) This workflow proves the exact main SHA reached Production.
# 3) If Vercel Git has not produced the exact SHA within the recovery window,
#    GitHub Actions becomes the deterministic fallback executor.
# 4) The canonical production health endpoint must report the exact SHA.
# This removes the previous competing deployment workflows and makes the
# deployment path self-healing instead of relying on one fragile trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm production verification/recovery for main
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: agent007-production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59.3.0
  PRODUCTION_URL: https://agent007-ai.vercel.app

jobs:
  production-release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          fetch-depth: 1

      - name: Establish exact release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Exact release SHA: $sha"

      - name: Verify required release credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Wait for primary Vercel Git deployment of exact SHA
        id: primary
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            deployments="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=100&teamId=$VERCEL_ORG_ID")"
            deployment_url="$(printf '%s' "$deployments" | jq -r --arg sha "$RELEASE_SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha)] | sort_by(.created) | last | .url // empty')"
            if [ -n "$deployment_url" ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "deployment_url=https://$deployment_url" >> "$GITHUB_OUTPUT"
              echo "Primary Vercel deployment found for $RELEASE_SHA: https://$deployment_url"
              exit 0
            fi
            sleep 10
          done
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "Primary Vercel Git deployment not observed for $RELEASE_SHA within recovery window."

      - name: Deterministic Vercel fallback deployment
        id: fallback
        if: steps.primary.outputs.found != 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          output="$(bunx vercel@$VERCEL_CLI_VERSION deploy \
            --prod --yes --token "$VERCEL_TOKEN" \
            -m githubCommitAuthorName=antoniocan2022-dev \
            -m githubCommitMessage="controlled fallback deployment" \
            -m githubCommitOrg=antoniocan2022-dev \
            -m githubCommitRef=main \
            -m githubCommitRepo=agent007-ai \
            -m githubCommitSha="$RELEASE_SHA" \
            -m githubDeployment=1 \
            -m githubOrg=antoniocan2022-dev \
            -m githubRepo=agent007-ai 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment URL
        id: deployed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.primary.outputs.found }}" = "true" ]; then
            echo "url=${{ steps.primary.outputs.deployment_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.fallback.outputs.deployment_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact deployment identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          deployment_host="${{ steps.deployed.outputs.url }}"
          deployment_host="${deployment_host#https://}"
          deployment_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID")"
          test "$(jq -r '.readyState // .state' <<<"$deployment_json")" = READY
          test "$(jq -r '.target // .targets[0] // "null"' <<<"$deployment_json")" = production
          test "$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$deployment_json")" = "$RELEASE_SHA"
          test "$(jq -r '.meta.githubCommitRef // .gitSource.ref // .gitMetadata.commitRef // ""' <<<"$deployment_json")" = main
          test "$(jq -r '.meta.githubCommitRepo // .gitSource.repo // .gitMetadata.repo // ""' <<<"$deployment_json")" = agent007-ai

      - name: Verify canonical production exact SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --max-time 30 --write-out '\nHTTP_STATUS=%{http_code}' "$PRODUCTION_URL/api/release-health")"
            body="${response%HTTP_STATUS=*}"
            status="${response##*HTTP_STATUS=}"
            echo "$response"
            if [ "$status" = 200 ] && printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q "\"releaseCommit\":\"$RELEASE_SHA\""; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Verify immediate production error surface
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          log_output="$(bunx vercel@$VERCEL_CLI_VERSION logs --environment production --level error --since 5m --limit 50 --token "$VERCEL_TOKEN" 2>&1 || true)"
          echo "$log_output"
          if printf '%s' "$log_output" | grep -Eiq '(error|fatal)'; then exit 1; fi
