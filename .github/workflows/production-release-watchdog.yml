name: Agent007 Production Release Watchdog
run-name: Production release watchdog · ${{ github.sha }}

# Single production release-control contract:
# 1) GitHub Actions is the sole production executor for main.
# 2) Vercel Git deployments are intentionally disabled in vercel.json.
# 3) Every push to main (or an explicit manual run) deploys that exact SHA once.
# 4) The deployment identity and canonical production health endpoint must both
#    prove that the exact main SHA reached Production.
#
# IMPORTANT: This workflow is intentionally NOT scheduled. A five-minute
# schedule combined with a disabled Vercel Git deployment would repeatedly
# wait for a deployment that can never appear, then create repeated fallback
# deployments and failure emails. Release verification belongs on a release
# event; continuous health monitoring, if needed later, must be a read-only
# workflow that never creates deployments.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm production deployment and verification for main
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent007-production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59.3.0
  PRODUCTION_URL: https://agent007-ai.vercel.app

jobs:
  production-release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main release source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js 24 for release tooling
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Establish exact release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Exact main release SHA: $sha"

      - name: Verify required release credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Deterministic Vercel production deployment
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          output="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy \
            --prod --yes --token "$VERCEL_TOKEN" \
            -m githubCommitAuthorName=antoniocan2022-dev \
            -m githubCommitMessage="controlled production deployment" \
            -m githubCommitOrg=antoniocan2022-dev \
            -m githubCommitRef=main \
            -m githubCommitRepo=agent007-ai \
            -m githubCommitSha="$RELEASE_SHA" \
            -m githubDeployment=1 \
            -m githubOrg=antoniocan2022-dev \
            -m githubRepo=agent007-ai 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify exact deployment identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          deployment_host="${{ steps.deploy.outputs.deployment_url }}"
          deployment_host="${deployment_host#https://}"
          deployment_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID")"
          test "$(jq -r '.readyState // .state' <<<"$deployment_json")" = READY
          test "$(jq -r '.target // .targets[0] // "null"' <<<"$deployment_json")" = production
          test "$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$deployment_json")" = "$RELEASE_SHA"
          test "$(jq -r '.meta.githubCommitRef // .gitSource.ref // .gitMetadata.commitRef // ""' <<<"$deployment_json")" = main
          test "$(jq -r '.meta.githubCommitRepo // .gitSource.repo // .gitMetadata.repo // ""' <<<"$deployment_json")" = agent007-ai

      - name: Verify canonical production exact SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --max-time 30 --write-out '\nHTTP_STATUS=%{http_code}' "$PRODUCTION_URL/api/release-health")"
            body="${response%HTTP_STATUS=*}"
            status="${response##*HTTP_STATUS=}"
            echo "$response"
            if [ "$status" = 200 ] && printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q "\"releaseCommit\":\"$RELEASE_SHA\""; then exit 0; fi
            sleep 5
          done
          echo "Production did not report the exact release SHA: $RELEASE_SHA" >&2
          exit 1

      - name: Verify immediate production error surface
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          log_output="$(npx --yes vercel@$VERCEL_CLI_VERSION logs --environment production --level error --since 5m --limit 50 --token "$VERCEL_TOKEN" 2>&1 || true)"
          echo "$log_output"
          if printf '%s' "$log_output" | grep -Eiq '(error|fatal)'; then exit 1; fi

      - name: Post deployment release summary
        if: always()
        shell: bash
        run: |
          echo "Release SHA: ${{ steps.release.outputs.sha }}"
          echo "Deployment URL: ${{ steps.deploy.outputs.deployment_url }}"
          echo "Production URL: $PRODUCTION_URL"
