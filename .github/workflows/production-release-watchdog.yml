name: Agent007 Production Release Watchdog
run-name: Authorized production release · ${{ inputs.release_sha }}

# Permanent production authority: this is the only repository workflow allowed
# to deploy or promote production. Git pushes never authorize production.
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type DEPLOY_AGENT007_MAIN to authorize production
        required: true
        type: string
      release_sha:
        description: Exact GitHub main SHA to release
        required: true
        type: string
      existing_deployment_id:
        description: Optional READY production deployment to promote instead of rebuilding
        required: false
        default: ''
        type: string
      existing_deployment_sha:
        description: Required source SHA for an existing deployment
        required: false
        default: ''
        type: string
      previous_deployment_ids:
        description: Optional comma-separated legacy production deployment IDs that must receive zero traffic
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agent007-production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_CLI_VERSION: 59.3.0
  PRODUCTION_URL: https://agent007-ai.vercel.app

jobs:
  production-release:
    if: ${{ inputs.authorization == 'DEPLOY_AGENT007_MAIN' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout exact authorized main SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Bun 1.3.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Establish immutable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.release_sha }}"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "${{ inputs.release_sha }}"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_sha" = "$main_sha"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA CI gates
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push&per_page=100")"
            autonomy_id="$(jq -r '.workflow_runs[] | select(.name == "Agent007 Autonomy CI") | .id' <<<"$runs" | head -n1)"
            heartbeat_id="$(jq -r '.workflow_runs[] | select(.name == "Venture OS 24x7 Heartbeat") | .id' <<<"$runs" | head -n1)"
            autonomy="$(if [ -n "$autonomy_id" ]; then gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${autonomy_id}" --jq '.conclusion // ""'; fi)"
            heartbeat="$(if [ -n "$heartbeat_id" ]; then gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${heartbeat_id}" --jq '.conclusion // ""'; fi)"
            echo "Attempt $attempt/60 — Autonomy=${autonomy:-pending}; Heartbeat=${heartbeat:-pending}"
            if [ "$autonomy" = success ] && [ "$heartbeat" = success ]; then exit 0; fi
            if [[ "$autonomy" =~ ^(failure|cancelled|timed_out|action_required|startup_failure|stale)$ ]] || [[ "$heartbeat" =~ ^(failure|cancelled|timed_out|action_required|startup_failure|stale)$ ]]; then
              echo 'CI_GATE_FAILED'
              exit 1
            fi
            sleep 10
          done
          echo 'CI_GATE_TIMEOUT'
          exit 1

      - name: Verify release architecture before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_WORKFLOW" = 'Agent007 Production Release Watchdog'
          test -f .github/workflows/production-release-watchdog.yml
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          bun test tests/release-architecture.test.ts

      - name: Snapshot production alias ownership
        shell: bash
        run: |
          set -euo pipefail
          for domain in agent007-ai.vercel.app agent007-ai-antoniocan2022-devs-projects.vercel.app; do
            curl --fail-with-body --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v4/aliases/$domain?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" \
              | jq -c --arg domain "$domain" '{domain:$domain,alias:(.alias // null),projectId:(.projectId // null),deploymentId:(.deploymentId // null)}'
          done

      - name: Validate or build immutable production target
        id: target
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          EXISTING_DEPLOYMENT_ID: ${{ inputs.existing_deployment_id }}
          EXISTING_DEPLOYMENT_SHA: ${{ inputs.existing_deployment_sha }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_DEPLOYMENT_ID" ]; then
            test "$EXISTING_DEPLOYMENT_SHA" = "$RELEASE_SHA"
            body="$(curl --fail-with-body --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$EXISTING_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
            test "$(jq -r '.readyState // .state // ""' <<<"$body")" = READY
            test "$(jq -r '.target // .targets[0] // ""' <<<"$body")" = production
            test "$(jq -r '.meta.githubCommitRepo // .gitSource.repo // .gitMetadata.repo // ""' <<<"$body")" = agent007-ai
            test "$(jq -r '.meta.githubCommitRef // .gitSource.ref // .gitMetadata.commitRef // ""' <<<"$body")" = main
            test "$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$body")" = "$RELEASE_SHA"
            deployment_id="$EXISTING_DEPLOYMENT_ID"
            deployment_url="https://$(jq -r '.url' <<<"$body")"
            npx --yes vercel@$VERCEL_CLI_VERSION promote "$deployment_id" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/vercel-promote.log 2>&1 || {
              if ! grep -Eqi 'already.*current.*production' /tmp/vercel-promote.log; then cat /tmp/vercel-promote.log; exit 1; fi
            }
          else
            output="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" \
              -m githubCommitAuthorName=antoniocan2022-dev \
              -m githubCommitMessage='authorized production deployment' \
              -m githubCommitOrg=antoniocan2022-dev \
              -m githubCommitRef=main \
              -m githubCommitRepo=agent007-ai \
              -m githubCommitSha="$RELEASE_SHA" \
              -m githubDeployment=1 \
              -m githubOrg=antoniocan2022-dev \
              -m githubRepo=agent007-ai 2>&1)"
            printf '%s\n' "$output"
            deployment_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n1)"
            test -n "$deployment_url"
            deployment_id=""
          fi
          host="${deployment_url#https://}"
          for attempt in $(seq 1 36); do
            body="$(curl --fail-with-body --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID")"
            state="$(jq -r '.readyState // .state // ""' <<<"$body")"
            echo "Target state: $state"
            if [ "$state" = READY ]; then
              resolved_id="$(jq -r '.id // .uid // ""' <<<"$body")"
              resolved_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$body")"
              test "$resolved_sha" = "$RELEASE_SHA"
              echo "deployment_id=${deployment_id:-$resolved_id}" >> "$GITHUB_OUTPUT"
              echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$state" != ERROR ] || { echo 'DEPLOYMENT_BUILD_FAILED'; exit 1; }
            sleep 5
          done
          echo 'DEPLOYMENT_READY_TIMEOUT'
          exit 1

      - name: Reconcile canonical production aliases
        shell: bash
        env:
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for domain in agent007-ai.vercel.app agent007-ai-antoniocan2022-devs-projects.vercel.app; do
            curl --fail-with-body --silent --show-error --max-time 20 \
              --request POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v2/deployments/$TARGET_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
              --data "{\"alias\":\"$domain\",\"redirect\":null}" >/dev/null
          done

      - name: Verify alias ownership and legacy exclusion
        shell: bash
        env:
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
          LEGACY_IDS: ${{ inputs.previous_deployment_ids }}
        run: |
          set -euo pipefail
          owners=()
          for domain in agent007-ai.vercel.app agent007-ai-antoniocan2022-devs-projects.vercel.app; do
            body="$(curl --fail-with-body --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v4/aliases/$domain?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")"
            alias_name="$(jq -r '.alias // ""' <<<"$body")"
            project="$(jq -r '.projectId // ""' <<<"$body")"
            owner="$(jq -r '.deploymentId // ""' <<<"$body")"
            [ "$alias_name" = "$domain" ] || { echo 'STALE_ALIAS'; exit 44; }
            [ "$project" = "$VERCEL_PROJECT_ID" ] || { echo 'STALE_ALIAS'; exit 44; }
            owners+=("$owner")
          done
          [ "${owners[0]}" = "${owners[1]}" ] || { echo 'DUAL_ALIAS_CONFLICT'; exit 45; }
          [ "${owners[0]}" = "$TARGET_DEPLOYMENT_ID" ] || { echo 'STALE_ALIAS'; exit 44; }
          IFS=',' read -r -a legacy_ids <<< "$LEGACY_IDS"
          for legacy in "${legacy_ids[@]}"; do
            [ -n "$legacy" ] || continue
            [ "$legacy" != "$TARGET_DEPLOYMENT_ID" ] || continue
            echo "Legacy deployment must be checked for zero fresh production traffic: $legacy"
          done

      # Architecture 7: first-class proof is the real production URL, not a deployment URL.
      # Do NOT use `vercel curl` here. Vercel CLI 59.x can forward --token to its
      # embedded curl implementation, where it becomes an invalid curl option.
      - name: Generate production traffic canary
        id: traffic_canary
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
        run: |
          set -euo pipefail
          conversation_id="release-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="{\"message\":\"Agent007 production traffic canary. Reply with OK only.\",\"conversationId\":\"$conversation_id\",\"attachments\":[],\"language\":\"en\"}"
          curl --fail-with-body --silent --show-error --no-buffer --location \
            --connect-timeout 15 --max-time 180 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: text/event-stream' \
            --data "$payload" \
            "$PRODUCTION_URL/api/agent" > agent-canary.txt
          node <<'NODE'
          const fs = require('node:fs')
          const expectedSha = process.env.EXPECTED_RELEASE_SHA
          const targetId = process.env.TARGET_DEPLOYMENT_ID
          const text = fs.readFileSync('agent-canary.txt', 'utf8')
          const lines = text.split(/\r?\n/)
            .filter(line => line.startsWith('data: '))
            .map(line => line.slice(6))
            .filter(Boolean)
          if (!lines.length) throw new Error('TRAFFIC_OWNERSHIP_UNPROVEN: no SSE data envelopes')
          for (const line of lines) {
            let envelope
            try { envelope = JSON.parse(line) } catch { throw new Error('TRAFFIC_OWNERSHIP_UNPROVEN: invalid SSE JSON') }
            if (envelope.deploymentId !== targetId) throw new Error(`TRAFFIC_OWNERSHIP_UNPROVEN: ${envelope.deploymentId} != ${targetId}`)
            if (envelope.releaseCommit !== expectedSha) throw new Error(`TRAFFIC_OWNERSHIP_UNPROVEN: ${envelope.releaseCommit} != ${expectedSha}`)
          }
          if (!text.includes('event: done')) throw new Error('TRAFFIC_OWNERSHIP_UNPROVEN: done event missing')
          NODE
          echo "conversation_id=$conversation_id" >> "$GITHUB_OUTPUT"

      - name: Verify fresh traffic ownership and legacy runtime exclusion
        shell: bash
        env:
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
          CANARY_CONVERSATION_ID: ${{ steps.traffic_canary.outputs.conversation_id }}
          LEGACY_IDS: ${{ inputs.previous_deployment_ids }}
        run: |
          set -euo pipefail
          sleep 10
          logs="$(npx --yes vercel@$VERCEL_CLI_VERSION logs "$PRODUCTION_URL" --environment production --since 2m --limit 300 --token "$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$logs" > production-traffic-proof.log
          grep -q "$TARGET_DEPLOYMENT_ID" production-traffic-proof.log || { echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; }
          grep -q "$CANARY_CONVERSATION_ID" production-traffic-proof.log || { echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; }
          IFS=',' read -r -a legacy_ids <<< "$LEGACY_IDS"
          for legacy in "${legacy_ids[@]}"; do
            [ -n "$legacy" ] || continue
            [ "$legacy" = "$TARGET_DEPLOYMENT_ID" ] && continue
            if grep -q "$legacy" production-traffic-proof.log; then echo "LEGACY_RUNTIME: $legacy"; exit 47; fi
          done

      - name: Verify release health and broader SHA/fingerprint proof
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error --max-time 20 "$PRODUCTION_URL/api/release-health")"
          echo "$health" | jq .
          test "$(jq -r '.ok // false' <<<"$health")" = true
          test "$(jq -r '.releaseCommit // ""' <<<"$health")" = "$EXPECTED_RELEASE_SHA"
          test "$(jq -r '.deploymentId // ""' <<<"$health")" = "$TARGET_DEPLOYMENT_ID"
          test "$(jq -r '.proof.tripleProof // false' <<<"$health")" = true
          test "$(jq -r '.proof.deploymentIdentityVerified // false' <<<"$health")" = true
          test "$(jq -r '.proof.providerExecutionVerified // false' <<<"$health")" = true
          test -n "$(jq -r '.proof.organizationGraphFingerprint // ""' <<<"$health")"