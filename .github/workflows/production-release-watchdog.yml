name: Agent007 Production Release Watchdog
run-name: Authorized production release · ${{ inputs.release_sha || github.sha }}

# This is the single production deployer. Production may be released only by:
# 1) an explicit workflow_dispatch with DEPLOY_AGENT007_MAIN, or
# 2) the one-shot authorized release marker committed to main by the owner.
# The release marker is a pointer to an already-certified source SHA; deployment never
# treats the marker commit itself as the application release.
# Vercel Git auto-deployment remains disabled.
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type DEPLOY_AGENT007_MAIN to authorize production
        required: true
        type: string
      release_sha:
        description: Exact certified GitHub main SHA to release
        required: true
        type: string
      previous_deployment_ids:
        description: Optional comma-separated legacy production deployment IDs
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - .release/production-deploy.json

permissions:
  contents: read
  actions: read

concurrency:
  group: agent007-production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_CLI_VERSION: 59.3.0
  PRODUCTION_URL: https://agent007-ai.vercel.app

jobs:
  production-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.authorization == 'DEPLOY_AGENT007_MAIN') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'authorized production deployment')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout release pointer
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Bun 1.3.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Validate authorization and immutable release identity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          INPUT_AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          pointer_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$pointer_sha" = "$main_sha"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            source_sha="$INPUT_RELEASE_SHA"
            test "$INPUT_AUTHORIZATION" = "DEPLOY_AGENT007_MAIN"
            test -n "$source_sha"
          else
            test -f .release/production-deploy.json
            source_sha="$(jq -r '.sourceMainSha // ""' .release/production-deploy.json)"
            authorized="$(jq -r '.authorized // false' .release/production-deploy.json)"
            repository="$(jq -r '.repository // ""' .release/production-deploy.json)"
            ref_name="$(jq -r '.ref // ""' .release/production-deploy.json)"
            target="$(jq -r '.target // ""' .release/production-deploy.json)"
            expires_at="$(jq -r '.expiresAt // ""' .release/production-deploy.json)"
            jq -e '.authorization == "DEPLOY_AGENT007_MAIN"' .release/production-deploy.json >/dev/null
            test "$authorized" = true
            test "$repository" = "antoniocan2022-dev/agent007-ai"
            test "$ref_name" = "main"
            test "$target" = "production"
            test "$(git log -1 --pretty=%s)" = "authorized production deployment"
            expires_epoch="$(date -d "$expires_at" +%s 2>/dev/null || true)"
            test -n "$expires_epoch"
            test "$expires_epoch" -gt "$(date +%s)"
          fi

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/commits/${source_sha}" --jq .sha | grep -Fx "$source_sha" >/dev/null

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "pointer_sha=$pointer_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for all exact-SHA CI certification gates
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=(
            "Agent007 Autonomy CI"
            "Venture OS 24x7 Heartbeat"
            "Agent007 Memory Integrity CI"
            "Provider Control Plane CI"
            "Provider Retirement Inventory"
            "Agent007 Revenue Foundation CI"
            "Operational KPIs + Venture 001 Verification"
          )
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push&per_page=100")"
            all_green=true
            for workflow_name in "${expected[@]}"; do
              conclusion="$(jq -r --arg name "$workflow_name" '.workflow_runs[] | select(.name == $name) | .conclusion // ""' <<<"$runs" | head -n1)"
              status="$(jq -r --arg name "$workflow_name" '.workflow_runs[] | select(.name == $name) | .status // ""' <<<"$runs" | head -n1)"
              echo "$workflow_name — status=${status:-missing}; conclusion=${conclusion:-pending}"
              if [ "$conclusion" != "success" ]; then
                all_green=false
              fi
              if [[ "$conclusion" =~ ^(failure|cancelled|timed_out|action_required|startup_failure|stale)$ ]]; then
                echo "CI_GATE_FAILED: $workflow_name"
                exit 1
              fi
            done
            if [ "$all_green" = true ]; then exit 0; fi
            sleep 10
          done
          echo 'CI_GATE_TIMEOUT'
          exit 1

      - name: Verify release architecture before mutation
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/production-release-watchdog.yml
          test "$(jq -r '.git.deploymentEnabled // false' vercel.json)" = false
          bun test tests/release-architecture.test.ts

      - name: Checkout exact certified source
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_SHA" --depth=1
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Capture current production deployment
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          current="$(jq -r '.latestDeployments[0].id // .latestDeployment.id // ""' <<<"$body")"
          echo "deployment_id=$current" >> "$GITHUB_OUTPUT"
          echo "previous_deployment_ids=${current}" >> "$GITHUB_OUTPUT"

      - name: Deploy exact certified main checkout to Vercel production
        id: target
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          output="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" \
            -m githubCommitAuthorName=antoniocan2022-dev \
            -m githubCommitMessage='authorized production deployment' \
            -m githubCommitOrg=antoniocan2022-dev \
            -m githubCommitRef=main \
            -m githubCommitRepo=agent007-ai \
            -m githubCommitSha="$RELEASE_SHA" \
            -m githubDeployment=1 \
            -m githubOrg=antoniocan2022-dev \
            -m githubRepo=agent007-ai 2>&1)"
          printf '%s\n' "$output"
          deployment_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n1)"
          test -n "$deployment_url"
          host="${deployment_url#https://}"
          for attempt in $(seq 1 36); do
            body="$(curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID")"
            state="$(jq -r '.readyState // .state // ""' <<<"$body")"
            echo "Target state: $state"
            if [ "$state" = READY ]; then
              deployment_id="$(jq -r '.id // .uid // ""' <<<"$body")"
              deployed_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // .gitMetadata.commitSha // ""' <<<"$body")"
              test "$deployed_sha" = "$RELEASE_SHA"
              echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
              echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$state" != ERROR ] || exit 1
            sleep 5
          done
          exit 1

      - name: Reconcile canonical production aliases
        shell: bash
        env:
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for domain in agent007-ai.vercel.app agent007-ai-antoniocan2022-devs-projects.vercel.app; do
            curl --fail-with-body --silent --show-error --max-time 20 \
              --request POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v2/deployments/$TARGET_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
              --data "{\"alias\":\"$domain\",\"redirect\":null}" >/dev/null
          done

      - name: Verify canonical aliases and production traffic identity
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
        run: |
          set -euo pipefail
          owners=()
          for domain in agent007-ai.vercel.app agent007-ai-antoniocan2022-devs-projects.vercel.app; do
            body="$(curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v4/aliases/$domain?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")"
            alias_name="$(jq -r '.alias // ""' <<<"$body")"
            project_id="$(jq -r '.projectId // ""' <<<"$body")"
            owner_id="$(jq -r '.deploymentId // ""' <<<"$body")"
            [ "$alias_name" = "$domain" ] || { echo 'STALE_ALIAS'; exit 44; }
            [ "$project_id" = "$VERCEL_PROJECT_ID" ] || { echo 'STALE_ALIAS'; exit 44; }
            owners+=("$owner_id")
          done
          [ "${owners[0]}" = "${owners[1]}" ] || { echo 'DUAL_ALIAS_CONFLICT'; exit 45; }
          [ "${owners[0]}" = "$TARGET_DEPLOYMENT_ID" ] || { echo 'STALE_ALIAS'; exit 44; }

          health="$(curl --fail-with-body --silent --show-error --max-time 30 \
            "$PRODUCTION_URL/api/release-health")"
          echo "$health" | jq .
          test "$(jq -r '.ok // false' <<<"$health")" = true || { echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; }
          test "$(jq -r '.releaseCommit // ""' <<<"$health")" = "$EXPECTED_RELEASE_SHA" || { echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; }
          test "$(jq -r '.deploymentId // ""' <<<"$health")" = "$TARGET_DEPLOYMENT_ID" || { echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; }
          test "$(jq -r '.proof.tripleProof // false' <<<"$health")" = true || { echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; }
          test "$(jq -r '.proof.deploymentIdentityVerified // false' <<<"$health")" = true || { echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; }
          test "$(jq -r '.actualExecution.verified // false' <<<"$health")" = true || { echo 'TRAFFIC_OWNERSHIP_UNPROVEN'; exit 46; }

      - name: Verify fresh production release health
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error --max-time 30 "$PRODUCTION_URL/api/release-health")"
          echo "$health" | jq .
          test "$(jq -r '.ok // false' <<<"$health")" = true
          test "$(jq -r '.releaseCommit // ""' <<<"$health")" = "$RELEASE_SHA"
          test "$(jq -r '.deploymentId // ""' <<<"$health")" = "$TARGET_DEPLOYMENT_ID"
          test "$(jq -r '.proof.tripleProof // false' <<<"$health")" = true
          test "$(jq -r '.proof.deploymentIdentityVerified // false' <<<"$health")" = true
          test "$(jq -r '.actualExecution.verified // false' <<<"$health")" = true
          test -n "$(jq -r '.organizationGraphFingerprint // .proof.organizationGraphFingerprint // ""' <<<"$health")"
          test "$(jq -r '.releaseGate // true' <<<"$health")" = true

      - name: Verify no unresolved critical production errors
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 -o /tmp/home.html -w '%{http_code}' "$PRODUCTION_URL/")"
          test "$status" = 200

      - name: Write release certification manifest
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          POINTER_SHA: ${{ steps.release.outputs.pointer_sha }}
          TARGET_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
          TARGET_DEPLOYMENT_URL: ${{ steps.target.outputs.deployment_url }}
        run: |
          set -euo pipefail
          jq -n \
            --arg sha "$RELEASE_SHA" \
            --arg pointerSha "$POINTER_SHA" \
            --arg deploymentId "$TARGET_DEPLOYMENT_ID" \
            --arg deploymentUrl "$TARGET_DEPLOYMENT_URL" \
            '{status:"CERTIFIED_PRODUCTION_RELEASE",repository:"antoniocan2022-dev/agent007-ai",ref:"main",releaseSha:$sha,releasePointerSha:$pointerSha,deploymentId:$deploymentId,deploymentUrl:$deploymentUrl,authorization:"DEPLOY_AGENT007_MAIN",gitAutoDeployment:false}' > production-release-certification.json

      - name: Upload release certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent007-production-release-certification
          path: production-release-certification.json
