name: Agent007 P1-P4 Hardening

on:
  push:
    branches:
      - feat/ceo-p1-p4-conversational-integrity

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message != 'chore(ceo): apply P1-P4 conversational hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ceo-p1-p4-conversational-integrity
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply P1-P4 hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one replacement in {path}; found {count}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          Path("src/lib/ceo-conversational-signals.ts").write_text('''const RETROSPECTIVE_REQUEST_RE = /\\b(?:why did (?:we|i)|what did we|what were we|what was the|how did we arrive at|where did we land on|remind me why|why was)\\b[^?]{0,180}\\b(?:choose|chose|decide|decided|select|selected|pick|picked|reason|reasoning|rationale|decision|plan|priority|name|called)\\b/i\nconst EXPLICIT_RETROSPECTIVE_RE = /\\b(?:what did we decide|what did we discuss|what did we choose|why did we choose|why did we decide|what was the reasoning|what led us to|how did we arrive at)\\b/i\nconst CORRECTION_REQUEST_RE = /^\\s*(?:no\\b|that(?:'s| is)\\s+(?:not|n't)\\b|i\\s+mean\\b|what\\s+i\\s+meant\\b|correction\\b)/i\nconst CURRENT_TOPIC_REQUEST_RE = /\\b(?:what are we discussing(?: now)?|what(?:'s| is)\\s+(?:the\\s+)?(?:current\\s+)?(?:topic|subject)|what is this about)\\b/i\n\nexport function isRetrospectiveConversationRequest(text: string): boolean {\n  const value = text.trim()\n  return EXPLICIT_RETROSPECTIVE_RE.test(value) || RETROSPECTIVE_REQUEST_RE.test(value)\n}\n\nexport function isCorrectionRequest(text: string): boolean {\n  return CORRECTION_REQUEST_RE.test(text)\n}\n\nexport function isCurrentTopicRequest(text: string): boolean {\n  return CURRENT_TOPIC_REQUEST_RE.test(text)\n}\n''')

          replace_once(
              "src/lib/ceo-pre-router.ts",
              "import type { CanonicalConversationContext } from './ceo-cognitive-conversation'\n",
              "import type { CanonicalConversationContext } from './ceo-cognitive-conversation'\nimport { isRetrospectiveConversationRequest } from './ceo-conversational-signals'\n",
          )
          replace_once(
              "src/lib/ceo-pre-router.ts",
              "  if (/\\b(?:analy[sz]e|analysis|assess|evaluate|review|diagnose|compare|strategy|strategic|root\\s+cause)\\b/i.test(text)) return 'analysis'\n  if (/\\b(?:should|recommend|recommendation|choose|pick|decision)\\b/i.test(text)) return 'decision'\n",
              "  if (/\\b(?:analy[sz]e|analysis|assess|evaluate|review|diagnose|compare|strategy|strategic|root\\s+cause)\\b/i.test(text)) return 'analysis'\n  // Retrospective questions are conversational/history requests, not prospective decision requests.\n  if (isRetrospectiveConversationRequest(text)) return 'conversation'\n  if (/\\b(?:should|recommend|recommendation|choose|pick|decision)\\b/i.test(text)) return 'decision'\n",
          )

          replace_once(
              "src/lib/ceo-conversation-state.ts",
              "import { containsInternalArtifactToken } from './ceo-behavioral-policy'\n",
              "import { containsInternalArtifactToken } from './ceo-behavioral-policy'\nimport { isCorrectionRequest } from './ceo-conversational-signals'\n",
          )
          replace_once(
              "src/lib/ceo-conversation-state.ts",
              "const CORRECTION_RE = /^\\s*(?:no\\b|that(?:'s| is)\\s+(?:not|n't)\\b|i\\s+mean\\b|what\\s+i\\s+meant\\b|correction\\b)/i\n",
              "",
          )
          replace_once(
              "src/lib/ceo-conversation-state.ts",
              "  const recentCorrections = uniqueRecent(userRows.filter((row) => CORRECTION_RE.test(row.content)).map((row) => normalize(row.content)), 6)\n",
              "  const recentCorrections = uniqueRecent(userRows.filter((row) => isCorrectionRequest(row.content)).map((row) => normalize(row.content)), 6)\n",
          )

          replace_once(
              "src/lib/ceo-degraded-mode.ts",
              "import { filterConversationalMemories } from './ceo-memory-visibility'\n",
              "import { filterConversationalMemories } from './ceo-memory-visibility'\nimport { isCorrectionRequest } from './ceo-conversational-signals'\n",
          )
          replace_once(
              "src/lib/ceo-degraded-mode.ts",
              "if (/^\\s*(?:no|nah)\\b/i.test(objective) || /\\b(i meant|i mean|rather|instead)\\b/i.test(lower)) return `Got it. The correction is clear, and I’ll treat “${objective.replace(/^\\s*(?:no|nah)[,\\s]*/i, '').replace(/\\s*$/,'').slice(0, 500)}” as the active direction from here.`;",
              "if (isCorrectionRequest(objective)) return `Got it. The correction is clear, and I’ll treat “${objective.replace(/^\\s*(?:no|nah)[,\\s]*/i, '').replace(/\\s*$/,'').slice(0, 500)}” as the active direction from here.`;",
          )

          replace_once(
              "src/lib/ceo-response-quality-gate.ts",
              "import { containsInternalArtifactToken, safeConversationRows } from './ceo-behavioral-policy'\n",
              "import { containsInternalArtifactToken, safeConversationRows } from './ceo-behavioral-policy'\nimport { isCurrentTopicRequest } from './ceo-conversational-signals'\n",
          )
          replace_once(
              "src/lib/ceo-response-quality-gate.ts",
              "function isReferenceContinuation(objective: string): boolean { return EXPLICIT_CONTINUATION_RE.test(objective) }\n",
              "function isReferenceContinuation(objective: string): boolean { return EXPLICIT_CONTINUATION_RE.test(objective) }\nfunction conversationStateAlignment(input: { objective: string; content: string; priorTurns: readonly PersistedConversationRow[]; resolvedReferences?: readonly ConversationReference[] }): { aligned: boolean; reason?: string } {\n  if (!input.priorTurns.length) return { aligned: true }\n  const state = deriveCeoConversationState(input.priorTurns, input.objective)\n  const continuable = state.threads.filter((thread) => thread.status === 'active' || thread.status === 'paused').sort((a, b) => b.lastTouchedAt - a.lastTouchedAt)\n  const activeThread = continuable[0]\n  const resolved = (input.resolvedReferences ?? []).find((reference) => Boolean(reference.resolvedText) && !reference.ambiguous && reference.confidence >= 0.7)\n  const correction = state.recentCorrections.at(-1)\n  const currentTopic = isCurrentTopicRequest(input.objective)\n  const continuation = isReferenceContinuation(input.objective)\n  if (currentTopic) {\n    const target = [activeThread?.title, activeThread?.currentObjective, activeThread?.topic, state.topic, activeThread?.lastAssistantReply].filter(Boolean).join(' ')\n    if (!target) return { aligned: false, reason: 'The current conversation has no authoritative active-topic target to answer from.' }\n    if (tokenOverlap(target, input.content) < 0.08) return { aligned: false, reason: 'The response does not align with the authoritative current conversation topic.' }\n  }\n  if (continuation && activeThread) {\n    const target = [activeThread.title, activeThread.currentObjective, activeThread.topic, activeThread.lastAssistantReply].filter(Boolean).join(' ')\n    if (tokenOverlap(target, input.content) < 0.08) return { aligned: false, reason: 'The continuation response does not align with the active or paused conversation thread.' }\n  }\n  if (resolved?.resolvedText && tokenOverlap(resolved.resolvedText, input.content) < 0.08) return { aligned: false, reason: 'The response does not align with the resolved conversational reference.' }\n  if (correction && tokenOverlap(correction, input.content) < 0.08 && !/\\b(?:understood|got it|acknowledge|treat|priority|direction|instead|correction)\\b/i.test(input.content)) return { aligned: false, reason: 'The response does not demonstrate preservation of the latest user correction.' }\n  return { aligned: true }\n}\n",
          )
          replace_once(
              "src/lib/ceo-response-quality-gate.ts",
              "function p2ResponseIntegrity(input: { objective: string; content: string; path: EvaluationPath; conversational: boolean; coverage: boolean; responseAction: ResponseAction; priorTurns?: readonly PersistedConversationRow[]; externalExecutionSucceeded?: boolean })",
              "function p2ResponseIntegrity(input: { objective: string; content: string; path: EvaluationPath; conversational: boolean; coverage: boolean; responseAction: ResponseAction; priorTurns?: readonly PersistedConversationRow[]; externalExecutionSucceeded?: boolean; resolvedReferences?: readonly ConversationReference[] }): { currentObjectiveMatch: boolean; requestedActionSatisfied: boolean; crossObjectiveSubstitution: boolean; staleResponseLikelihood: number; internalArtifactLeakage: boolean; conversationStateAligned: boolean; conversationStateAlignmentReason?: string }",
          )
          replace_once(
              "function p2ResponseIntegrity(input: { objective: string; content: string; path: EvaluationPath; conversational: boolean; coverage: boolean; responseAction: ResponseAction; priorTurns?: readonly PersistedConversationRow[]; externalExecutionSucceeded?: boolean; resolvedReferences?: readonly ConversationReference[] }): { currentObjectiveMatch: boolean; requestedActionSatisfied: boolean; crossObjectiveSubstitution: boolean; staleResponseLikelihood: number; internalArtifactLeakage: boolean; conversationStateAligned: boolean; conversationStateAlignmentReason?: string } { const continuation",
              "function p2ResponseIntegrity(input: { objective: string; content: string; path: EvaluationPath; conversational: boolean; coverage: boolean; responseAction: ResponseAction; priorTurns?: readonly PersistedConversationRow[]; externalExecutionSucceeded?: boolean; resolvedReferences?: readonly ConversationReference[] }): { currentObjectiveMatch: boolean; requestedActionSatisfied: boolean; crossObjectiveSubstitution: boolean; staleResponseLikelihood: number; internalArtifactLeakage: boolean; conversationStateAligned: boolean; conversationStateAlignmentReason?: string } { const continuation",
          )
          replace_once(
              "return { currentObjectiveMatch, requestedActionSatisfied: requestedActionSatisfied(input.responseAction, input.objective, input.content, input.coverage, input.externalExecutionSucceeded, input.conversational), crossObjectiveSubstitution, staleResponseLikelihood, internalArtifactLeakage: containsInternalArtifactToken(input.content) } }",
              "const stateAlignment = conversationStateAlignment({ objective: input.objective, content: input.content, priorTurns: prior, resolvedReferences: input.resolvedReferences }); return { currentObjectiveMatch, requestedActionSatisfied: requestedActionSatisfied(input.responseAction, input.objective, input.content, input.coverage, input.externalExecutionSucceeded, input.conversational), crossObjectiveSubstitution, staleResponseLikelihood, internalArtifactLeakage: containsInternalArtifactToken(input.content), conversationStateAligned: stateAlignment.aligned, conversationStateAlignmentReason: stateAlignment.reason } }",
          )
          replace_once(
              "const integrity=p2ResponseIntegrity({objective:input.objective,content:input.content,path:input.path,conversational,coverage,responseAction,priorTurns,externalExecutionSucceeded:input.externalExecutionSucceeded});",
              "const integrity=p2ResponseIntegrity({objective:input.objective,content:input.content,path:input.path,conversational,coverage,responseAction,priorTurns,externalExecutionSucceeded:input.externalExecutionSucceeded,resolvedReferences:input.resolvedReferences});",
          )
          replace_once(
              "if(integrity.internalArtifactLeakage)reasons.push('The response contains internal execution artifacts that must remain non-user-facing.'); if(falseCompletionClaim)",
              "if(integrity.internalArtifactLeakage)reasons.push('The response contains internal execution artifacts that must remain non-user-facing.'); if(!integrity.conversationStateAligned)reasons.push(`The response did not preserve authoritative conversational state${integrity.conversationStateAlignmentReason ? `: ${integrity.conversationStateAlignmentReason}` : '.'}`); if(falseCompletionClaim)",
          )
          replace_once(
              "!integrity.staleResponseLikelihood<0.85&&!integrity.internalArtifactLeakage&&!falseCompletionClaim&&",
              "!integrity.staleResponseLikelihood<0.85&&!integrity.internalArtifactLeakage&&integrity.conversationStateAligned&&!falseCompletionClaim&&",
          )
          replace_once(
              "else if(integrity.crossObjectiveSubstitution||integrity.staleResponseLikelihood>=0.85||!integrity.currentObjectiveMatch||!integrity.requestedActionSatisfied)failureReason='continuity_failure';",
              "else if(integrity.crossObjectiveSubstitution||integrity.staleResponseLikelihood>=0.85||!integrity.currentObjectiveMatch||!integrity.requestedActionSatisfied||!integrity.conversationStateAligned)failureReason='continuity_failure';",
          )

          contract = Path("src/lib/ceo-cognitive-contract.ts")
          text = contract.read_text()
          old = "export interface CeoResponseIntegritySummary { currentObjectiveMatch: boolean; requestedActionSatisfied: boolean; crossObjectiveSubstitution: boolean; staleResponseLikelihood: number; internalArtifactLeakage: boolean }"
          new = "export interface CeoResponseIntegritySummary { currentObjectiveMatch: boolean; requestedActionSatisfied: boolean; crossObjectiveSubstitution: boolean; staleResponseLikelihood: number; internalArtifactLeakage: boolean; conversationStateAligned?: boolean; conversationStateAlignmentReason?: string }"
          if text.count(old) != 1:
              raise SystemExit("CeoResponseIntegritySummary definition not found exactly once")
          contract.write_text(text.replace(old, new, 1))

          test_file = Path("tests/ceo-conversation-semantics.test.ts")
          text = test_file.read_text()
          if "CEO conversation hardening P1-P4" not in text:
              text = text.replace(
                  "import { deriveCeoConversationState, resolveConversationReferences } from '@/lib/ceo-conversation-state'\n",
                  "import { deriveCeoConversationState, resolveConversationReferences } from '@/lib/ceo-conversation-state'\nimport { preRouteCeoRequest } from '@/lib/ceo-pre-router'\nimport { isCorrectionRequest } from '@/lib/ceo-conversational-signals'\n",
              )
              text = text.rstrip() + """\n\ndescribe('CEO conversation hardening P1-P4', () => {\n  test('retrospective choose questions stay in the conversational lane', () => {\n    const result = preRouteCeoRequest([{ role: 'user', content: 'Why did we choose Phoenix?' }])\n    expect(result.executionContract.intent).toBe('conversation')\n  })\n\n  test('correction semantics are canonical and recognize explicit correction wording', () => {\n    expect(isCorrectionRequest('Correction: the priority is recurring revenue.')).toBe(true)\n    expect(isCorrectionRequest('This is a different topic.')).toBe(false)\n  })\n\n  test('quality gate rejects a fluent answer that abandons the authoritative current topic', () => {\n    const rows = [\n      { role: 'user', content: 'Now let\\'s forget that and discuss the provider architecture.', createdAt: '2026-09-06T12:00:00.000Z' },\n      { role: 'assistant', content: 'We are discussing provider architecture and provider resilience.', createdAt: '2026-09-06T12:00:05.000Z' },\n    ] as const\n    const result = evaluateCeoQuality({\n      objective: 'What are we discussing now?',\n      content: 'We are discussing acceptance, acceleration, and the concept of being able to achieve goals.',\n      path: 'fast',\n      intent: 'conversation',\n      priorTurns: rows,\n      evidenceVerificationApplicable: false,\n    })\n    expect(result.decision).not.toBe('PASS')\n    expect(result.failureReason).toBe('continuity_failure')\n    expect(result.responseIntegrity?.conversationStateAligned).toBe(false)\n  })\n})\n"""
              test_file.write_text(text)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Focused conversation tests
        run: bun test tests/ceo-conversation-semantics.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Governance audits
        run: |
          bun run audit:ceo-phase-1-8
          bun run audit:ceo-trust-boundary

      - name: Commit hardening to feature branch
        run: |
          git status --short
          git add src/lib/ceo-conversational-signals.ts src/lib/ceo-pre-router.ts src/lib/ceo-conversation-state.ts src/lib/ceo-degraded-mode.ts src/lib/ceo-response-quality-gate.ts src/lib/ceo-cognitive-contract.ts tests/ceo-conversation-semantics.test.ts
          git commit -m "chore(ceo): apply P1-P4 conversational hardening"
          git push origin HEAD:feat/ceo-p1-p4-conversational-integrity
