name: Architecture Finalize
on:
  push:
    branches: [agent/architecture-control-plane-5-9]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !startsWith(github.event.head_commit.message, '[architecture-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Finalize universal hierarchy mediation
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/lib/orchestrator.ts')
          s=p.read_text()
          old="""const targetLevel = authorityLevelFor(sub.id)\n            assertDelegationAllowed({ actorId: 'ceo', actorLevel: 'CEO', targetId: targetLevel === 'LEADER' ? 'vid' : sub.id, targetLevel: targetLevel === 'LEADER' ? 'VID' : targetLevel })"""
          new="""const targetLevel = authorityLevelFor(sub.id)\n            if (targetLevel === 'LEADER') {\n              assertDelegationAllowed({ actorId: 'vid', actorLevel: 'VID', targetId: sub.id, targetLevel: 'LEADER', delegatedBy: 'ceo' })\n            } else {\n              assertDelegationAllowed({ actorId: 'ceo', actorLevel: 'CEO', targetId: sub.id, targetLevel })\n            }"""
          if old not in s: raise SystemExit('parallel hierarchy anchor missing')
          s=s.replace(old,new,1)
          old="""const targetLevel = authorityLevelFor(sub.id)\n        assertDelegationAllowed({ actorId: 'ceo', actorLevel: 'CEO', targetId: targetLevel === 'LEADER' ? 'vid' : sub.id, targetLevel: targetLevel === 'LEADER' ? 'VID' : targetLevel })"""
          new="""const targetLevel = authorityLevelFor(sub.id)\n        if (targetLevel === 'LEADER') {\n          assertDelegationAllowed({ actorId: 'vid', actorLevel: 'VID', targetId: sub.id, targetLevel: 'LEADER', delegatedBy: 'ceo' })\n        } else {\n          assertDelegationAllowed({ actorId: 'ceo', actorLevel: 'CEO', targetId: sub.id, targetLevel })\n        }"""
          if old not in s: raise SystemExit('single hierarchy anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "Agent007 Architecture"
          git config user.email "agent007@local"
          git add src/lib/orchestrator.ts
          git diff --cached --check
          git commit -m "[architecture-finalize] enforce VID mediation for leader dispatches" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
