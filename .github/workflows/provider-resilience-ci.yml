name: Provider Resilience CI

on:
  # Unfiltered on push: this workflow is one of the release watchdog's required exact-SHA
  # certification gates (production-release-watchdog.yml), which polls for a run of this exact
  # name on every release SHA. A path filter here would mean a release that doesn't happen to
  # touch these specific files never produces a run at all, and the watchdog would wait out its
  # full timeout and fail every such deploy. Every other required gate's push trigger is
  # unfiltered for the same reason (see provider-control-plane-ci.yml for the identical pattern);
  # pull_request stays path-filtered below for fast, targeted PR feedback.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/provider-control-plane.ts'
      - 'src/lib/provider-intelligence.ts'
      - 'src/lib/provider-runtime-v2.ts'
      - 'src/lib/outcome-intelligence.ts'
      - 'tests/provider-auth-failover.test.ts'
      - '.github/workflows/provider-resilience-ci.yml'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

env:
  NEXTAUTH_SECRET: ci-only-agent007-nextauth-secret
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent007_ci

jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run provider resilience regression
        run: bun test --max-concurrency=1 tests/provider-auth-failover.test.ts
      - name: Typecheck provider architecture
        run: bunx tsc -p tsconfig.ci.json --noEmit
      - name: Lint provider architecture
        run: bunx eslint src/lib/provider-control-plane.ts src/lib/provider-intelligence.ts src/lib/provider-runtime-v2.ts src/lib/outcome-intelligence.ts tests/provider-auth-failover.test.ts
