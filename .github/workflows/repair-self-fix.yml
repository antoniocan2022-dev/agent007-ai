name: Repair self-fix provider diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Repair syntax surgically
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/lib/self-fix-tools.ts')
          s = p.read_text()

          d0 = s.index('export async function toolDiagnoseLlm')
          d1 = s.index('/* ------------------------------------------------------------------ */\n/* 3. force_refresh_settings', d0)
          diagnose = '''export async function toolDiagnoseLlm(args: any, _ctx: ToolContext): Promise<ToolResult> {
            const { getCanonicalProviderTelemetry } = await import('./canonical-llm-router')
            const telemetry = getCanonicalProviderTelemetry()
            const healthy = telemetry.providers.filter((provider) => provider.status === 'healthy').map((provider) => provider.provider)
            const available = telemetry.providers.filter((provider) => provider.configured && provider.status !== 'rate_limited').map((provider) => provider.provider)
            return okResult(
              `LLM diagnosis complete — ${telemetry.healthyCount}/${telemetry.configuredCount} configured providers healthy`,
              `LLM PROVIDER DIAGNOSIS\\n${'='.repeat(60)}\\nConfigured: ${telemetry.configuredCount}/${telemetry.providerCount}\\nHealthy: ${telemetry.healthyCount}\\nAvailable: ${telemetry.availableCount}\\nHealthy providers: ${healthy.join(', ') || '(none)'}\\nAvailable providers: ${available.join(', ') || '(none)'}\\n\\nFULL TELEMETRY:\\n${JSON.stringify(telemetry, null, 2)}`
            )
          }

          '''
          s = s[:d0] + diagnose + s[d1:]

          c0 = s.index('  // ── LLM providers ──────────────────────────────────────────────────', s.index('export async function toolComprehensiveSelfCheck'))
          c1 = s.index('  // ── Final summary', c0)
          llm = '''  // ── LLM providers ──────────────────────────────────────────────────
            try {
              const { getCanonicalProviderTelemetry } = await import('./canonical-llm-router')
              const telemetry = getCanonicalProviderTelemetry()
              report.sections.llm = telemetry
              if (telemetry.configuredCount === 0) {
                report.sections.llm.issue = 'No canonical LLM provider is configured'
                report.overall = 'fail'
                report.issueCount++
              }
            } catch (e: any) {
              report.sections.llm = { error: e?.message }
              report.overall = 'fail'
              report.issueCount++
            }

          '''
          s = s[:c0] + llm + s[c1:]

          if "z-ai-web-dev-sdk" in s or "ZAI.create" in s or "GEMINI_API_KEY" in s:
              raise SystemExit('legacy provider references remain after repair')

          p.write_text(s)

      - name: TypeScript syntax check
        run: |
          set -euo pipefail
          bun --version || true
          grep -n -E "z-ai-web-dev-sdk|ZAI\.create|GEMINI_API_KEY" src/lib/self-fix-tools.ts && exit 1 || true

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/self-fix-tools.ts
          git rm .github/workflows/repair-self-fix.yml
          git commit -m 'fix: repair self-fix provider diagnostics'
          git push origin HEAD:main
