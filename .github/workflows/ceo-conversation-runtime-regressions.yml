name: CEO Conversation Runtime Regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ceo-conversation-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conversation-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CEO conversation runtime regressions
        run: bun test tests/ceo-conversation-runtime-regressions.test.ts tests/ceo-phase-1-3-architecture.test.ts tests/ceo-personality-and-resilience.test.ts
