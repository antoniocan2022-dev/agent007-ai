services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent007_dev
    ports:
      - '5432:5432'
    volumes:
      - agent007-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agent007_dev']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  agent007-db-data:
